    (function installBrowserStorageShim() {

      if (window.storage && typeof window.storage.get === "function") return; 

      const PREFIX = "pda_storage__";
      const keyFor = (key, shared) => PREFIX + (shared ? "shared__" : "personal__") + key;

      window.storage = {
        async get(key, shared) {
          const raw = window.localStorage.getItem(keyFor(key, shared));
          if (raw === null || raw === undefined) {
            throw new Error("Key not found: " + key);
          }
          return { key, value: raw, shared: !!shared };
        },
        async set(key, value, shared) {
          try {
            window.localStorage.setItem(keyFor(key, shared), String(value));
            return { key, value, shared: !!shared };
          } catch (e) {
            return null;
          }
        },
        async delete(key, shared) {
          try {
            window.localStorage.removeItem(keyFor(key, shared));
            return { key, deleted: true, shared: !!shared };
          } catch (e) {
            return null;
          }
        },
        async list(prefix, shared) {
          try {
            const scope = PREFIX + (shared ? "shared__" : "personal__");
            const keys = [];
            for (let i = 0; i < window.localStorage.length; i++) {
              const k = window.localStorage.key(i);
              if (k && k.startsWith(scope + (prefix || ""))) keys.push(k.slice(scope.length));
            }
            return { keys, prefix, shared: !!shared };
          } catch (e) {
            return { keys: [] };
          }
        },
      };
    })();

          flowHot: customForm.inputMode === "FLOW" ? Number(customForm.flowHot) : null,

        const nextFixtures = [...fixtures, row];
        setFixtures(nextFixtures);
        setCalculated(false);
        resetCustomForm();
        setCustomFormOpen(false);

    function AuthScreen() {
      const [mode, setMode] = useState("LOGIN"); // "LOGIN" | "SIGNUP"
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [msg, setMsg] = useState("");

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(""); 
        setMsg(""); 
        setLoading(true);

        try {
          if (mode === "SIGNUP") {
            const { data, error: signUpError } = await supabase.auth.signUp({ email, password });
            if (signUpError) throw signUpError;
            
            // Supabase trả về rỗng identities nếu email đã tồn tại nhưng tắt email confirmation
            if (data?.user?.identities?.length === 0) {
              throw new Error("Email đã tồn tại. Vui lòng đăng nhập.");
            }
            
            setMsg("Đăng ký thành công! Đang tự động đăng nhập...");
            // Đợi một chút rồi tự động đăng nhập
            setTimeout(async () => {
              await supabase.auth.signInWithPassword({ email, password });
            }, 1000);
          } else {
            const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
            if (signInError) throw signInError;
          }
        } catch (err) {
          let errorText = err.message;
          if (errorText.includes("Invalid login credentials")) errorText = "Sai email hoặc mật khẩu.";
          else if (errorText.includes("already registered")) errorText = "Email đã tồn tại. Vui lòng đăng nhập.";
          else if (errorText.includes("Password should be at least")) errorText = "Mật khẩu phải có ít nhất 6 ký tự.";
          else if (errorText.includes("Email rate limit exceeded")) errorText = "Gửi yêu cầu quá nhiều lần. Thử lại sau.";
          setError(errorText);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen w-full flex items-center justify-center bg-gradient-to-br from-[#1F7A70] to-[#4FB3A6] p-5">
          <div className="bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center border border-[#EDE6D6]">
            <div className="w-16 h-16 rounded-full bg-[#EAF5F2] flex items-center justify-center mx-auto mb-4 text-[#1F7A70]">
              <Droplet size={32} />
            </div>
            <h2 className="text-2xl font-bold text-[#243B36] mb-1">
              {mode === "LOGIN" ? "Chào mừng trở lại!" : "Tạo tài khoản mới"}
            </h2>
            <p className="text-sm text-[#7D8B87] mb-6">
              Vui lòng {mode === "LOGIN" ? "đăng nhập" : "đăng ký"} để sử dụng Pipe Design Assistant.
            </p>

            <form onSubmit={handleSubmit} className="space-y-4 text-left">
              <div>
                <label className="block text-xs font-medium text-[#7D8B87] mb-1.5">Email</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="name@example.com"
                  className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/40"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-[#7D8B87] mb-1.5">Mật khẩu</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/40"
                  required
                />
              </div>

              {error && (
                <div className="text-xs text-[#C13A3A] bg-[#FBE7E7] rounded-lg p-2.5 flex items-center gap-1.5 leading-snug">
                  <AlertTriangle size={14} className="shrink-0" /> {error}
                </div>
              )}
              {msg && (
                <div className="text-xs text-[#1E8A50] bg-[#E4F6EC] rounded-lg p-2.5 flex items-center gap-1.5 leading-snug">
                  <CheckCircle2 size={14} className="shrink-0" /> {msg}
                </div>
              )}

              <button
                type="submit"
                disabled={loading}
                className={`w-full flex items-center justify-center gap-2 rounded-xl py-3 font-semibold text-white text-sm transition
                  ${loading ? "bg-[#DCD5C2] cursor-not-allowed" : "bg-[#1F7A70] hover:bg-[#18625A] hover:shadow-md"}`}
              >
                {loading ? "Đang xử lý..." : (mode === "LOGIN" ? "Đăng nhập" : "Đăng ký")} <ArrowRight size={16} />
              </button>
            </form>

            <div className="mt-6 text-sm text-[#7D8B87]">
              {mode === "LOGIN" ? (
                <>Chưa có tài khoản? <button onClick={() => { setMode("SIGNUP"); setError(""); setMsg(""); }} className="text-[#1F7A70] font-medium hover:underline">Đăng ký ngay</button></>
              ) : (
                <>Đã có tài khoản? <button onClick={() => { setMode("LOGIN"); setError(""); setMsg(""); }} className="text-[#1F7A70] font-medium hover:underline">Đăng nhập</button></>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. COMPONENT KHOÁ ỨNG DỤNG VÀ THÔNG BÁO DÙNG THỬ
    // ==========================================
    function LockScreen({ onLogout }) {
      return (
        <div className="min-h-screen flex items-center justify-center bg-[#F5F7FA] p-5">
          <div className="bg-white rounded-3xl shadow-xl p-8 max-w-md w-full text-center border border-[#EDE6D6]">
            <div className="w-16 h-16 rounded-full bg-[#FBE7E7] flex items-center justify-center mx-auto mb-4 text-[#C13A3A]">
              <Lock size={32} />
            </div>
            <h2 className="text-2xl font-bold text-[#243B36] mb-2">Hết hạn dùng thử</h2>
            <p className="text-sm text-[#7D8B87] mb-6 leading-relaxed">
              Thời gian 14 ngày dùng thử miễn phí của bạn đã kết thúc. Vui lòng nâng cấp tài khoản hoặc liên hệ Admin để tiếp tục sử dụng ứng dụng.
            </p>
            <button onClick={onLogout} className="text-[#1F7A70] hover:underline text-sm font-medium flex items-center gap-1 mx-auto">
              <LogOut size={14}/> Đăng xuất
            </button>
          </div>
        </div>
      );
    }

    function TrialBadge({ daysLeft, user, onLogout }) {
      return (
        <div className="bg-[#FEF3DE] border border-[#F7B955]/40 text-[#B8791A] px-4 py-2.5 rounded-2xl flex flex-wrap gap-3 items-center justify-between shadow-sm mb-6">
          <div className="flex items-center gap-2">
            <TrendingUp size={16} />
            <span className="font-semibold text-sm">Dùng thử miễn phí: Còn lại {daysLeft} ngày</span>
          </div>
          <div className="flex items-center gap-4">
            <span className="text-xs font-medium opacity-80">{user.email}</span>
            <button onClick={onLogout} className="text-[#C13A3A] hover:opacity-70 text-xs font-semibold flex items-center gap-1 transition">
              <LogOut size={14}/> Đăng xuất
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 7. MAIN APP VÀ CÁC HÀM CÒN LẠI
    // ==========================================
    function sheetRows(wb, name) {
      const ws = wb.Sheets[name];
      if (!ws) return [];
      return window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
    }

    function parseWorkbook(wb) {
      const pipeSizes = sheetRows(wb, "Pipe_Sizes")
        .filter(r => r[0] != null && r[0] !== "ID")
        .map(r => ({ material: r[1], dn: r[4], od: r[5], id: r[6] }));

      const materials = sheetRows(wb, "Material")
        .filter(r => r[0] != null && r[0] !== "Material")
        .map(r => ({ material: r[0], c: r[1], roughness: r[3] }));

      const fixtures = sheetRows(wb, "Fixture Unit")
        .filter(r => r[0] != null && r[0] !== "Standard")
        .map(r => ({
          standard: r[0], systemType: r[1],
          name: typeof r[2] === "string" ? r[2].trim() : r[2],
          abbr: r[3], fuCold: r[4], fuHot: r[5], fuTotal: r[6],
        }));

      const fu2flow = sheetRows(wb, "FU to flowrate")
        .filter(r => r[0] != null && r[0] !== "Standard")
        .map(r => ({ standard: r[0], type: r[1], fu: r[2], ls: r[4] }))
        .filter(r => typeof r.fu === "number");

      const velocity = sheetRows(wb, "Velocity Criteria")
        .filter(r => r[0] != null && r[0] !== "Standard")
        .map(r => ({ standard: r[0], building: r[1], system: r[2], recommended: r[3], maximum: r[4] }));

      return { pipeSizes, materials, fixtures, fu2flow, velocity };
    }

    const IMPORTED_DB_STORAGE_KEY = "pda_imported_db_v1";

    function migrateStandardTypo(db) {
      if (!db) return db;
      const FIX = { "AS NSZ": "AS NZS" };
      const fixStd = s => (s in FIX ? FIX[s] : s);
      return {
        ...db,
        fixtures: Array.isArray(db.fixtures)
          ? db.fixtures.map(f => (f.standard in FIX ? { ...f, standard: fixStd(f.standard) } : f))
          : db.fixtures,
        fu2flow: Array.isArray(db.fu2flow)
          ? db.fu2flow.map(r => (r.standard in FIX ? { ...r, standard: fixStd(r.standard) } : r))
          : db.fu2flow,
        velocity: Array.isArray(db.velocity)
          ? db.velocity.map(v => (v.standard in FIX ? { ...v, standard: fixStd(v.standard) } : v))
          : db.velocity,
      };
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }
      static getDerivedStateFromError(error) {
        return { error };
      }
      componentDidCatch(error, info) {
        console.error("[ErrorBoundary] Lỗi render không mong muốn:", error);
        console.error("[ErrorBoundary] Component stack:", info && info.componentStack);
      }
      render() {
        if (this.state.error) {
          return (
            <div style={{ padding: 24, fontFamily: "sans-serif", maxWidth: 560, margin: "48px auto" }}>
              <h2 style={{ color: "#C13A3A", marginBottom: 8 }}>Đã xảy ra lỗi không mong muốn</h2>
              <p style={{ color: "#444", marginBottom: 12 }}>
                Ứng dụng gặp lỗi khi hiển thị. Thiết kế/dữ liệu hiện tại không bị mất — bấm "Tải lại trang" rồi thử lại thao tác vừa làm.
              </p>
              <p style={{ fontSize: 12, color: "#7D8B87", background: "#FAF7EF", padding: 10, borderRadius: 8, wordBreak: "break-word" }}>
                Chi tiết lỗi (để báo cáo): {String((this.state.error && this.state.error.message) || this.state.error)}
              </p>
              <button
                onClick={() => window.location.reload()}
                style={{ marginTop: 16, padding: "8px 18px", background: "#1F7A70", color: "#fff", border: "none", borderRadius: 10, cursor: "pointer", fontSize: 14 }}
              >
                Tải lại trang
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      // Xác thực Supabase
      const [user, setUser] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);

      useEffect(() => {
        // Lấy session khởi tạo
        supabase.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
          setAuthChecked(true);
        });

        // Lắng nghe thay đổi đăng nhập/đăng xuất
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const [screen, setScreen] = useState("m1");
      const [db, setDb] = useState(DEFAULT_DB);
      const [usingCustom, setUsingCustom] = useState(false);

      const [standard, setStandard] = useState("IPC");
      const [buildingType, setBuildingType] = useState("Hotel");
      const [systemType, setSystemType] = useState("");
      const [waterSystem, setWaterSystem] = useState("Cold Water");
      const [flushingType, setFlushingType] = useState("");
      
      const [fixtures, setFixtures] = useState(() => buildInitialFixtureRows(DEFAULT_DB, "IPC", ""));
      const [calculated, setCalculated] = useState(false);

      const standardOptions = useMemo(() => {
        const set = new Set();
        db.fixtures.forEach(f => { if (f.standard) set.add(f.standard); });
        return Array.from(set);
      }, [db]);

      useEffect(() => {
        if (standardOptions.length > 0 && !standardOptions.includes(standard)) {
          setStandard(standardOptions[0]);
        }
      }, [standardOptions]);

      const systemTypeOptions = useMemo(() => {
        const set = new Set();
        db.fixtures.forEach(f => {
          if (f.standard === standard && f.systemType != null && f.systemType !== "") set.add(f.systemType);
        });
        return Array.from(set);
      }, [db, standard]);

      useEffect(() => {
        if (systemTypeOptions.length > 0 && !systemTypeOptions.includes(systemType)) {
          setSystemType(systemTypeOptions[0]);
        } else if (systemTypeOptions.length === 0 && systemType !== "") {
          setSystemType("");
        }
      }, [systemTypeOptions]);

      const flushingTypeOptions = useMemo(() => {
        const set = new Set();
        db.fu2flow.forEach(r => { if (r.standard === standard && r.type) set.add(r.type); });
        return Array.from(set);
      }, [db, standard]);

      useEffect(() => {
        if (flushingTypeOptions.length > 0 && !flushingTypeOptions.includes(flushingType)) {
          setFlushingType(flushingTypeOptions[0]);
        }
      }, [flushingTypeOptions]);

      const fixtureKey = f => `${f.standard}|${f.systemType ?? ""}|${f.name ?? ""}|${f.abbr ?? ""}`;

      const availableFixtures = useMemo(() => {
        return db.fixtures
          .filter(f => f.standard === standard && (systemTypeOptions.length === 0 || f.systemType === systemType))
          .map(f => ({ ...f, _key: fixtureKey(f) }));
      }, [db, standard, systemType, systemTypeOptions]);

      const fixtureByKey = useMemo(() => {
        const map = {};
        availableFixtures.forEach(f => { map[f._key] = f; });
        return map;
      }, [availableFixtures]);

      const prevKeyRef = useRef(`${standard}|${systemType}`);
      useEffect(() => {
        const key = `${standard}|${systemType}`;
        if (prevKeyRef.current !== key) {
          prevKeyRef.current = key;
          setFixtures(prev => [...buildInitialFixtureRows(db, standard, systemType), ...prev.filter(r => r.type === "custom")]);
          setCalculated(false);
        }
      }, [standard, systemType]);

      const { total: totalFU, missing: missingFuKeys } = useMemo(
        () => computeTotalFUForWaterSystem(fixtures, fixtureByKey, waterSystem),
        [fixtures, fixtureByKey, waterSystem]
      );

      const directFlowContribution = useMemo(
        () => computeDirectFlowContribution(fixtures, waterSystem),
        [fixtures, waterSystem]
      );

      const designFlow = useMemo(() => {
        if (totalFU == null) return null;
        const fuBasedFlow = interpolate(db.fu2flow, standard, flushingType, totalFU);
        if (fuBasedFlow == null) return null; 
        return fuBasedFlow + directFlowContribution;
      }, [db, standard, flushingType, totalFU, directFlowContribution]);

      const fuRange = useMemo(() => getFuRange(db.fu2flow, standard, flushingType), [db, standard, flushingType]);

      const outOfRange = useMemo(() => {
        if (totalFU == null || !fuRange) return null;
        if (totalFU < fuRange.min) return "below";
        if (totalFU > fuRange.max) return "above";
        return null;
      }, [totalFU, fuRange]);

      // Module 2 state
      const [material, setMaterial] = useState("HDPE");
      const [velocityMode, setVelocityMode] = useState("Auto");
      const [manualVelocity, setManualVelocity] = useState(2.0);
      const [building, setBuilding] = useState("Hotel");
      const [result, setResult] = useState(null);
      const [flowOverride, setFlowOverride] = useState(null);
      const flow = flowOverride ?? designFlow ?? 4.82;

      const materialInfo = useMemo(() => db.materials.find(m => m.material === material), [db, material]);

      const normalizeToken = v => String(v ?? "").trim().toUpperCase();

      const velocitySystem = useMemo(() => {
        const w = normalizeToken(waterSystem);
        if (w === "COLD WATER" || w === "CW") return "CW";
        if (w === "HOT WATER" || w === "HW") return "HW";
        return null;
      }, [waterSystem]);

      const velCriteria = useMemo(() => {
        if (!velocitySystem) return undefined;
        const nStandard = normalizeToken(standard);
        const nBuilding = normalizeToken(building);
        return db.velocity.find(v =>
          normalizeToken(v.standard) === nStandard &&
          normalizeToken(v.building) === nBuilding &&
          normalizeToken(v.system) === velocitySystem
        );
      }, [db, standard, building, velocitySystem]);

      const calculatePipeDesign = () => {
        try {
          if (velocityMode === "Auto" && !velCriteria) { setResult({ noCriteria: true }); return; }

          if (velocityMode === "Manual") {
            const mv = Number(manualVelocity);
            if (manualVelocity === "" || manualVelocity === null || !Number.isFinite(mv) || mv <= 0) {
              setResult({ invalidManualVelocity: true });
              return;
            }
          }

          if (!materialInfo) { setResult({ notFound: true }); return; }

          const sizes = db.pipeSizes.filter(p => p.material === material).sort((a, b) => a.od - b.od);
          const limit = velocityMode === "Auto" ? velCriteria.recommended : Number(manualVelocity);

          let chosen = null;
          for (const p of sizes) {
            const v = velocityMs(flow, p.id);
            if (v <= limit) { chosen = { ...p, velocity: v }; break; }
          }
          if (!chosen && sizes.length > 0) {
            const last = sizes[sizes.length - 1];
            chosen = { ...last, velocity: velocityMs(flow, last.id) };
          }
          if (!chosen) { setResult({ notFound: true }); return; }

          const hf = headLossHW(flow, chosen.id, materialInfo.c, 100);
          const pLoss = pressureLossKPa(hf);

          let status = null;
          if (velCriteria) {
            status = "PASS";
            if (chosen.velocity > velCriteria.maximum) status = "FAIL";
            else if (chosen.velocity > velCriteria.recommended) status = "WARNING";
          }

          setResult({ dn: chosen.dn, velocity: chosen.velocity, headLoss: hf, pressureLoss: pLoss, status });
        } catch (err) {
          console.error("calculatePipeDesign lỗi runtime:", err);
          setResult({ calcError: true, message: (err && err.message) || String(err) });
        }
      };

      useEffect(() => { calculatePipeDesign(); }, [standard, waterSystem, building, material, velocityMode, flow, manualVelocity]);

      const sessionOverrideRef = useRef(false);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const r = await window.storage.get(IMPORTED_DB_STORAGE_KEY, false);
            if (cancelled || sessionOverrideRef.current || !r || !r.value) return;
            const parsed = JSON.parse(r.value);
            const hasBasicShape = parsed && Array.isArray(parsed.pipeSizes) && Array.isArray(parsed.fixtures)
              && Array.isArray(parsed.velocity) && Array.isArray(parsed.fu2flow);
            
            const looksStaleOrIncomplete = hasBasicShape && parsed.velocity.length < DEFAULT_DB.velocity.length;
            if (hasBasicShape && !looksStaleOrIncomplete) {
              const migrated = migrateStandardTypo(parsed);
              setDb(migrated);
              setUsingCustom(true);
              if (JSON.stringify(migrated) !== JSON.stringify(parsed)) {
                window.storage.set(IMPORTED_DB_STORAGE_KEY, JSON.stringify(migrated), false).catch(() => {});
              }
            }
          } catch (e) {
          }
        })();
        return () => { cancelled = true; };
      }, []);

      const handleImport = async newDb => {
        sessionOverrideRef.current = true;
        const migrated = migrateStandardTypo(newDb);
        setDb(migrated);
        setUsingCustom(true);
        try {
          await window.storage.set(IMPORTED_DB_STORAGE_KEY, JSON.stringify(migrated), false);
          return { persisted: true };
        } catch (e) {
          return { persisted: false, error: (e && e.message) || String(e) };
        }
      };

      const handleReset = async () => {
        sessionOverrideRef.current = true;
        setDb(DEFAULT_DB);
        setUsingCustom(false);
        try {
          await window.storage.delete(IMPORTED_DB_STORAGE_KEY, false);
        } catch (e) {}
      };

      const handleExportExcel = () => {
        if (!standard || !waterSystem) {
          window.alert("Vui lòng chọn Design Standard và Water System trước khi xuất Excel.");
          return;
        }
        if (fixtures.length === 0) {
          window.alert("Chưa có fixture nào trong Water Demand. Vui lòng thêm fixture trước khi xuất Excel.");
          return;
        }
        try {
          exportDesignToExcel({
            db, standard, buildingType, systemType, waterSystem, flushingType,
            fixtures, fixtureByKey,
            material, building, velocityMode, manualVelocity,
          });
        } catch (err) {
          console.error("Export Excel lỗi:", err);
          window.alert("Không thể xuất Excel. Vui lòng thử lại.");
        }
      };

      // KONTROL GIAO DIỆN THEO USER VÀ THỜI GIAN DÙNG THỬ
      if (!authChecked) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#f5f7fa]">
            <div className="text-[#1F7A70] font-medium flex items-center gap-2">
              <RotateCcw className="animate-spin" size={16} /> Đang kiểm tra xác thực...
            </div>
          </div>
        );
      }

      if (!user) {
        return <AuthScreen />;
      }

      const createdAt = new Date(user.created_at);
      const today = new Date();
      const diffTime = today.getTime() - createdAt.getTime();
      const diffDays = Math.floor(diffTime / (1000 * 3600 * 24));
      const daysLeft = 14 - diffDays;

      if (daysLeft < 0) {
        return <LockScreen onLogout={() => supabase.auth.signOut()} />;
      }

      return (
        <ErrorBoundary>
        <div className="min-h-screen w-full" style={{
          background: "radial-gradient(circle at 15% 0%, #FBF3E4 0%, #F6EFDF 45%, #F2ECDC 100%)"
        }}>
          <div className="max-w-5xl mx-auto px-5 pt-4">
             <TrialBadge daysLeft={daysLeft} user={user} onLogout={() => supabase.auth.signOut()} />
          </div>
          <ImportBar
            usingCustom={usingCustom}
            onImport={handleImport}
            onReset={handleReset}
          />
          {screen === "m1"
            ? <Module1
                DB={db} onGoto={setScreen} onExportExcel={handleExportExcel}
                standard={standard} setStandard={setStandard}
                buildingType={buildingType} setBuildingType={setBuildingType}
                systemType={systemType} setSystemType={setSystemType}
                waterSystem={waterSystem} setWaterSystem={setWaterSystem}
                flushingType={flushingType} setFlushingType={setFlushingType}
                fixtures={fixtures} setFixtures={setFixtures}
                calculated={calculated} setCalculated={setCalculated}
                standardOptions={standardOptions} systemTypeOptions={systemTypeOptions} flushingTypeOptions={flushingTypeOptions}
                availableFixtures={availableFixtures} totalFU={totalFU} missingFuKeys={missingFuKeys}
                designFlow={designFlow} fuRange={fuRange} outOfRange={outOfRange}
              />
            : <Module2
                DB={db} standard={standard} waterSystem={waterSystem} onGoto={setScreen} onExportExcel={handleExportExcel}
                material={material} setMaterial={setMaterial}
                velocityMode={velocityMode} setVelocityMode={setVelocityMode}
                manualVelocity={manualVelocity} setManualVelocity={setManualVelocity}
                building={building} setBuilding={setBuilding}
                result={result} flow={flow} setFlowOverride={setFlowOverride}
                velocitySystem={velocitySystem} velCriteria={velCriteria} onCalculate={calculatePipeDesign}
              />
          }
        </div>
        </ErrorBoundary>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

  </script>
</body>
</html>
