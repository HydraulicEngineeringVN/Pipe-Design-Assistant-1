  const cancelStandardMapping = () => {
    if (!pendingStandardChange) return;
    // Hủy -> quay lại đúng Standard/System Type trước đó, KHÔNG áp dụng gì cả.
    setStandard(pendingStandardChange.fromStandard);
    setSystemType(pendingStandardChange.fromSystemType);
    setPendingStandardChange(null);
  };

  // STEP 4: quy tắc WC/UR không đóng góp Hot Water FU — không đổi logic, chỉ chuyển vị trí lên App.
  const isHotWaterIneligible = f => {
    const a = (f.abbr || "").toString().toUpperCase();
    return a.startsWith("WC") || a.startsWith("UR");
  };

  // STEP 29 FIX — Refactor: dùng lại ĐÚNG computeTotalFUForWaterSystem() (đã hỗ trợ custom fixture) thay vì
  // duy trì 1 bản logic FU riêng trùng lặp trong App — giảm rủi ro 2 nơi tính lệch nhau, không đổi kết quả
  // cho fixture Database (đã test — xem báo cáo cuối).
  // STEP 32 FIX — ROOT CAUSE THẬT: computeTotalFUForWaterSystem() trả về { total, missing } nhưng dòng
  // destructuring dưới đây trước đó viết { totalFU, missingFuKeys } — SAI TÊN THUỘC TÍNH (object trả về
  // không có field "totalFU"/"missingFuKeys" nào cả) khiến cả 2 biến luôn là `undefined`, sau đó
  // `missingFuKeys.length` trong Module1 throw "Cannot read properties of undefined (reading 'length')".
  // Sửa bằng alias destructuring đúng tên field thật.
  // V08 HARDENING: tính DB và Custom ở 2 pipeline độc lập rồi cộng ở App.
  // Custom FU không phụ thuộc vào fixtureByKey/tra DB.
  const dbFUResult = useMemo(
    () => computeTotalFUForWaterSystem(dbFixtures, fixtureByKey, waterSystem),
    [dbFixtures, fixtureByKey, waterSystem]
  );
  const customFUResult = useMemo(
    () => computeTotalFUForWaterSystem(customFixtures, {}, waterSystem),
    [customFixtures, waterSystem]
  );
  const totalFU = useMemo(() => {
    if (dbFUResult.total == null || customFUResult.total == null) return null;
    return dbFUResult.total + customFUResult.total;
  }, [dbFUResult.total, customFUResult.total]);
  const missingFuKeys = useMemo(
    () => [...dbFUResult.missing, ...customFUResult.missing],
    [dbFUResult.missing, customFUResult.missing]
  );
  const customFUContribution = customFUResult.total == null ? null : customFUResult.total;

  React.useEffect(() => {
    console.log('[CUSTOM V08 CALC] customFixtures=', JSON.stringify(customFixtures));
    console.log('[CUSTOM V08 CALC] customFUContribution=', customFUContribution,
      '| dbTotalFU=', dbFUResult.total, '| totalFU=', totalFU, '| waterSystem=', waterSystem);
  }, [customFixtures, customFUContribution, dbFUResult.total, totalFU, waterSystem]);

  // STEP 29 — Đóng góp Flow trực tiếp (L/s) từ custom fixture inputMode="FLOW" — CỘNG THÊM sau khi đã có
  // Design Flow từ FU (không trộn vào interpolate()).
  const directFlowContribution = useMemo(
    () => computeDirectFlowContribution(allFixtures, waterSystem),
    [allFixtures, waterSystem]
  );

  const designFlow = useMemo(() => {
    if (totalFU == null) return null;
    const fuBasedFlow = interpolate(db.fu2flow, standard, flushingType, totalFU);
    if (fuBasedFlow == null) return null; // giữ đúng behavior cũ: FU ngoài khoảng DB -> vẫn null, không suy diễn
    return fuBasedFlow + directFlowContribution;
  }, [db, standard, flushingType, totalFU, directFlowContribution]);

  // CUSTOM-FIXTURE-FORENSIC-FIX-V03-2026-08-15 (PART 5) — Forensic instrumentation ĐẶT TRONG useEffect
  // PHỤ THUỘC TRỰC TIẾP fixtures/totalFU/designFlow — KHÔNG log trong closure cũ, để chứng minh state
  // THỰC SỰ đã đổi (effect này tự re-fire mỗi khi các state đó thay đổi giá trị, không phải mỗi render).
  React.useEffect(() => {
    const totalFUCold = computeTotalFUForWaterSystem(allFixtures, fixtureByKey, "Cold Water").total;
    const totalFUHot = computeTotalFUForWaterSystem(allFixtures, fixtureByKey, "Hot Water").total;
    const dfCold = totalFUCold == null ? null : interpolate(db.fu2flow, standard, flushingType, totalFUCold);
    const dfHot = totalFUHot == null ? null : interpolate(db.fu2flow, standard, flushingType, totalFUHot);
    console.log("[CUSTOM TRACE 12] allFixtures CURRENT (length=" + allFixtures.length + "):", JSON.stringify(allFixtures));
    console.log("[CUSTOM TRACE 13] custom fixtures CURRENT (length=" + allFixtures.filter(r => r.type === "custom").length + "):", JSON.stringify(allFixtures.filter(r => r.type === "custom")));
    console.log("[CUSTOM TRACE 14] totalFU Cold =", totalFUCold, "| (waterSystem active hiện tại =" + waterSystem + ", totalFU active =" + totalFU + ")");
    console.log("[CUSTOM TRACE 15] totalFU Hot =", totalFUHot);
    console.log("[CUSTOM TRACE 16] designFlow Cold =", dfCold);
    console.log("[CUSTOM TRACE 17] designFlow Hot =", dfHot);
  }, [allFixtures, totalFU, designFlow, standard, flushingType, waterSystem, db, fixtureByKey]);

  const fuRange = useMemo(() => getFuRange(db.fu2flow, standard, flushingType), [db, standard, flushingType]);

  const outOfRange = useMemo(() => {
    if (totalFU == null || !fuRange) return null;
    if (totalFU < fuRange.min) return "below";
    if (totalFU > fuRange.max) return "above";
    return null;
  }, [totalFU, fuRange]);
  // ==================== HẾT SHARED DESIGN STATE (MODULE 1) ====================

  // ==================== STEP 18: SHARED DESIGN STATE (MODULE 2) ====================
  // Nâng toàn bộ state riêng của Module2 lên App, cùng lý do với Module1 ở Step 17 — Module2 cũng
  // unmount/remount qua ternary `screen === "m1" ? ... : ...`, nên state sống trong Module2 sẽ mất
  // mỗi lần rời màn hình. Đưa lên App để "App = single source of truth cho toàn bộ design hiện tại".
  const [material, setMaterial] = useState("HDPE");
  const [velocityMode, setVelocityMode] = useState("Auto");
  const [manualVelocity, setManualVelocity] = useState(2.0);
  // PHẦN 2 (đúng yêu cầu): `building` ở đây là "Velocity Criteria building" của Module 2 —
  // KHÁC HOÀN TOÀN với `buildingType` (Module 1, "Building Type của thiết kế") đã khai báo ở trên.
  // Không gộp/đổi tên/thay thế 2 field này.
  const [building, setBuilding] = useState("Hotel");
  const [result, setResult] = useState(null);
  // `flowOverride`: null nghĩa là Flow đang TỰ ĐỘNG theo designFlow mới nhất từ Module 1 (luôn cập nhật
  // ngay cả khi không điều hướng qua lại). Nếu người dùng tự gõ số vào ô Flow ở Module 2, override này
  // được lưu lại (persist đúng theo yêu cầu "không mất dữ liệu"), và sẽ không tự đổi theo designFlow nữa
  // cho tới khi người dùng tự xoá override. Đây là thiết kế tối thiểu để vừa giữ được hành vi cũ (tự động
  // lấy đúng Design Flow mới nhất khi mới sang Module 2) vừa không mất input người dùng khi điều hướng qua lại.
  const [flowOverride, setFlowOverride] = useState(null);
  const flow = flowOverride ?? designFlow ?? 4.82;

  const materialInfo = useMemo(() => db.materials.find(m => m.material === material), [db, material]);

  // STEP 22 FIX — Đã audit toàn bộ pipeline (Excel raw sạch, parser đúng, DEFAULT_DB đúng 24/12 HW,
  // field name khớp "system", mapping/lookup logic đúng cấu trúc) nhưng bạn vẫn báo lỗi thực tế sau khi
  // Reset + Import lại. Để loại trừ HOÀN TOÀN mọi khả năng lệch khoảng trắng/hoa-thường (dù chưa thấy
  // qua audit tĩnh) làm chắc chắn 100% theo đúng yêu cầu — xây lookup ROBUST bằng normalize 2 chiều
  // (cả giá trị trong DB lẫn giá trị runtime), KHÔNG đổi ý nghĩa CW/HW, KHÔNG hard-code Standard,
  // KHÔNG fallback HW->CW.
  const normalizeToken = v => String(v ?? "").trim().toUpperCase();

  // Mapping CW/HW an toàn: chấp nhận cả "Cold Water"/"Hot Water" (giá trị UI hiện dùng) LẪN "CW"/"HW"
  // trực tiếp (phòng trường hợp kiến trúc sau này truyền thẳng mã hệ thống) — không hard-code IPC,
  // không để lọt trường hợp Hot Water -> null hay Hot Water -> CW.
  const velocitySystem = useMemo(() => {
    const w = normalizeToken(waterSystem);
    if (w === "COLD WATER" || w === "CW") return "CW";
    if (w === "HOT WATER" || w === "HW") return "HW";
    return null;
  }, [waterSystem]);

  const velCriteria = useMemo(() => {
    if (!velocitySystem) return undefined;
    const nStandard = normalizeToken(standard);
    const nBuilding = normalizeToken(building);
    return db.velocity.find(v =>
      normalizeToken(v.standard) === nStandard &&
      normalizeToken(v.building) === nBuilding &&
      normalizeToken(v.system) === velocitySystem
    );
  }, [db, standard, building, velocitySystem]);

  // STEP 10 FIX — Root cause: trước đây `if (!velCriteria) return` chặn TOÀN BỘ việc chọn Pipe Size
  // bất kể velocityMode, khiến Hot Water (DB hiện không có Velocity Criteria Hot Water cho bất kỳ Standard
  // nào) không bao giờ ra được Pipe Size, kể cả khi Manual Velocity đang bật (Manual Velocity vốn KHÔNG
  // cần velCriteria để chọn DN — chỉ cần để phân loại PASS/WARNING/FAIL).
  // Tách rõ 2 việc độc lập:
  //  (1) Xác định `limit` để CHỌN Pipe Size: Auto BẮT BUỘC cần velCriteria.recommended (nếu DB không có,
  //      Auto mode thực sự không xác định được limit — đúng, không suy diễn); Manual dùng đúng giá trị
  //      người dùng nhập, KHÔNG cần velCriteria — đây chính là mục đích của Manual Velocity.
  //  (2) Phân loại PASS/WARNING/FAIL: LUÔN cần velCriteria (không suy diễn/mượn criteria khác) — nếu thiếu,
  //      Pipe Size/Velocity/Head Loss/Pressure Loss vẫn hiển thị bình thường, chỉ riêng Status = không xác định.
  // STEP 23 FIX — Trace thực tế phát hiện (không chỉ suy đoán):
  //  (1) `materialInfo.c` được truy cập trực tiếp không guard — nếu `materialInfo` là `undefined`
  //      (material đang chọn không khớp bất kỳ dòng nào trong db.materials), dòng này THROW
  //      `Cannot read properties of undefined (reading 'c')` NGAY TRONG useEffect (không có Error Boundary
  //      nào bọc App) -> React unmount toàn bộ cây -> đúng hiện tượng "trang trắng" đã báo cáo.
  //  (2) `manualVelocity` được dùng thẳng làm `limit` không kiểm tra hợp lệ — nếu người dùng đang gõ dở
  //      (input rỗng) hoặc nhập giá trị không phải số, `limit` có thể là NaN, khiến `v <= limit` luôn false,
  //      không tự crash nhưng cho kết quả sai lệch (luôn chọn ống lớn nhất) một cách âm thầm.
  // Sửa cả 2: thêm guard tường minh cho materialInfo trước khi tính; validate manualVelocity chặt chẽ
  // (chấp nhận input rỗng khi đang gõ, KHÔNG ép về 0 khiến limit sai) và không chạy phép tính pipe sizing
  // cho tới khi có 1 số hợp lệ > 0; bọc toàn bộ phần tính toán số học (không phải toàn component) trong
  // try/catch để BẤT KỲ lỗi runtime chưa lường trước nào trong chuỗi này cũng không bao giờ làm crash cả
  // trang — thay vào đó trả về 1 trạng thái lỗi rõ ràng, hiển thị được, không che giấu root cause (vẫn
  // console.error để debug được), chỉ ngăn nó phá UI.
  const calculatePipeDesign = () => {
    try {
      if (velocityMode === "Auto" && !velCriteria) { setResult({ noCriteria: true }); return; }

      // Manual Velocity: KHÔNG ép giá trị rỗng/không hợp lệ thành 0 (0 sẽ khiến limit=0, chọn sai âm thầm).
      // Nếu Manual đang chọn nhưng chưa có số hợp lệ > 0, dừng lại với trạng thái rõ ràng, không tính bừa.
      if (velocityMode === "Manual") {
        const mv = Number(manualVelocity);
        if (manualVelocity === "" || manualVelocity === null || !Number.isFinite(mv) || mv <= 0) {
          setResult({ invalidManualVelocity: true });
          return;
        }
      }

      if (!materialInfo) { setResult({ notFound: true }); return; }

      const sizes = db.pipeSizes.filter(p => p.material === material).sort((a, b) => a.od - b.od);
      const limit = velocityMode === "Auto" ? velCriteria.recommended : Number(manualVelocity);

      let chosen = null;
      for (const p of sizes) {
        const v = velocityMs(flow, p.id);
        if (v <= limit) { chosen = { ...p, velocity: v }; break; }
      }
      if (!chosen && sizes.length > 0) {
        const last = sizes[sizes.length - 1];
        chosen = { ...last, velocity: velocityMs(flow, last.id) };
      }
      if (!chosen) { setResult({ notFound: true }); return; }

      const hf = headLossHW(flow, chosen.id, materialInfo.c, 100);
      const pLoss = pressureLossKPa(hf);

      // Status CHỈ tính được khi có velCriteria — nếu không có (VD Manual Velocity + Hot Water chưa có
      // criteria trong DB), status = null, KHÔNG suy diễn/mượn criteria khác.
      let status = null;
      if (velCriteria) {
        status = "PASS";
        if (chosen.velocity > velCriteria.maximum) status = "FAIL";
        else if (chosen.velocity > velCriteria.recommended) status = "WARNING";
      }

      setResult({ dn: chosen.dn, velocity: chosen.velocity, headLoss: hf, pressureLoss: pLoss, status });
    } catch (err) {
      // An toàn tối thiểu: KHÔNG để bất kỳ lỗi runtime chưa lường trước nào trong chuỗi tính toán làm
      // crash cả trang (đúng hiện tượng "trang trắng" đã báo cáo — effect throw uncaught, không có
      // Error Boundary nào bọc App). Vẫn log ra console để giữ nguyên khả năng debug root cause thật,
      // không che giấu lỗi — chỉ ngăn nó phá UI. Đây không phải "sửa triệu chứng thay vì root cause":
      // 2 root cause cụ thể (materialInfo không guard, manualVelocity không validate) đã được sửa ở trên;
      // try/catch này là lớp phòng thủ cuối cho các trường hợp chưa lường hết được.
      console.error("calculatePipeDesign lỗi runtime không lường trước:", err);
      setResult({ calcError: true, message: (err && err.message) || String(err) });
    }
  };

  React.useEffect(() => { calculatePipeDesign(); /* eslint-disable-next-line */ }, [standard, waterSystem, building, material, velocityMode, flow, manualVelocity]);
  // ==================== HẾT SHARED DESIGN STATE (MODULE 2) ====================

  // STEP 9 FIX (Phần A2): chặn race condition giữa useEffect khởi động (đọc storage) và
  // handleImport/handleReset. `useRef` cập nhật ĐỒNG BỘ ngay lập tức (không như setState),
  // nên nếu người dùng import/reset TRONG LÚC useEffect khởi động vẫn đang chờ storage.get,
  // khi promise đó resolve xong nó sẽ kiểm tra cờ này và tự huỷ, không ghi đè DB vừa import/reset.
  const sessionOverrideRef = React.useRef(false);

  // STEP B1/B2: khi mở app, ưu tiên nạp database cá nhân đã lưu (Priority 1),
  // nếu không có / lỗi đọc thì im lặng giữ nguyên DEFAULT_DB đã là state khởi tạo (Priority 2 — fallback cuối).
  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const result = await window.storage.get(IMPORTED_DB_STORAGE_KEY, false);
        // STEP 9: nếu người dùng đã import hoặc reset thủ công trong lúc chờ đọc storage
        // (sessionOverrideRef.current === true) -> bỏ qua kết quả storage cũ, KHÔNG ghi đè.
        if (cancelled || sessionOverrideRef.current || !result || !result.value) return;
        const parsed = JSON.parse(result.value);
        // Kiểm tra tối thiểu để không nạp dữ liệu hỏng làm crash app — không phải validate lại toàn bộ,
        // chỉ đảm bảo đúng hình dạng cơ bản trước khi setDb.
        const hasBasicShape = parsed && Array.isArray(parsed.pipeSizes) && Array.isArray(parsed.fixtures)
          && Array.isArray(parsed.velocity) && Array.isArray(parsed.fu2flow);
        // STEP 24 FIX (PART 3/9): không được để 1 bản DB cá nhân CŨ (ít dữ liệu hơn) âm thầm ghi đè lên
        // DEFAULT_DB MỚI đã publish (VD: bản cũ chỉ có 12 dòng Velocity Criteria — chưa có Hot Water —
        // trong khi DEFAULT_DB hiện tại đã có 24). Đây chỉ là 1 phép so sánh SỐ LƯỢNG đơn giản (heuristic),
        // không phải validate schema đầy đủ — nếu bản lưu trữ "ít hơn hoặc bằng" DEFAULT_DB hiện tại ở
        // velocity, coi là có khả năng cũ/thiếu hơn và ưu tiên giữ DEFAULT_DB (đã là state khởi tạo sẵn),
        // KHÔNG tự xoá storage của người dùng (không can thiệp dữ liệu họ không yêu cầu).
        const looksStaleOrIncomplete = hasBasicShape && parsed.velocity.length < DEFAULT_DB.velocity.length;
        if (hasBasicShape && !looksStaleOrIncomplete) {
          // STEP 10: personal storage có thể còn giữ bản v3 cũ với lỗi "AS NSZ" (từ lần import trước
          // khi Excel chưa được bạn sửa) -> migrate tối thiểu trước khi đưa vào runtime DB.
          const migrated = migrateStandardTypo(parsed);
          setDb(migrated);
          setUsingCustom(true);
          // Nếu migration thực sự đổi gì đó (nghĩa là storage đang giữ bản có lỗi cũ) -> ghi lại bản
          // đã migrate vào storage luôn, để các lần mở app sau không cần migrate lại từ đầu.
          // Không chặn UI nếu ghi thất bại — đây chỉ là tối ưu, không phải yêu cầu bắt buộc.
          if (JSON.stringify(migrated) !== JSON.stringify(parsed)) {
            window.storage.set(IMPORTED_DB_STORAGE_KEY, JSON.stringify(migrated), false).catch(() => {});
          }
        }
      } catch (e) {
        // Không có DB cá nhân nào được lưu trước đó, hoặc lỗi đọc storage
        // -> KHÔNG crash, im lặng dùng DEFAULT_DB (đã là giá trị khởi tạo của state db).
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Chỉ được gọi sau khi ImportBar đã validate Excel thành công.
  const handleImport = async newDb => {
    // STEP 9: đánh dấu NGAY LẬP TỨC (đồng bộ, trước cả setDb) để nếu useEffect khởi động
    // vẫn đang chờ đọc storage, nó sẽ tự huỷ khi resolve xong, không ghi đè DB vừa import này.
    sessionOverrideRef.current = true;
    // STEP 10: migrate ngay cả với DB vừa import — phòng trường hợp bạn (hoặc ai khác) import lại
    // đúng file v3 cũ có lỗi chính tả; đảm bảo runtime DB và storage từ nay luôn nhất quán "AS NZS".
    // Với file v4 đã đúng sẵn, migration này là no-op (không đổi gì).
    const migrated = migrateStandardTypo(newDb);
    setDb(migrated);
    setUsingCustom(true);
    try {
      await window.storage.set(IMPORTED_DB_STORAGE_KEY, JSON.stringify(migrated), false);
      return { persisted: true };
    } catch (e) {
      // Lưu thất bại: KHÔNG revert runtime DB, vẫn dùng được trong phiên hiện tại.
      return { persisted: false, error: (e && e.message) || String(e) };
    }
  };

  const handleReset = async () => {
    // STEP 9: tương tự handleImport — chặn useEffect khởi động ghi đè lại DB cũ từ storage
    // nếu nó vẫn đang chờ resolve trong lúc người dùng bấm Reset.
    sessionOverrideRef.current = true;
    setDb(DEFAULT_DB);
    setUsingCustom(false);
    try {
      await window.storage.delete(IMPORTED_DB_STORAGE_KEY, false);
    } catch (e) {
      // Không có gì để xoá hoặc lỗi storage -> bỏ qua, không chặn thao tác reset của người dùng.
    }
  };

  // STEP 18/27: Export Excel — gom đúng application state hiện tại (không đọc DOM), gọi hàm thuần
  // exportDesignToExcel(). Cả 2 nút "Export to Excel" (Module1 và Module2) đều gọi hàm NÀY, nên luôn
  // xuất đúng 1 design state dùng chung, không có bản snapshot riêng của từng Module.
  // STEP 27: exportDesignToExcel giờ tự tính Design Flow + Pipe Result cho CẢ Cold Water lẫn Hot Water
  // (không chỉ water system đang active) — không cần truyền totalFU/designFlow/velCriteria/result của
  // riêng 1 water system nữa, chỉ cần fixtures/fixtureByKey/material/building/velocityMode/manualVelocity
  // để hàm tự tính lại cho cả 2 phía bằng đúng công thức hiện có.
  const handleExportExcel = () => {
    if (!standard || !waterSystem) {
      window.alert("Vui lòng chọn Design Standard và Water System trước khi xuất Excel.");
      return;
    }
    if (allFixtures.length === 0) {
      window.alert("Chưa có fixture nào trong Water Demand. Vui lòng thêm fixture trước khi xuất Excel.");
      return;
    }
    // STEP 26 (PART 7): bọc bằng try/catch — nếu có lỗi runtime bất kỳ trong quá trình tạo/tải file,
    // không được để crash Module 1/Module 2 hay mất design state đang có. Log lỗi thật ra console để
    // debug được, chỉ hiển thị thông báo thân thiện cho người dùng (không lộ stack trace).
    try {
      exportDesignToExcel({
        db, standard, buildingType, systemType, waterSystem, flushingType,
        fixtures: allFixtures, fixtureByKey,
        material, building, velocityMode, manualVelocity,
      });
    } catch (err) {
      console.error("Export Excel lỗi runtime:", err);
      window.alert("Không thể xuất Excel. Vui lòng thử lại.");
    }
  };

  return (
    <ErrorBoundary>
    <div className="min-h-screen w-full" style={{
      background: "radial-gradient(circle at 15% 0%, #FBF3E4 0%, #F6EFDF 45%, #F2ECDC 100%)"
    }}>
      {/* Thanh hiển thị thông tin User & Đăng xuất — giữ nguyên như bản deploy cũ */}
      <div className="max-w-5xl mx-auto px-5 pt-6 flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-2 text-xs text-[#7D8B87] bg-white border border-[#EDE6D6] rounded-full px-3 py-1.5">
          <User size={13} />
          <span>{user.email}</span>
          <span className="w-px h-3 bg-[#E7E0CE]" />
          <span>Còn {trialDaysLeft} ngày dùng thử</span>
        </div>
        <button
          onClick={onLogout}
          className="flex items-center gap-1.5 text-xs font-medium text-[#C13A3A] bg-white border border-[#C13A3A]/25 hover:bg-[#FBE7E7] rounded-full px-3 py-1.5 transition"
        >
          <LogOut size={13} /> Đăng xuất
        </button>
      </div>
      <ImportBar
        usingCustom={usingCustom}
        onImport={handleImport}
        onReset={handleReset}
      />
      {screen === "m1"
        ? <Module1
            DB={db} onGoto={setScreen} onExportExcel={handleExportExcel}
            standard={standard} setStandard={setStandard}
            buildingType={buildingType} setBuildingType={setBuildingType}
            systemType={systemType} setSystemType={setSystemType}
            waterSystem={waterSystem} setWaterSystem={setWaterSystem}
            flushingType={flushingType} setFlushingType={setFlushingType}
            dbFixtures={dbFixtures} setDbFixtures={setDbFixtures}
            customFixtures={customFixtures} setCustomFixtures={setCustomFixtures}
            allFixtures={allFixtures}
            calculated={calculated} setCalculated={setCalculated}
            standardOptions={standardOptions} systemTypeOptions={systemTypeOptions} flushingTypeOptions={flushingTypeOptions}
            availableFixtures={availableFixtures} totalFU={totalFU} missingFuKeys={missingFuKeys}
            designFlow={designFlow} fuRange={fuRange} outOfRange={outOfRange}
            customFUContribution={customFUContribution}
            logActivity={logActivityToSupabase}
          />
        : <Module2
            DB={db} standard={standard} waterSystem={waterSystem} onGoto={setScreen} onExportExcel={handleExportExcel}
            material={material} setMaterial={setMaterial}
            velocityMode={velocityMode} setVelocityMode={setVelocityMode}
            manualVelocity={manualVelocity} setManualVelocity={setManualVelocity}
            building={building} setBuilding={setBuilding}
            result={result} flow={flow} setFlowOverride={setFlowOverride}
            velocitySystem={velocitySystem} velCriteria={velCriteria} onCalculate={calculatePipeDesign}
            logActivity={logActivityToSupabase}
          />
      }
      <StandardMappingModal
        pending={pendingStandardChange}
        onConfirm={confirmStandardMapping}
        onCancel={cancelStandardMapping}
      />
    </div>
    </ErrorBoundary>
  );
}
function AuthForm({ onLoginSuccess }) {
  const [isSignUp, setIsSignUp] = useState(false);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [infoMsg, setInfoMsg] = useState("");
  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setErrorMsg("");
    setInfoMsg("");
    try {
      if (!supabase) throw new Error("Chưa kết nối được với cơ sở dữ liệu Supabase!");
      if (isSignUp) {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        
        // Tự động thu thập email người dùng đăng ký vào bảng 'profiles'
        if (data?.user) {
          try {
             // FIX: bảng thật trên Supabase là "Profile" (viết hoa P), cột ID/Email (viết hoa) — không có cột created_at.
            // Không set "Trial expires at" ở đây -> để trống -> checkUserTrial() tự fallback về mặc định TRIAL_DAYS ngày.
            await supabase.from('Profile').insert([{ ID: data.user.id, Email: email }]);
          } catch(errProfile) {
             console.log("Lỗi tạo profile:", errProfile);
          }
        }
        
        setInfoMsg("Đăng ký thành công! Bạn có thể Đăng nhập ngay bây giờ.");
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onLoginSuccess(data.user);
      }
    } catch (err) {
      setErrorMsg(err.message || "Đã xảy ra lỗi, vui lòng thử lại!");
    } finally {
      setLoading(false);
    }
  };
  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-[#EDE6D6] p-8 max-w-md w-full">
        <div className="flex flex-col items-center mb-6 text-center">
          <div className="w-12 h-12 rounded-full bg-gradient-to-br from-[#4FB3A6] to-[#1F7A70] flex items-center justify-center mb-3 text-white">
            <Droplet size={24} />
          </div>
          <h2 className="text-xl font-bold text-[#1F3B36]">Pipe Design Assistant</h2>
          <p className="text-xs text-[#7D8B87] mt-1">Đăng nhập tài khoản để sử dụng công cụ (Dùng thử miễn phí {TRIAL_DAYS} ngày)</p>
        </div>
        {errorMsg && (
          <div className="mb-4 text-xs text-[#C13A3A] bg-[#FBE7E7] rounded-xl p-3 border border-[#C13A3A]/20">
            {errorMsg}
          </div>
        )}
        {infoMsg && (
          <div className="mb-4 text-xs text-[#1E8A50] bg-[#E4F6EC] rounded-xl p-3 border border-[#1E8A50]/20">
            {infoMsg}
          </div>
        )}
        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block text-xs font-medium text-[#7D8B87] mb-1">Email của bạn</label>
            <input
              type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
              placeholder="name@company.com"
              className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-xl px-3.5 py-2.5 text-sm text-[#243B36] focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/40"
            />
          </div>
          <div>
            <label className="block text-xs font-medium text-[#7D8B87] mb-1">Mật khẩu</label>
            <input
              type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
              placeholder="••••••••"
              className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-xl px-3.5 py-2.5 text-sm text-[#243B36] focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/40"
            />
          </div>
          <button
            type="submit" disabled={loading}
            className="w-full mt-2 flex items-center justify-center gap-2 rounded-2xl py-3 font-semibold text-white text-sm bg-gradient-to-r from-[#4FB3A6] to-[#1F7A70] hover:brightness-105 transition shadow-md disabled:opacity-50"
          >
            {loading ? "Đang xử lý..." : isSignUp ? "Tạo tài khoản dùng thử" : "Đăng nhập"}
          </button>
        </form>
        <div className="mt-6 text-center text-xs text-[#7D8B87]">
          {isSignUp ? "Đã có tài khoản?" : "Chưa có tài khoản?"}{" "}
          <button
            onClick={() => { setIsSignUp(!isSignUp); setErrorMsg(""); setInfoMsg(""); }}
            className="font-semibold text-[#1F7A70] hover:underline"
          >
            {isSignUp ? "Đăng nhập ngay" : "Đăng ký dùng thử miễn phí"}
          </button>
        </div>
      </div>
    </div>
  );
}
function ExpiredTrialScreen({ user, onLogout }) {
  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-[#EDE6D6] p-8 max-w-md w-full text-center">
        <div className="w-12 h-12 rounded-full bg-[#FEF3DE] flex items-center justify-center mx-auto mb-4 text-[#B8791A]">
          <Lock size={24} />
        </div>
        <h2 className="text-xl font-bold text-[#1F3B36]">Đã hết thời gian dùng thử!</h2>
        <p className="text-xs text-[#7D8B87] mt-2 leading-relaxed">
          Tài khoản <strong className="text-[#243B36]">{user.email}</strong> của bạn đã hết thời hạn {TRIAL_DAYS} ngày dùng thử miễn phí.
        </p>
        <div className="my-6 p-4 bg-[#FAF7EF] rounded-2xl border border-[#E7E0CE] text-left">
          <p className="text-xs text-[#243B36] font-medium mb-1">Để nâng cấp bản quyền Pro:</p>
          <p className="text-xs text-[#7D8B87]">Vui lòng liên hệ Admin qua Email hoặc Zalo để kích hoạt tài khoản vĩnh viễn.</p>
        </div>
        <button
          onClick={onLogout}
          className="w-full flex items-center justify-center gap-2 rounded-2xl py-2.5 font-medium text-[#7D8B87] border border-[#E7E0CE] hover:bg-[#FAF7EF] transition text-sm"
        >
          <LogOut size={15} /> Đăng xuất
        </button>
      </div>
    </div>
  );
}
export default function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [trialDaysLeft, setTrialDaysLeft] = useState(0);
  const [isTrialExpired, setIsTrialExpired] = useState(false);
  React.useEffect(() => {
    if (!supabase) {
      setLoading(false);
      return;
    }
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        checkUserTrial(session.user);
      } else {
        setLoading(false);
      }
    });
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        checkUserTrial(session.user);
      } else {
        setUser(null);
        setLoading(false);
      }
    });
    return () => subscription.unsubscribe();
  }, []);
  // FIX (theo yêu cầu): thêm khả năng ADMIN GIA HẠN qua Supabase, KHÔNG đổi hành vi mặc định.
  // Mặc định vẫn tính hạn = created_at + TRIAL_DAYS (giống hệt code cũ, không ảnh hưởng user cũ).
  // Nếu admin set cột "Trial expires at" (Table Editor, bảng "Profile") cho 1 user cụ thể, giá trị đó
  // ĐƯỢC ƯU TIÊN dùng thay cho công thức mặc định — đây là cách admin "kéo dài ngày" qua Supabase.
  // LƯU Ý: tên bảng/cột thật trên Supabase có chữ hoa + khoảng trắng (xác nhận qua information_schema):
  // bảng "Profile" (không phải "profiles"), cột "ID" (uuid), "Trial expires at" (date, không phải trial_expires_at).
  const checkUserTrial = async (userData) => {
    setUser(userData);
    const createdAt = new Date(userData.created_at);
    let expiresAt = new Date(createdAt.getTime() + TRIAL_DAYS * 24 * 60 * 60 * 1000); // mặc định như cũ

    try {
      const { data: profileRow, error: profileErr } = await supabase
        .from('Profile')
        .select('"Trial expires at"')
        .eq('ID', userData.id)
        .maybeSingle();
      if (profileErr) {
        console.log("Lỗi đọc Profile (bảng/cột có thể chưa đúng hoặc bị RLS chặn):", profileErr);
      } else if (profileRow && profileRow['Trial expires at']) {
        expiresAt = new Date(profileRow['Trial expires at']); // admin đã gia hạn -> dùng mốc này
      }
    } catch (errProfile) {
      console.log("Không đọc được Trial expires at, dùng mặc định created_at+TRIAL_DAYS:", errProfile);
    }

    const now = new Date();
    const daysLeft = Math.ceil((expiresAt.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
    setTrialDaysLeft(daysLeft > 0 ? daysLeft : 0);
    setIsTrialExpired(now.getTime() > expiresAt.getTime());
    setLoading(false);
  };
  const handleLogout = async () => {
    if (supabase) await supabase.auth.signOut();
    setUser(null);
  };
  if (loading) {
    return <div className="min-h-screen flex items-center justify-center text-sm font-medium text-[#7D8B87]">Đang kết nối cơ sở dữ liệu...</div>;
  }
  if (!user) {
    return <AuthForm onLoginSuccess={checkUserTrial} />;
  }
  if (isTrialExpired) {
    return <ExpiredTrialScreen user={user} onLogout={handleLogout} />;
  }
  // Khởi chạy App chính sau khi đã vượt qua vòng kiểm tra Auth
  return <MainApp user={user} trialDaysLeft={trialDaysLeft} onLogout={handleLogout} />;
}
// ==== Mount ====
import ReactDOM from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
