// STEP 24 FIX — `window.storage` là API riêng của môi trường sandbox Claude, KHÔNG tồn tại trên browser
// thật (VD sau khi Export HTML rồi deploy lên Vercel/GitHub Pages). Toàn bộ lời gọi `window.storage.*`
// trong file này ĐÃ được bọc trong try/catch từ trước (Step B1/B2/9/10) nên KHÔNG throw uncaught trên
// browser thật — nhưng vì API không tồn tại, tính năng "lưu database cá nhân qua lần reload" sẽ luôn
// âm thầm thất bại trên browser thật (không crash, nhưng cũng không hoạt động).
// Sửa triệt để: nếu `window.storage` chưa tồn tại (browser thật), tự động cấp 1 bản thay thế dùng
// `localStorage` với cùng interface (get/set/delete/list, đều async để tương thích lời gọi `await` hiện có).
// Nếu `window.storage` đã tồn tại sẵn (đúng môi trường Claude sandbox), đoạn này KHÔNG làm gì cả — không
// ghi đè, không phá vỡ hành vi JSX development hiện tại.
(function installBrowserStorageShim() {
  if (typeof window === "undefined") return;
  if (window.storage && typeof window.storage.get === "function") return; // đã có sẵn (Claude sandbox) -> không đụng vào

  const PREFIX = "pda_storage__";
  const keyFor = (key, shared) => PREFIX + (shared ? "shared__" : "personal__") + key;

  window.storage = {
    async get(key, shared) {
      const raw = window.localStorage.getItem(keyFor(key, shared));
      if (raw === null || raw === undefined) {
        // Giữ đúng hành vi gốc: key không tồn tại -> throw (mọi nơi gọi .get() trong app đều đã bọc try/catch).
        throw new Error("Key not found: " + key);
      }
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      try {
        window.localStorage.setItem(keyFor(key, shared), String(value));
        return { key, value, shared: !!shared };
      } catch (e) {
        // VD Safari Private Mode chặn localStorage -> không throw ra ngoài, trả null như tài liệu API gốc.
        return null;
      }
    },
    async delete(key, shared) {
      try {
        window.localStorage.removeItem(keyFor(key, shared));
        return { key, deleted: true, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    async list(prefix, shared) {
      try {
        const scope = PREFIX + (shared ? "shared__" : "personal__");
        const keys = [];
        for (let i = 0; i < window.localStorage.length; i++) {
          const k = window.localStorage.key(i);
          if (k && k.startsWith(scope + (prefix || ""))) keys.push(k.slice(scope.length));
        }
        return { keys, prefix, shared: !!shared };
      } catch (e) {
        return { keys: [] };
      }
    },
  };
})();

/* ============================ helpers ============================ */

// STEP 4 APPROVED FIX: KHÔNG còn clamp âm thầm khi Total FU nằm ngoài khoảng dữ liệu.
// - Trong khoảng [min, max] (bao gồm 2 đầu mút): giữ nguyên nội suy tuyến tính như trước,
//   khớp chính xác giá trị Demand tại các điểm có sẵn trong DB.
// - Ngoài khoảng: trả về null (out-of-range) thay vì mượn giá trị min/max — không suy diễn,
//   không tạo ra một điểm toán học mới ngoài database.
function interpolate(table, standard, type, totalFU) {
  const rows = table
    .filter(r => r.standard === standard && r.type === type && r.ls != null)
    .sort((a, b) => a.fu - b.fu);
  if (rows.length === 0) return null;
  const min = rows[0].fu, max = rows[rows.length - 1].fu;
  if (totalFU < min || totalFU > max) return null; // out-of-range — không còn clamp
  for (let i = 0; i < rows.length - 1; i++) {
    const a = rows[i], b = rows[i + 1];
    if (totalFU >= a.fu && totalFU <= b.fu) {
      if (b.fu === a.fu) return a.ls;
      const t = (totalFU - a.fu) / (b.fu - a.fu);
      return a.ls + t * (b.ls - a.ls);
    }
  }
  return rows[rows.length - 1].ls; // an toàn dự phòng, thực tế không đạt tới do đã lọc range ở trên
}

// Lấy khoảng FU khả dụng của 1 nhóm (Standard+Type) để hiển thị cảnh báo out-of-range.
// Không đụng vào interpolate() — hàm phụ trợ riêng, chỉ phục vụ hiển thị.
function getFuRange(table, standard, type) {
  const rows = table.filter(r => r.standard === standard && r.type === type && r.ls != null);
  if (rows.length === 0) return null;
  const fus = rows.map(r => r.fu);
  return { min: Math.min(...fus), max: Math.max(...fus) };
}

function crossSectionArea(idMm) {
  const r = idMm / 2 / 1000; // m
  return Math.PI * r * r; // m^2
}

function velocityMs(flowLs, idMm) {
  const flowM3s = flowLs / 1000;
  const area = crossSectionArea(idMm);
  return flowM3s / area;
}

// Hazen-Williams head loss, SI form: hf = 10.67 * L * Q^1.852 / (C^1.852 * D^4.8704), Q in m3/s, D in m
function headLossHW(flowLs, idMm, C, lengthM = 100) {
  const Q = flowLs / 1000;
  const D = idMm / 1000;
  const hf = (10.67 * lengthM * Math.pow(Q, 1.852)) / (Math.pow(C, 1.852) * Math.pow(D, 4.8704));
  return hf; // m per `lengthM` meters
}

function pressureLossKPa(headLossM) {
  return headLossM * 9.81; // kPa, since 1 m water column ~= 9.81 kPa
}

function fmt(n, d = 2) {
  if (n === null || n === undefined || isNaN(n)) return "-";
  return Number(n).toFixed(d);
}

/* ============================ Fixture searchable selector ============================ */
// Thay thế <select> gốc bằng ô tìm kiếm + danh sách cuộn được, phù hợp với database dài.
// KHÔNG tạo nguồn dữ liệu fixture riêng: nhận nguyên `options` (đã lọc theo Standard/System Type
// từ db.fixtures ở component cha) và trả về đúng composite key (_key) khi chọn — giữ nguyên cơ chế
// định danh ổn định đã cài ở bước trước.
function FixtureSearchSelect({ options, value, onChange, isMissing }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");

  const selected = options.find(o => o._key === value);
  const q = query.trim().toLowerCase();
  const filtered = q === ""
    ? options
    : options.filter(o => `${o.name || ""} ${o.abbr || ""}`.toLowerCase().includes(q));

  return (
    <div className="relative">
      <button
        type="button"
        onClick={() => setOpen(o => !o)}
        className="w-full flex items-center justify-between gap-2 bg-[#FAF7EF] border border-[#E7E0CE] rounded-lg px-2.5 py-2 text-sm text-[#243B36] focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/30"
      >
        <span className="truncate text-left">
          {selected ? `${selected.name}${selected.abbr ? ` (${selected.abbr})` : ""}` : "Chọn fixture"}
        </span>
        {selected && isMissing(selected) && <AlertTriangle size={13} className="text-[#C13A3A] shrink-0" />}
      </button>

      {open && (
        <>
          {/* Lớp phủ trong suốt để đóng danh sách khi chạm ra ngoài — không đổi layout tổng thể */}
          <div className="fixed inset-0 z-10" onClick={() => { setOpen(false); setQuery(""); }} />
          <div className="absolute z-20 mt-1 w-full bg-white border border-[#E7E0CE] rounded-xl shadow-lg overflow-hidden">
            <div className="p-2 border-b border-[#EDE6D6]">
              <div className="flex items-center gap-1.5 bg-[#FAF7EF] rounded-lg px-2 py-1.5">
                <Search size={13} className="text-[#9AA6A1] shrink-0" />
                <input
                  autoFocus
                  value={query}
                  onChange={e => setQuery(e.target.value)}
                  placeholder="Tìm theo tên hoặc mã fixture..."
                  className="w-full bg-transparent text-sm outline-none text-[#243B36]"
                />
              </div>
            </div>
            <div className="max-h-52 overflow-y-auto">
              {filtered.length === 0 && (
                <div className="px-3 py-3 text-xs text-[#9AA6A1]">Không tìm thấy fixture phù hợp.</div>
              )}
              {filtered.map(f => {
                const miss = isMissing(f);
                const isSelected = f._key === value;
                return (
                  <button
                    type="button"
                    key={f._key}
                    onClick={() => { onChange(f._key); setOpen(false); setQuery(""); }}
                    className={`w-full flex items-center justify-between gap-2 text-left px-3 py-2 text-sm transition ${
                      isSelected ? "bg-[#EAF5F2] text-[#1F7A70] font-medium" : "text-[#243B36] hover:bg-[#F2FAF8]"
                    }`}
                  >
                    <span className="truncate">{f.name}{f.abbr ? ` (${f.abbr})` : ""}</span>
                    {miss && <span className="text-[10px] font-medium text-[#C13A3A] shrink-0">thiếu FU</span>}
                  </button>
                );
              })}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ============================ Module 1 ============================ */

// STEP 15/16: 4 fixture mặc định (UX thuần, KHÔNG phải dữ liệu database). Tìm bằng cách lọc DB.fixtures
// theo đúng Standard + System Type hiện tại (không hard-code "IPC" — xem STEP 16 fix), khớp qua `abbr`/`name`
// đã có sẵn trong DB — không hard-code bất kỳ FU Cold/Hot/abbreviation cụ thể nào, không tạo dữ liệu kỹ thuật mới.
// STEP 16: thêm tham số `seedSystemType` — bắt buộc với các Standard có System Type (VD BS EN: Small/Medium/Large)
// để không lấy nhầm dòng của System Type khác (tránh trùng abbr như "Bth" DN15/DN20 đã ghi nhận từ Step 1).
// So sánh (f.systemType ?? "") === (seedSystemType ?? "") để coi null và "" là tương đương (IPC/QCVN/AS NZS
// đều có systemType=null trong DB, khớp đúng với seedSystemType="" mặc định).
// Nếu Standard hạt giống không có đủ 4 loại (VD: AS NZS không có Urinal), chỉ trả về các dòng tìm được —
// KHÔNG suy diễn/bịa fixture thay thế.
function buildInitialFixtureRows(db, seedStandard, seedSystemType) {
  const pool = db.fixtures.filter(f => f.standard === seedStandard && (f.systemType ?? "") === (seedSystemType ?? ""));
  const findFirst = pred => {
    const f = pool.find(pred);
    if (!f) return null;
    const key = `${f.standard}||${f.systemType ?? ""}||${f.name ?? ""}||${f.abbr ?? ""}`;
    return { fixtureId: key, qty: 1 };
  };
  const rows = [
    findFirst(f => (f.abbr || "").toString().toUpperCase().startsWith("WC")),       // WC
    findFirst(f => (f.name || "").toLowerCase().includes("basin")),                 // Basin
    findFirst(f => (f.name || "").toLowerCase().includes("shower")),                // Shower
    findFirst(f => (f.abbr || "").toString().toUpperCase().startsWith("UR")),       // Ur
  ];
  return rows.filter(Boolean);
}

// STEP 17 (Phương án B): Module1 giờ là "controlled component" — toàn bộ design state
// (standard, buildingType, systemType, waterSystem, flushingType, fixtures, calculated) và các giá trị
// derived từ chúng (standardOptions, systemTypeOptions, flushingTypeOptions, availableFixtures,
// fixtureByKey, totalFU, missingFuKeys, designFlow, fuRange, outOfRange) được nâng lên App — Module1
// chỉ nhận qua props (tên biến giữ nguyên như cũ để toàn bộ JSX/hàm hành động bên dưới không cần đổi).
// Nhờ vậy Module1 có thể unmount/remount khi chuyển Module mà KHÔNG mất dữ liệu — vì dữ liệu không còn
// sống trong Module1 nữa. Xem đầy đủ lý do tại App.
function Module1({
  DB, onGoto, onExportExcel,
  standard, setStandard, buildingType, setBuildingType, systemType, setSystemType,
  waterSystem, setWaterSystem, flushingType, setFlushingType,
  dbFixtures, setDbFixtures, customFixtures, setCustomFixtures, allFixtures,
  calculated, setCalculated,
  standardOptions, systemTypeOptions, flushingTypeOptions,
  availableFixtures, totalFU, missingFuKeys, designFlow, fuRange, outOfRange,
  // FIX V08_01 — ROOT CAUSE: customFUContribution được dùng ở JSX dòng "Custom FU contribution: ..."
  // nhưng trước đây KHÔNG có trong danh sách prop nhận từ App (biến chỉ tồn tại trong App, ngoài phạm vi
  // của Module1) -> ReferenceError khi render đúng lúc calculated=true && customFixtures.length>0,
  // bị ErrorBoundary nuốt lỗi và thay UI bằng màn hình lỗi. Thêm đúng prop này, không đổi gì khác.
  customFUContribution,
  logActivity, // ghi log hoạt động vào Supabase (bảng user_activity) — giữ nguyên tính năng đã có trong bản deploy cũ
}) {
  // CUSTOM-FIXTURE-ARCHITECTURE-V04 — Toàn bộ hàm dưới đây giờ thao tác ĐÚNG state riêng (dbFixtures hoặc
  // customFixtures), không còn dùng chung 1 setter + discriminator `type` như trước. Add/Edit/Delete DB
  // fixture KHÔNG THỂ chạm vào customFixtures và ngược lại — đảm bảo bằng kiến trúc.
  const updateQty = (idx, qty) => {
    const copy = [...dbFixtures];
    copy[idx] = { ...copy[idx], qty: Math.max(0, parseInt(qty) || 0) };
    setDbFixtures(copy);
    setCalculated(false);
  };
  const removeRow = idx => { setDbFixtures(dbFixtures.filter((_, i) => i !== idx)); setCalculated(false); };
  const addRow = () => {
    const used = new Set(dbFixtures.map(f => f.fixtureId));
    const next = availableFixtures.find(f => !used.has(f._key)) || availableFixtures[0];
    if (!next) return; // Không còn fixture nào trong DB để thêm
    setDbFixtures([...dbFixtures, { fixtureId: next._key, qty: 1 }]);
    setCalculated(false);
  };
  const updateFixture = (idx, fixtureId) => {
    const copy = [...dbFixtures];
    copy[idx] = { ...copy[idx], fixtureId };
    setDbFixtures(copy);
    setCalculated(false);
  };

  // STEP 29 — Custom Fixture: KHÔNG ghi vào db.fixtures/DEFAULT_DB, chỉ sống trong `fixtures` (Design state
  // chung ở App) — nhờ vậy tự động persist qua Module1<->Module2 giống mọi fixture khác (đã có từ Step 17/18),
  // không cần thêm cơ chế persistence riêng nào.
  const [customFormOpen, setCustomFormOpen] = useState(false);
  const [customForm, setCustomForm] = useState({
    name: "", abbr: "", qty: "1", inputMode: "FU", fuCold: "", fuHot: "", flowCold: "", flowHot: "",
  });
  const [customFormError, setCustomFormError] = useState(null);

  const resetCustomForm = () => {
    setCustomForm({ name: "", abbr: "", qty: "1", inputMode: "FU", fuCold: "", fuHot: "", flowCold: "", flowHot: "" });
    setCustomFormError(null);
  };

  // STEP 29 (PART 15) — Validate: Name/Abbr bắt buộc (trim, không rỗng); Quantity > 0; FU/L-s >= 0, không
  // NaN/Infinity. Cho phép FU Cold=0 VÀ FU Hot=0 đồng thời — không có quy tắc nào trong app/DB hiện tại
  // cấm tổ hợp này (fixture Database cũng có thể có FU=0 ở 1 phía, VD WC ở Hot Water qua isHotWaterIneligible
  // — không có tiền lệ cấm cả 2 phía đều 0), nên không tự đặt thêm rule nghiệp vụ mới.
  // CUSTOM-FIXTURE-FINAL FIX — <input type="number"> phụ thuộc locale trình duyệt: nếu gõ dấu phẩy thập
  // phân (thói quen phổ biến, VD "1,5"), chuẩn HTML5 number input coi là giá trị KHÔNG hợp lệ, e.target.value
  // có thể trả về khác với những gì hiển thị trên màn hình (rủi ro thật, đã xác nhận qua audit code — không
  // phải suy đoán). Đổi sang input dạng text (inputMode="decimal" giữ bàn phím số trên mobile) + tự parse
  // chấp nhận CẢ dấu chấm VÀ dấu phẩy, không phụ thuộc hành vi parse nội bộ của trình duyệt/locale.
  const parseDecimal = s => {
    if (s === null || s === undefined) return NaN;
    const normalized = String(s).trim().replace(",", ".");
    if (normalized === "") return NaN;
    return Number(normalized);
  };

  const validateCustomForm = f => {
    const name = f.name.trim();
    const abbr = f.abbr.trim();
    if (!name) return "Vui lòng nhập Fixture Name.";
    if (!abbr) return "Vui lòng nhập Abbreviation.";
    const qty = parseDecimal(f.qty);
    if (!Number.isFinite(qty) || qty <= 0) return "Quantity phải là số > 0.";
    if (f.inputMode === "FU") {
      const fc = parseDecimal(f.fuCold), fh = parseDecimal(f.fuHot);
      if (!Number.isFinite(fc) || fc < 0) return "FU Cold phải là số ≥ 0.";
      if (!Number.isFinite(fh) || fh < 0) return "FU Hot phải là số ≥ 0.";
    } else {
      const flc = parseDecimal(f.flowCold), flh = parseDecimal(f.flowHot);
      if (!Number.isFinite(flc) || flc < 0) return "Cold Water Flow phải là số ≥ 0.";
      if (!Number.isFinite(flh) || flh < 0) return "Hot Water Flow phải là số ≥ 0.";
    }
    return null;
  };

  const addCustomFixtureRow = () => {
    const err = validateCustomForm(customForm);
    if (err) {
      console.log("[CUSTOM TRACE 07] validateCustomForm THẤT BẠI:", err, "| customForm lúc submit:", JSON.stringify(customForm));
      setCustomFormError(err);
      // CUSTOM-FIXTURE-ROOT-CAUSE-FIX-V05 — window.alert() chặn tương tác cho TRƯỜNG HỢP LỖI, đối xứng với
      // alert thành công bên dưới — không thể nhầm "form vẫn còn hiện dữ liệu tôi vừa gõ" với "đã thêm
      // thành công", vì CẢ HAI trường hợp giờ đều bắt buộc phải đọc 1 hộp thoại chặn trước khi làm gì tiếp.
      window.alert("KHÔNG thể thêm Custom Fixture: " + err);
      return;
    }
    console.log("[CUSTOM TRACE 08] customForm BEFORE add (validate PASS):", JSON.stringify(customForm));
    const row = {
      id: generateCustomFixtureId(),
      type: "custom",
      name: customForm.name.trim(),
      abbr: customForm.abbr.trim(),
      qty: Math.max(0, Math.round(parseDecimal(customForm.qty)) || 0),
      inputMode: customForm.inputMode,
      fuCold: customForm.inputMode === "FU" ? parseDecimal(customForm.fuCold) : null,
      fuHot: customForm.inputMode === "FU" ? parseDecimal(customForm.fuHot) : null,
      flowCold: customForm.inputMode === "FLOW" ? parseDecimal(customForm.flowCold) : null,
      flowHot: customForm.inputMode === "FLOW" ? parseDecimal(customForm.flowHot) : null,
    };
    console.log("[CUSTOM TRACE 09] custom row CREATED:", JSON.stringify(row));
    // CUSTOM-FIXTURE-FINAL FIX — đổi sang functional update: setCustomFixtures(prev => [...prev, row])
    // thay vì đọc `customFixtures` từ closure rồi set trực tiếp — cùng loại race condition đã sửa cho
    // customForm nhưng trước đây BỎ SÓT ở đây. addCustomFixtureRow luôn dùng ĐÚNG giá trị customFixtures
    // mới nhất tại thời điểm setState thực thi, không phụ thuộc closure của lần render lúc hàm được tạo.
    let addedCount = 0;
    setCustomFixtures(prev => {
      const next = [...prev, row];
      addedCount = next.length;
      console.log("[CUSTOM TRACE 10] customFixtures BEFORE (length=" + prev.length + "):", JSON.stringify(prev));
      console.log("[CUSTOM TRACE 11] customFixtures AFTER (length=" + next.length + "):", JSON.stringify(next));
      return next;
    });
    setCalculated(false);
    // CUSTOM-FIXTURE-ROOT-CAUSE-FIX-V05 — Xác nhận THÀNH CÔNG rõ ràng, không thể nhầm lẫn với trường hợp
    // validate thất bại (form vẫn mở, vẫn hiện đúng dữ liệu vừa gõ trên màn hình — dễ khiến người dùng
    // tưởng đã thêm thành công dù addCustomFixtureRow() đã return sớm ở nhánh lỗi bên trên, chưa hề gọi
    // setCustomFixtures). window.alert() chặn tương tác, không thể bỏ sót — chỉ hiện khi setCustomFixtures
    // ĐÃ THỰC SỰ được gọi.
    window.alert("Đã thêm Custom Fixture \"" + row.name + "\" (Qty=" + row.qty + ", FU Cold=" + row.fuCold + ", FU Hot=" + row.fuHot + ").");
    resetCustomForm();
    setCustomFormOpen(false);
  };

  const removeCustomRow = idx => { setCustomFixtures(prev => prev.filter((_, i) => i !== idx)); setCalculated(false); };

  // STEP 29 (PART 8) — Edit custom fixture trực tiếp trên dòng bảng (không tách modal riêng, tối thiểu hoá
  // thay đổi UI). Đổi inputMode: KHÔNG tự convert FU<->L/s bằng công thức giả định — chỉ đơn giản đổi field
  // đang dùng, giá trị mode cũ giữ nguyên trong state nhưng không còn được tính (đã cảnh báo trong UI).
  const updateCustomFixtureRow = (idx, patch) => {
    setCustomFixtures(prev => {
      const copy = [...prev];
      copy[idx] = { ...copy[idx], ...patch };
      console.log("[CUSTOM DEBUG] updateCustomFixtureRow(" + idx + ",", JSON.stringify(patch), ") -> dòng sau khi sửa:", JSON.stringify(copy[idx]));
      return copy;
    });
    setCalculated(false);
  };

  const canCalc = allFixtures.length > 0;

  return (
    <div className="max-w-5xl mx-auto px-5 py-8">
      <Logo title="Water Demand Assistant" />

      <div className="grid md:grid-cols-2 gap-6">
        {/* Left column */}
        <div className="space-y-6">
          <Card>
            <SectionTitle icon={Settings}>Project Settings</SectionTitle>
            {/* Thứ tự chọn theo đúng phân cấp: Standard -> System Type (nếu Standard đó có) -> Flushing Type -> Water System.
                Building Type giữ lại làm thông tin dự án (không ảnh hưởng phép tính Module 1),
                đặt sau cùng để không phá vỡ phân cấp lựa chọn kỹ thuật chính. */}
            <Field label="Design Standard">
              <Select
                value={standard}
                onChange={v => { setStandard(v); setCalculated(false); }}
                options={standardOptions.map(v => ({ value: v, label: v }))}
              />
            </Field>
            {systemTypeOptions.length > 0 && (
              <Field label="System Type">
                <Select
                  value={systemType}
                  onChange={v => { setSystemType(v); setCalculated(false); }}
                  options={systemTypeOptions.map(v => ({ value: v, label: v }))}
                />
              </Field>
            )}
            <Field label="Flushing Type (toàn dự án)">
              <ToggleGroup
                value={flushingType}
                onChange={v => { setFlushingType(v); setCalculated(false); }}
                options={flushingTypeOptions}
              />
            </Field>
            <Field label="Water System">
              <Toggle2
                value={waterSystem}
                onChange={v => { setWaterSystem(v); setCalculated(false); }}
                leftLabel="Cold Water" rightLabel="Hot Water"
                leftIcon={<span>❄️</span>} rightIcon={<span>☀️</span>}
              />
            </Field>
            <Field label="Building Type (thông tin dự án)">
              <Select
                value={buildingType}
                onChange={setBuildingType}
                options={["Residential", "Hotel", "Hospital"].map(v => ({ value: v, label: v }))}
              />
            </Field>
          </Card>
        </div>

        {/* Right column */}
        <div className="space-y-6">
          <Card>
            <SectionTitle icon={Droplet}>Add &amp; Edit Fixtures</SectionTitle>
            <div className="space-y-2">
              <div className="grid grid-cols-[1fr_70px_32px] text-xs font-medium text-[#7D8B87] px-1">
                <span>Fixture</span><span className="text-center">Qty</span><span />
              </div>
              {dbFixtures.map((row, idx) => (
                <div key={row.fixtureId || idx} className="grid grid-cols-[1fr_70px_32px] items-center gap-2">
                  <FixtureSearchSelect
                    options={availableFixtures}
                    value={row.fixtureId}
                    onChange={fixtureId => updateFixture(idx, fixtureId)}
                    isMissing={f => {
                      const raw = waterSystem === "Cold Water" ? f.fuCold : (f.fuHot ?? f.fuCold);
                      return raw === null || raw === undefined;
                    }}
                  />
                  <input
                    type="number" min={0} value={row.qty}
                    onChange={e => updateQty(idx, e.target.value)}
                    className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-lg px-2 py-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/30"
                  />
                  <button onClick={() => removeRow(idx)} className="text-[#C13A3A]/70 hover:text-[#C13A3A] flex justify-center">
                    <Trash2 size={16} />
                  </button>
                </div>
              ))}
              {customFixtures.map((row, idx) => (
                <div key={row.id} className="border border-[#1F7A70]/25 bg-[#F2FAF8] rounded-xl p-2 space-y-1.5">
                  <div className="grid grid-cols-[1fr_70px_32px] items-center gap-2">
                    <div className="flex items-center gap-1.5">
                      <input
                        type="text" value={row.name}

/* ============================ Excel import ============================ */

// Đọc 1 sheet ra mảng-mảng (header:1), bỏ dòng trống đầu/cuối
function sheetRows(wb, name) {
  const ws = wb.Sheets[name];
  if (!ws) return [];
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
}

function parseWorkbook(wb) {
  const pipeSizes = sheetRows(wb, "Pipe_Sizes")
    .filter(r => r[0] != null && r[0] !== "ID")
    .map(r => ({ material: r[1], dn: r[4], od: r[5], id: r[6] }));

  const materials = sheetRows(wb, "Material")
    .filter(r => r[0] != null && r[0] !== "Material")
    .map(r => ({ material: r[0], c: r[1], roughness: r[3] }));

  const fixtures = sheetRows(wb, "Fixture Unit")
    .filter(r => r[0] != null && r[0] !== "Standard")
    .map(r => ({
      standard: r[0], systemType: r[1],
      name: typeof r[2] === "string" ? r[2].trim() : r[2],
      abbr: r[3], fuCold: r[4], fuHot: r[5], fuTotal: r[6],
    }));

  const fu2flow = sheetRows(wb, "FU to flowrate")
    .filter(r => r[0] != null && r[0] !== "Standard")
    .map(r => ({ standard: r[0], type: r[1], fu: r[2], ls: r[4] }))
    .filter(r => typeof r.fu === "number");

  const velocity = sheetRows(wb, "Velocity Criteria")
    .filter(r => r[0] != null && r[0] !== "Standard")
    .map(r => ({ standard: r[0], building: r[1], system: r[2], recommended: r[3], maximum: r[4] }));

  return { pipeSizes, materials, fixtures, fu2flow, velocity };
}

// Khóa lưu trữ database cá nhân (shared:false) — chỉ người dùng hiện tại thấy được,
// không phải database "Publish" dùng chung (chưa triển khai ở bước này theo đúng yêu cầu).
const IMPORTED_DB_STORAGE_KEY = "imported-database-v1";

// Giải mã base64 an toàn cho UTF-8 (btoa/atob gốc của trình duyệt không xử lý đúng ký tự ngoài Latin1,
// ví dụ dấu tiếng Việt trong comment) — dùng đúng cặp encode/decode đối xứng với script build (Python) đã tạo 2 blob trên.
function computeTotalFUForWaterSystem(fixtures, fixtureByKey, waterSystemChoice) {
  const isIneligible = f => {
    const a = (f.abbr || "").toString().toUpperCase();
    return a.startsWith("WC") || a.startsWith("UR");
  };
  let sum = 0;
  const missing = [];
  for (const row of fixtures) {
    if (row.type === "custom") {
      if (row.inputMode !== "FU") { console.log("[CUSTOM DEBUG] computeTotalFUForWaterSystem: bỏ qua row custom '" + row.name + "' vì inputMode=" + row.inputMode + " (không phải FU)"); continue; } // FLOW-mode: không cộng vào FU, xử lý riêng
      const raw = waterSystemChoice === "Cold Water" ? row.fuCold : row.fuHot;
      // CUSTOM-FIXTURE-FINAL FIX — thêm !Number.isFinite(raw): input FU giờ là type="text" (cho phép gõ
      // dấu phẩy thập phân), nên khi đang sửa dòng đã Add (updateCustomFixtureRow, KHÔNG qua validate),
      // giá trị có thể tạm thời là NaN (VD đang gõ dở "1."). Coi NaN như missing để KHÔNG lan NaN vào sum.
      if (raw === null || raw === undefined || !Number.isFinite(raw)) { console.log("[CUSTOM DEBUG] computeTotalFUForWaterSystem: row custom '" + row.name + "' có " + (waterSystemChoice==="Cold Water"?"fuCold":"fuHot") + " = " + raw + " -> coi là MISSING, không cộng"); missing.push(row.id); continue; }
      console.log("[CUSTOM DEBUG] computeTotalFUForWaterSystem: cộng custom '" + row.name + "' -> raw=" + raw + " x qty=" + row.qty + " = " + (raw*(row.qty||0)) + " vào " + waterSystemChoice);
      sum += raw * (row.qty || 0);
      continue;
    }
    const fu = fixtureByKey[row.fixtureId];
    if (!fu) continue;
    let raw;
    if (waterSystemChoice === "Cold Water") raw = fu.fuCold;
    else if (isIneligible(fu)) raw = 0;
    else raw = fu.fuHot;
    if (raw === null || raw === undefined) { missing.push(row.fixtureId); continue; }
    sum += raw * (row.qty || 0);
  }
  return { total: missing.length > 0 ? null : sum, missing };
}

// STEP 29 — Custom fixture inputMode "FLOW": đóng góp Flow Rate (L/s) TRỰC TIẾP, KHÔNG quy đổi qua FU
// (app hiện không có bất kỳ hệ số FU<->L/s chính thức nào — không được giả định). Cộng CỘNG THÊM vào
// Design Flow đã tính từ FU (xem App: `designFlow`), không trộn vào phép tính interpolate() nào cả.
function computeDirectFlowContribution(fixtures, waterSystemChoice) {
  let sum = 0;
  for (const row of fixtures) {
    if (row.type !== "custom" || row.inputMode !== "FLOW") continue;
    const raw = waterSystemChoice === "Cold Water" ? row.flowCold : row.flowHot;
    // CUSTOM-FIXTURE-FINAL FIX — thêm !Number.isFinite(raw): inline edit không qua validate, giá trị
    // có thể tạm thời NaN trong lúc gõ dở (xem giải thích ở computeTotalFUForWaterSystem).
    if (raw === null || raw === undefined || !Number.isFinite(raw)) continue;
    sum += raw * (row.qty || 0);
  }
  return sum;
}

// STEP 29 — ID duy nhất cho custom fixture, KHÔNG dùng tên/index làm khoá (tránh trùng lặp khi đổi tên
// hoặc xoá/thêm dòng khác). Có fallback nếu môi trường không hỗ trợ crypto.randomUUID().
function generateCustomFixtureId() {
  if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
    return "custom-" + crypto.randomUUID();
  }
  return "custom-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
}

// STEP 27 — Hàm thuần, mirror CHÍNH XÁC logic của calculatePipeDesign() (App) nhưng nhận `waterSystemChoice`
// làm tham số thay vì đọc `waterSystem` đang active — CẦN THIẾT vì file Excel mẫu (master format) yêu cầu
// hiển thị ĐỒNG THỜI kết quả Pipe Sizing cho CẢ Cold Water LẪN Hot Water trên cùng 1 sheet, trong khi App
// chỉ tính 1 kết quả cho water system đang chọn tại 1 thời điểm. Đây là DUY NHẤT 1 công thức (velocityMs,
// headLossHW, pressureLossKPa, cùng logic chọn DN nhỏ nhất thoả limit, cùng cách phân loại PASS/WARNING/FAIL)
// — chỉ gọi 2 lần với water system khác nhau, giống hệt cách computeTotalFUForWaterSystem() đã làm cho FU.
// KHÔNG PHẢI công thức mới, KHÔNG suy diễn — nếu thiếu dữ liệu (Design Flow null, không có Material, Auto
// mode mà DB không có Velocity Criteria...) trả về trạng thái rõ ràng, không bịa số.
function computePipeResultForWaterSystem(db, standard, building, waterSystemChoice, material, velocityMode, manualVelocity, designFlow) {
  if (designFlow == null) return { na: true };
  const vs = waterSystemChoice === "Cold Water" ? "CW" : waterSystemChoice === "Hot Water" ? "HW" : null;
  if (!vs) return { na: true };
  const velCriteria = db.velocity.find(v => v.standard === standard && v.building === building && v.system === vs);
  if (velocityMode === "Auto" && !velCriteria) return { noCriteria: true };
  if (velocityMode === "Manual") {
    const mv = Number(manualVelocity);
    if (manualVelocity === "" || manualVelocity === null || !Number.isFinite(mv) || mv <= 0) return { invalidManualVelocity: true };
  }
  const materialInfo = db.materials.find(m => m.material === material);
  if (!materialInfo) return { na: true };
  const sizes = db.pipeSizes.filter(p => p.material === material).sort((a, b) => a.od - b.od);
  const limit = velocityMode === "Auto" ? velCriteria.recommended : Number(manualVelocity);
  let chosen = null;
  for (const p of sizes) {
    const v = velocityMs(designFlow, p.id);
    if (v <= limit) { chosen = { ...p, velocity: v }; break; }
  }
  if (!chosen && sizes.length > 0) {
    const last = sizes[sizes.length - 1];
    chosen = { ...last, velocity: velocityMs(designFlow, last.id) };
  }
  if (!chosen) return { notFound: true };
  const hf = headLossHW(designFlow, chosen.id, materialInfo.c, 100);
  const pLoss = pressureLossKPa(hf);
  let status = null;
  if (velCriteria) {
    status = "PASS";
    if (chosen.velocity > velCriteria.maximum) status = "FAIL";
    else if (chosen.velocity > velCriteria.recommended) status = "WARNING";
  }
  return { dn: chosen.dn, od: chosen.od, id: chosen.id, velocity: chosen.velocity, headLoss: hf, pressureLoss: pLoss, status, velCriteria };
}

// Hàm thuần — CHỈ đọc từ đối tượng `data` (application state + database) được truyền vào, KHÔNG đọc DOM,
// không hard-code Standard/Fixture/FU/Pipe Size/Velocity Criteria. Nếu 1 giá trị chưa có, ghi "N/A" —
// không suy diễn/bịa số liệu.
//
// STEP 27 — Đổi từ 4 sheet sang ĐÚNG 1 sheet "Design Summary", bám theo file mẫu (master format) người
// dùng cung cấp: Company/Project header -> Design Basis -> bảng Fixture -> 2 dòng tổng (Total FU +
// Design Flow), MỖI dòng tổng đồng thời có kết quả Pipe Sizing cho 1 water system (Cold ở dòng "Total FU",
// Hot ở dòng "Design Flow") — đã xác nhận bằng cách đối chiếu số liệu mẫu khớp đúng công thức hiện có cho
// Cold Water (khớp tuyệt đối); Hot Water trong mẫu không khớp công thức thật — KHÔNG cố ép khớp, dùng số
// tính thật, không sửa 1 dòng công thức nào.
//
// Quyết định cần bạn xác nhận lại (đã báo rõ trong report cuối): dòng "System Type" trong mẫu chứa giá trị
// kiểu "Flush valve/ Flush tank" — khớp với khái niệm Flushing Type của app hơn là System Type (Small/
// Medium/Large của BS EN) — nên tôi map "System Type" trong Excel -> `flushingType` của app. "Water System"
// trong mẫu ghi "Cold Water/ Hot Water" (kiểu placeholder) -> tôi map thành giá trị waterSystem đang active
// thực tế (1 giá trị, không phải chuỗi gộp).
function exportDesignToExcel(data) {
  const {
    db, standard, buildingType, systemType, waterSystem, flushingType,
    fixtures: allFixtures, fixtureByKey,
    material, building, velocityMode, manualVelocity,
  } = data;

  // STEP 28 (PART 7): log rõ ràng từng bước — giúp tự debug ngay trên browser thật (F12 → Console) nếu
  // vẫn còn hiện tượng "không có gì xảy ra" sau khi bấm Export. KHÔNG spam console (chỉ 1 dòng/bước).
  console.log("[Excel Export] Start");

  // STEP 28 (PART 3/14): guard tường minh — nếu vì lý do gì đó (CDN load lỗi/chặn mạng) mà global XLSX
  // không tồn tại, báo lỗi RÕ RÀNG ngay lập tức thay vì để lỗi mơ hồ ở bước dùng XLSX.* bên dưới.
  if (typeof XLSX === "undefined" || typeof XLSX.write !== "function" || typeof XLSX.utils === "undefined") {
    console.error("[Excel Export] XLSX library không khả dụng (typeof XLSX =", typeof XLSX, ")");
    throw new Error("Thư viện XLSX chưa sẵn sàng (có thể do CDN chưa tải xong hoặc bị chặn mạng). Vui lòng tải lại trang và thử lại.");
  }
  console.log("[Excel Export] XLSX available");

  const NA = "N/A";
  const fmtNum = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v)) ? NA : Number(v).toFixed(d);
  // Cột "DN" trong file mẫu là SỐ (VD 50, 32), không phải chuỗi "DN50" như result.dn lưu trong App —
  // chỉ tách phần số để hiển thị đúng layout mẫu, KHÔNG đổi cách lưu/tính DN trong app.
  const dnNumber = dn => {
    if (!dn) return null;
    const m = String(dn).match(/\d+(\.\d+)?/);
    return m ? Number(m[0]) : null;
  };

  const totalFUCold = computeTotalFUForWaterSystem(allFixtures, fixtureByKey, "Cold Water").total;
  const totalFUHot = computeTotalFUForWaterSystem(allFixtures, fixtureByKey, "Hot Water").total;

  const flushTypeForFlow = flushingType; // Flushing Type dùng chung cho tra FU->Flow của cả 2 water system
  // STEP 29 — Cộng thêm đóng góp Flow trực tiếp (L/s) từ custom fixture inputMode="FLOW" — giống hệt cách
  // App tính designFlow (đã sửa ở Step 29), giữ đúng nguyên tắc "không suy diễn": nếu phần FU-based bị null
  // (thiếu dữ liệu/ngoài khoảng DB), toàn bộ Design Flow vẫn null — không lặng lẽ bỏ qua phần FU để chỉ
  // hiện phần Flow trực tiếp.
  const directFlowCold = computeDirectFlowContribution(allFixtures, "Cold Water");
  const directFlowHot = computeDirectFlowContribution(allFixtures, "Hot Water");
  const fuBasedFlowCold = totalFUCold == null ? null : interpolate(db.fu2flow, standard, flushTypeForFlow, totalFUCold);
  const fuBasedFlowHot = totalFUHot == null ? null : interpolate(db.fu2flow, standard, flushTypeForFlow, totalFUHot);
  const designFlowCold = fuBasedFlowCold == null ? null : fuBasedFlowCold + directFlowCold;
  const designFlowHot = fuBasedFlowHot == null ? null : fuBasedFlowHot + directFlowHot;

  const pipeCold = computePipeResultForWaterSystem(db, standard, building, "Cold Water", material, velocityMode, manualVelocity, designFlowCold);
  const pipeHot = computePipeResultForWaterSystem(db, standard, building, "Hot Water", material, velocityMode, manualVelocity, designFlowHot);

  const pipeCells = p => {
    if (!p || p.na || p.noCriteria || p.notFound || p.invalidManualVelocity) {
      return [NA, NA, NA, NA, NA, NA];
    }
    return [dnNumber(p.dn) ?? NA, p.od ?? NA, p.id ?? NA, fmtNum(p.velocity, 2), fmtNum(p.headLoss, 2), fmtNum(p.pressureLoss, 1)];
  };

  const issuedDate = new Date().toLocaleString();

  const aoa = [];
  aoa.push(["<Company Name>", ""]);
  aoa.push(["PROJECT NAME", ""]);
  aoa.push(["Issued Date", issuedDate]);
  aoa.push(["Prepare by", ""]);
  aoa.push(["Checked By", ""]);
  aoa.push([]);
  aoa.push(["Design Basis"]);
  aoa.push(["Design Standard", standard ?? NA]);
  aoa.push(["Building Type", buildingType ?? NA]);
  aoa.push(["System Type", flushingType || NA]); // xem giải thích quyết định mapping ở comment trên hàm
  aoa.push(["Water System", waterSystem ?? NA]);
  aoa.push(["Material", material ?? NA]);
  aoa.push([]);
  const HEADER_ROW_IDX = aoa.length; // 0-based, dùng để style header sau này
  aoa.push(["Fixture", "Abbreviation", "Quantity", "FU Cold water", "FU Hot water", "Total FU Cold", "Total FU Hot", "DN", "OD", "ID", "Velocity (m/s)", "Head Loss / 100m (m)", "Pressure Loss / 100m (kPa)"]);
  const FIXTURE_START_IDX = aoa.length;
  allFixtures.forEach(row => {
    const qty = row.qty || 0;
    // STEP 29 — Custom fixture: dùng đúng name/abbr/FU do người dùng tự khai, KHÔNG tra fixtureByKey.
    // inputMode="FLOW": không có giá trị FU nào để hiện ở 4 cột FU — ghi "N/A", KHÔNG bịa giá trị FU giả
    // (đóng góp Flow trực tiếp của nó đã được cộng vào dòng "Design Flow" tổng, không bị mất dữ liệu).
    if (row.type === "custom") {
      const label = row.name + (row.abbr ? ` (${row.abbr})` : "") + " [Custom]";
      if (row.inputMode === "FU") {
        aoa.push([
          label, row.abbr, qty,
          row.fuCold == null ? NA : row.fuCold,
          row.fuHot == null ? NA : row.fuHot,
          row.fuCold == null ? NA : row.fuCold * qty,
          row.fuHot == null ? NA : row.fuHot * qty,
          "", "", "", "", "", "",
        ]);
      } else {
        aoa.push([
          label, row.abbr, qty,
          NA, NA, NA, NA, // không có FU — inputMode là Flow trực tiếp
          "", "", "", "", "", "",
        ]);
      }
      return;
    }
    const fu = fixtureByKey[row.fixtureId];
    if (!fu) { aoa.push([row.fixtureId, NA, qty, NA, NA, NA, NA, "", "", "", "", "", ""]); return; }
    aoa.push([
      fu.name, fu.abbr, qty,
      fu.fuCold == null ? NA : fu.fuCold,
      fu.fuHot == null ? NA : fu.fuHot,
      fu.fuCold == null ? NA : fu.fuCold * qty,
      fu.fuHot == null ? NA : fu.fuHot * qty,
      "", "", "", "", "", "", // DN..PressureLoss: để trống trên dòng fixture — pipe sizing là kết quả
                               // cho TỔNG Design Flow, không phải của riêng từng fixture (PART 4) — không bịa.
    ]);
  });
  const FIXTURE_END_IDX = aoa.length - 1;
  aoa.push([]);
  const TOTAL_ROW_IDX = aoa.length;
  aoa.push(["Total FU", "", "", "", "", totalFUCold == null ? NA : totalFUCold, totalFUHot == null ? NA : totalFUHot, ...pipeCells(pipeCold)]);
  const FLOW_ROW_IDX = aoa.length;
  aoa.push(["Design Flow (l/s)", "", "", "", "", designFlowCold == null ? NA : fmtNum(designFlowCold, 3), designFlowHot == null ? NA : fmtNum(designFlowHot, 3), ...pipeCells(pipeHot)]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(aoa);

  // STEP 27 (PART 7) — Column width bám theo mẫu (đã đọc trực tiếp từ file .xlsx mẫu bằng openpyxl).
  ws["!cols"] = [
    { wch: 34 }, { wch: 13 }, { wch: 10 }, { wch: 13 }, { wch: 11 },
    { wch: 12 }, { wch: 12 }, { wch: 7 }, { wch: 7 }, { wch: 7 },
    { wch: 14 }, { wch: 16 }, { wch: 18 },
  ];
  // Row height cho các dòng có set riêng trong mẫu (1-based row index).
  ws["!rows"] = { 1: { hpx: 27 } };
  [2, 3, 4, 5, 7, 8, 9, 10, 11, 12].forEach(r => { ws["!rows"][r] = { hpx: 21 }; });
  ws["!rows"][HEADER_ROW_IDX + 1] = { hpx: 51 };

  // STEP 27 — Cố gắng áp style (bold/italic) cho các dòng tiêu đề/tổng giống mẫu. LƯU Ý QUAN TRỌNG (đã ghi
  // rõ trong report cuối): gói `xlsx` (SheetJS community) đang dùng KHÔNG đảm bảo hỗ trợ ghi style khi export
  // — đây là giới hạn đã biết của thư viện, không phải lỗi logic. Vẫn set để tận dụng nếu bản thư viện hỗ trợ,
  // không có tác dụng phụ nếu bị bỏ qua.
  const boldRows = [1, 6, HEADER_ROW_IDX + 1]; // PROJECT NAME, Design Basis, header bảng fixture (0-based)
  const boldItalicRows = [TOTAL_ROW_IDX, FLOW_ROW_IDX];
  const applyStyle = (rowIdx, style) => {
    for (let c = 0; c < 13; c++) {
      const addr = XLSX.utils.encode_cell({ r: rowIdx, c });
      if (ws[addr]) ws[addr].s = style;
    }
  };
  boldRows.forEach(r => applyStyle(r, { font: { name: "Calibri", sz: 12, bold: true } }));
  boldItalicRows.forEach(r => applyStyle(r, { font: { name: "Calibri", sz: 12, bold: true, italic: true } }));

  XLSX.utils.book_append_sheet(wb, ws, "Design Summary");
  console.log("[Excel Export] Workbook created");

  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}`;
  // STEP 28 (PART 8): sanitize tường minh — loại bỏ mọi ký tự không hợp lệ trên tên file Windows/macOS
  // (/ \ : * ? " < > |) dù filename hiện tại (chỉ chữ số, gạch dưới, gạch ngang) vốn đã an toàn — phòng
  // thủ thêm cho trường hợp sau này filename được ghép thêm từ dữ liệu động khác (Project Name...).
  const rawFilename = `PipeDesignAssistant_${stamp}.xlsx`;
  const filename = rawFilename.replace(/[/\\:*?"<>|]/g, "_");

  // STEP 26/28 (giữ nguyên cơ chế Step 26, thêm log chi tiết) — Blob + <a download> thủ công — đã chứng
  // minh hoạt động ổn định trong môi trường Claude sandbox (dùng chung kỹ thuật với downloadTextFile()),
  // không dùng XLSX.writeFile() nội bộ của SheetJS. Toàn bộ chuỗi dưới đây chạy ĐỒNG BỘ (không có await/
  // setTimeout nào chen giữa click chuột của người dùng và a.click()) — giữ đúng "user gesture" để trình
  // duyệt không coi đây là popup bị chặn.
  const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array", cellStyles: true });
  console.log("[Excel Export] XLSX serialized, byteLength=", wbout.byteLength || wbout.length);

  const blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  console.log("[Excel Export] Blob created, size=", blob.size);

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  console.log("[Excel Export] Download triggered, filename=", filename);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  console.log("[Excel Export] Cleanup complete");
}

function ImportBar({ onImport, usingCustom, onReset }) {
  const inputRef = useRef(null);
  const [msg, setMsg] = useState(null);

  const handleFile = async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const db = parseWorkbook(wb);
      if (db.pipeSizes.length === 0 || db.fixtures.length === 0) {
        throw new Error("Không tìm thấy đủ sheet (Pipe_Sizes, Fixture Unit...) trong file.");
      }
      // Chỉ sau khi validate thành công mới cập nhật runtime DB + thử lưu vào personal storage.
      const persistResult = await onImport(db);
      const baseText = `Đã nạp: ${db.pipeSizes.length} pipe sizes, ${db.fixtures.length} fixtures, ${db.fu2flow.length} FU→Flow, ${db.velocity.length} velocity criteria.`;
      if (persistResult && persistResult.persisted) {
        setMsg({ ok: true, text: `${baseText} Đã lưu — vẫn dùng được sau khi tải lại trang.` });
      } else {
        setMsg({ ok: true, text: `${baseText} ⚠ Lưu trữ thất bại — vẫn dùng được trong phiên này, nhưng sẽ mất khi tải lại trang.` });
      }
    } catch (err) {
      // Import không hợp lệ -> KHÔNG đổi runtime DB (onImport chưa được gọi), báo lỗi rõ ràng.
      setMsg({ ok: false, text: "Lỗi đọc file: " + err.message });
    } finally {
      e.target.value = "";
    }
  };

  return (
    <div className="max-w-5xl mx-auto px-5 pt-5">
      <div className="flex flex-wrap items-center gap-3 bg-white/70 backdrop-blur border border-[#EDE6D6] rounded-2xl px-4 py-2.5">
        <button
          onClick={() => inputRef.current?.click()}
          className="flex items-center gap-1.5 text-xs font-semibold text-[#1F7A70] bg-[#EAF5F2] hover:bg-[#DFF0EC] px-3 py-1.5 rounded-full transition"
        >
          <Upload size={13} /> Cập nhật Database (.xlsx)
        </button>
        <input ref={inputRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={handleFile} />
        {usingCustom && (
          <button
            onClick={() => { onReset(); setMsg(null); }}
            className="flex items-center gap-1.5 text-xs font-medium text-[#7D8B87] hover:text-[#5C6863] px-3 py-1.5 rounded-full transition"
          >
            <RotateCcw size={13} /> Dùng lại dữ liệu mặc định
          </button>
        )}
        {/* Chỉ báo nguồn database — vị trí có sẵn, tái sử dụng nguyên trạng, không thêm UI mới */}
        <span className={`text-xs ${usingCustom ? "text-[#1F7A70]" : "text-[#B7BEB9]"}`}>
          {usingCustom ? "● Database: Imported" : "○ Database: Default"}
        </span>
        {msg && (
          <span className={`text-xs ${msg.ok ? "text-[#1E8A50]" : "text-[#C13A3A]"}`}>{msg.text}</span>
        )}
      </div>
    </div>
  );
}

// STEP 10 — Migration tối thiểu cho ĐÚNG 1 lỗi chính tả Standard đã xác nhận cụ thể trong lịch sử dự án:
// "AS NSZ" (bản Excel v3 cũ, có thể còn sót trong personal storage) -> "AS NZS" (đúng, từ v4 trở đi).
// CHỈ thay giá trị chuỗi ở field `standard` của 3 mảng liên quan — KHÔNG đụng bất kỳ field kỹ thuật nào khác
// (FU Cold/Hot, Demand L/s, Recommended/Maximum...). Không phải cơ chế chuẩn hoá Standard tổng quát,
// không áp dụng cho bất kỳ chuỗi nào khác ngoài đúng cặp lỗi đã xác nhận này.
function migrateStandardTypo(db) {
  if (!db) return db;
  const FIX = { "AS NSZ": "AS NZS" };
  const fixStd = s => (s in FIX ? FIX[s] : s);
  return {
    ...db,
    fixtures: Array.isArray(db.fixtures)
      ? db.fixtures.map(f => (f.standard in FIX ? { ...f, standard: fixStd(f.standard) } : f))
      : db.fixtures,
    fu2flow: Array.isArray(db.fu2flow)
      ? db.fu2flow.map(r => (r.standard in FIX ? { ...r, standard: fixStd(r.standard) } : r))
      : db.fu2flow,
    velocity: Array.isArray(db.velocity)
      ? db.velocity.map(v => (v.standard in FIX ? { ...v, standard: fixStd(v.standard) } : v))
      : db.velocity,
  };
}

// STEP 30 (PART 16) — Error Boundary: app hiện KHÔNG có bất kỳ cơ chế bắt lỗi render nào — bất kỳ exception
// nào trong cây component (dù nhỏ, ở bất cứ đâu) khiến React unmount TOÀN BỘ cây, tạo ra đúng hiện tượng
// "crash/trắng màn hình" đã báo cáo. Đây KHÔNG phải "che giấu lỗi bằng try/catch rộng" — Error Boundary
// KHÔNG nuốt lỗi hay tiếp tục tính với dữ liệu sai; nó DỪNG render nhánh bị lỗi, hiển thị rõ thông báo +
// chi tiết lỗi thật (console.error đầy đủ để debug), thay vì màn hình trắng không có thông tin gì.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("[ErrorBoundary] Lỗi render không mong muốn:", error);
    console.error("[ErrorBoundary] Component stack:", info && info.componentStack);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 24, fontFamily: "sans-serif", maxWidth: 560, margin: "48px auto" }}>
          <h2 style={{ color: "#C13A3A", marginBottom: 8 }}>Đã xảy ra lỗi không mong muốn</h2>
          <p style={{ color: "#444", marginBottom: 12 }}>
            Ứng dụng gặp lỗi khi hiển thị. Thiết kế/dữ liệu hiện tại không bị mất — bấm "Tải lại trang" rồi thử lại thao tác vừa làm.
          </p>
          <p style={{ fontSize: 12, color: "#7D8B87", background: "#FAF7EF", padding: 10, borderRadius: 8, wordBreak: "break-word" }}>
            Chi tiết lỗi (để báo cáo): {String((this.state.error && this.state.error.message) || this.state.error)}
          </p>
          <button
            onClick={() => window.location.reload()}
            style={{ marginTop: 16, padding: "8px 18px", background: "#1F7A70", color: "#fff", border: "none", borderRadius: 10, cursor: "pointer", fontSize: 14 }}
          >
            Tải lại trang
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

// Modal xác nhận mapping fixture khi đổi Standard (bổ sung theo yêu cầu — thay cho remap âm thầm cũ).
// Mỗi dòng fixture Database đang dùng phải được người dùng tự chọn fixture tương ứng ở Standard mới,
// hoặc để "Chưa chọn" (giữ nguyên như hành vi cũ khi không tìm được tương ứng). Qty không đổi.
function StandardMappingModal({ pending, onConfirm, onCancel }) {
  const [rows, setRows] = useState(() => (pending ? pending.rows.map(r => ({ ...r })) : []));

  React.useEffect(() => {
    setRows(pending ? pending.rows.map(r => ({ ...r })) : []);
  }, [pending]);

  if (!pending) return null;

  const setRowChoice = (idx, fixtureId) => {
    setRows(prev => prev.map((r, i) => (i === idx ? { ...r, selectedFixtureId: fixtureId } : r)));
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
      <div className="bg-white rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.25)] border border-[#EDE6D6] p-6 max-w-lg w-full max-h-[85vh] overflow-y-auto">
        <h2 className="text-base font-bold text-[#1F3B36] mb-1">Xác nhận Mapping Fixture</h2>

          Đổi Standard từ <strong className="text-[#243B36]">{pending.fromStandard || "(chưa chọn)"}</strong> sang{" "}
          <strong className="text-[#243B36]">{pending.toStandard || "(chưa chọn)"}</strong>. Vui lòng chọn fixture
          tương ứng ở Standard mới cho từng dòng bên dưới — Qty sẽ được giữ nguyên. Dòng nào để "Chưa chọn" sẽ
          giữ nguyên fixture cũ (cần chọn lại thủ công sau).
        </p>
        <div className="space-y-3 mb-5">
          {rows.map((row, idx) => (
            <div key={idx} className="border border-[#E7E0CE] rounded-xl p-3 bg-[#FAF7EF]">
              <div className="text-xs text-[#7D8B87] mb-1">
                Fixture cũ: <span className="font-medium text-[#243B36]">{row.oldLabel}</span>
                {" · "}Qty: <span className="font-medium text-[#243B36]">{row.qty}</span>
              </div>
              <Select
                value={row.selectedFixtureId}
                onChange={v => setRowChoice(idx, v)}
                options={[
                  { value: "", label: "— Chưa chọn / Bỏ qua —" },
                  ...pending.candidateOptions.map(o => ({ value: o.fixtureId, label: o.label })),
                ]}
              />
            </div>
          ))}
          {rows.length === 0 && (
            <p className="text-xs text-[#7D8B87]">Không có fixture Database nào cần mapping.</p>
          )}
        </div>
        <div className="grid grid-cols-2 gap-2">
          <SecondaryButton onClick={onCancel}>Hủy (giữ Standard cũ)</SecondaryButton>
          <PrimaryButton onClick={() => onConfirm(rows)}>Xác nhận & Áp dụng</PrimaryButton>
        </div>
      </div>
    </div>
  );
}

function MainApp({ user, trialDaysLeft, onLogout }) {
  const [screen, setScreen] = useState("m1");
  const [db, setDb] = useState(DEFAULT_DB);
  const [usingCustom, setUsingCustom] = useState(false);
  // LOG HOẠT ĐỘNG NGƯỜI DÙNG VÀO SUPABASE (giữ nguyên tính năng đã có trong bản deploy cũ)

  // ==================== STEP 17 (Phương án B): SHARED DESIGN STATE ====================
  // Nâng toàn bộ design state của Module 1 lên App để không bị mất khi Module1 unmount/remount
  // lúc chuyển qua lại với Module 2 (root cause đã xác định ở debug trước: App dùng ternary
  // `screen === "m1" ? <Module1/> : <Module2/>` khiến Module1 unmount hoàn toàn khi rời màn hình).
  //
  // STEP 5: "IPC" ở đây chỉ là giá trị khởi tạo tạm (seed) cho lần App mount đầu tiên,
  // KHÔNG phải danh sách lựa chọn hard-code — effect bên dưới tự sửa nếu "IPC" không có trong DB.
  const [standard, setStandard] = useState("IPC");
  const [buildingType, setBuildingType] = useState("Hotel");
  const [systemType, setSystemType] = useState("");
  const [waterSystem, setWaterSystem] = useState("Cold Water");
  const [flushingType, setFlushingType] = useState("");
  // STEP 15: lazy initializer — chỉ chạy ĐÚNG 1 LẦN lúc App mount thật sự (VD reload trang, CASE C) —
  // vì App không còn unmount/remount khi chuyển Module, chuyển qua lại Module1<->Module2 (CASE B)
  // sẽ KHÔNG chạy lại initializer này, tự động thoả đúng yêu cầu "không reseed khi chỉ điều hướng".
  // CUSTOM-FIXTURE-ARCHITECTURE-V04-2026-08-15 — Tách VẬT LÝ 2 state riêng biệt (không còn 1 mảng chung
  // dùng discriminator `type` để phân biệt): dbFixtures (chỉ fixture Database) và customFixtures (chỉ
  // fixture người dùng tự khai). Effect đổi Standard/SystemType (bên dưới) CHỈ được truyền setDbFixtures —
  // về mặt kiến trúc, KHÔNG THỂ chạm vào customFixtures dù vô tình hay cố ý, vì không hề có tham chiếu tới
  // setCustomFixtures ở đó. `fixtures` (dùng cho toàn bộ tính toán/Module2/Excel export phía dưới, y hệt
  // trước đây) giờ là giá trị DẪN XUẤT (derived), không phải state gốc.
  const [dbFixtures, setDbFixtures] = useState(() => buildInitialFixtureRows(DEFAULT_DB, "IPC", ""));
  const [customFixtures, setCustomFixtures] = useState([]);
  const allFixtures = useMemo(() => [...dbFixtures, ...customFixtures], [dbFixtures, customFixtures]);
  const [calculated, setCalculated] = useState(false);

  // ==== STANDARD-CHANGE MAPPING MODAL (bổ sung theo yêu cầu) ====
  // Trước đây: đổi Standard tự remap ÂM THẦM theo exact-match tên+abbr, không hỏi người dùng.
  // Giờ: đổi Standard mở modal xác nhận — người dùng tự chọn fixture mới tương ứng cho từng dòng
  // fixture Database đang dùng, KHÔNG tự động gán khi tên chỉ gần giống, Qty luôn giữ nguyên.
  // customFixtures TUYỆT ĐỐI không bị đụng tới ở đây (giữ đúng nguyên tắc kiến trúc cũ).
  const [pendingStandardChange, setPendingStandardChange] = useState(null);
  const dbFixturesRef = React.useRef(dbFixtures);
  React.useEffect(() => { dbFixturesRef.current = dbFixtures; }, [dbFixtures]);

  // STEP 5 — DANH SÁCH ĐỘNG: Design Standard lấy DISTINCT giá trị từ DB.fixtures[].standard.
  const standardOptions = useMemo(() => {
    const set = new Set();
    db.fixtures.forEach(f => { if (f.standard) set.add(f.standard); });
    return Array.from(set);
  }, [db]);

  React.useEffect(() => {
    if (standardOptions.length > 0 && !standardOptions.includes(standard)) {
      setStandard(standardOptions[0]);
    }
  }, [standardOptions]); // eslint-disable-line react-hooks/exhaustive-deps

  // STEP 5 — System Type: DISTINCT theo Standard đang chọn.
  const systemTypeOptions = useMemo(() => {
    const set = new Set();
    db.fixtures.forEach(f => {
      if (f.standard === standard && f.systemType != null && f.systemType !== "") set.add(f.systemType);
    });
    return Array.from(set);
  }, [db, standard]);

  React.useEffect(() => {
    if (systemTypeOptions.length > 0 && !systemTypeOptions.includes(systemType)) {
      setSystemType(systemTypeOptions[0]);
    } else if (systemTypeOptions.length === 0 && systemType !== "") {
      setSystemType("");
    }
  }, [systemTypeOptions]); // eslint-disable-line react-hooks/exhaustive-deps

  // STEP 5 — Flushing Type: DISTINCT theo Standard đang chọn.
  const flushingTypeOptions = useMemo(() => {
    const set = new Set();
    db.fu2flow.forEach(r => { if (r.standard === standard && r.type) set.add(r.type); });
    return Array.from(set);
  }, [db, standard]);

  React.useEffect(() => {
    if (flushingTypeOptions.length > 0 && !flushingTypeOptions.includes(flushingType)) {
      setFlushingType(flushingTypeOptions[0]);
    }
  }, [flushingTypeOptions]); // eslint-disable-line react-hooks/exhaustive-deps

  // Composite key ổn định cho fixture (Standard+SystemType+FixtureType+Abbr) — không đổi công thức,
  // chỉ chuyển vị trí từ Module1 lên App cùng với availableFixtures.
  const fixtureKey = f => `${f.standard}||${f.systemType ?? ""}||${f.name ?? ""}||${f.abbr ?? ""}`;

  const availableFixtures = useMemo(() => {
    return db.fixtures
      .filter(f => f.standard === standard && (systemTypeOptions.length === 0 || f.systemType === systemType))
      .map(f => ({ ...f, _key: fixtureKey(f) }));
  }, [db, standard, systemType, systemTypeOptions]);

  const fixtureByKey = useMemo(() => {
    const map = {};
    availableFixtures.forEach(f => { map[f._key] = f; });
    return map;
  }, [availableFixtures]);

  // CUSTOM-FIXTURE-ARCHITECTURE-V04 — Effect này giờ CHỈ nhận setDbFixtures, KHÔNG hề có tham chiếu tới
  // setCustomFixtures — về mặt kiến trúc, tuyệt đối không thể ảnh hưởng tới customFixtures dù logic bên
  // trong có lỗi gì đi nữa. Giữ đúng yêu cầu "đổi Standard chỉ rebuild DB fixtures, giữ nguyên quantity đã
  // nhập": remap từng dòng DB hiện có sang Standard mới theo identity name+abbr (parse trực tiếp từ
  // fixtureId cũ, không dùng fixtureByKey vì nó đã đổi theo Standard mới ngay khi re-render), giữ nguyên
  // qty. Fixture nào không tồn tại ở Standard mới: KHÔNG bịa, KHÔNG xoá âm thầm — giữ nguyên fixtureId cũ
  // (UI hiện tại đã xử lý an toàn, hiện "Chọn fixture").
  // STEP: prevStandardRef/prevSystemTypeRef thay cho prevKeyRef cũ — cần tách riêng 2 giá trị để
  // có thể REVERT dropdown về đúng giá trị trước đó nếu người dùng bấm Hủy ở modal mapping.
  const prevStandardRef = React.useRef(standard);
  const prevSystemTypeRef = React.useRef(systemType);
  React.useEffect(() => {
    const key = `${standard}|${systemType}`;
    const prevKey = `${prevStandardRef.current}|${prevSystemTypeRef.current}`;
    if (prevKey !== key) {
      const curDb = dbFixturesRef.current;
      if (curDb.length === 0) {
        // Không có fixture Database nào đang dùng -> không có gì để mapping -> chuyển thẳng, không cần modal.
        prevStandardRef.current = standard;
        prevSystemTypeRef.current = systemType;
        setDbFixtures(buildInitialFixtureRows(db, standard, systemType));
        setCalculated(false);
        return;
      }
      const newStdFixtures = db.fixtures.filter(
        f => f.standard === standard && (f.systemType ?? "") === (systemType ?? "")
      );
      const candidateOptions = newStdFixtures.map(f => ({
        fixtureId: `${f.standard}||${f.systemType ?? ""}||${f.name ?? ""}||${f.abbr ?? ""}`,
        label: `${f.name ?? ""}${f.abbr ? ` (${f.abbr})` : ""}`,
      }));
      const rows = curDb.map(row => {
        const parts = (row.fixtureId || "").split("||");
        const oldName = parts[2] ?? "";
        const oldAbbr = parts[3] ?? "";
        // Gợi ý CHỈ khi khớp CHÍNH XÁC tên+abbr (không fuzzy) — người dùng vẫn phải tự bấm Xác nhận,
        // đây chỉ là điền sẵn giúp đỡ thao tác, không phải tự động quyết định âm thầm.
        const exactMatch = newStdFixtures.find(f => (f.name ?? "") === oldName && (f.abbr ?? "") === oldAbbr);
        const suggestedFixtureId = exactMatch
          ? `${exactMatch.standard}||${exactMatch.systemType ?? ""}||${exactMatch.name ?? ""}||${exactMatch.abbr ?? ""}`
          : "";
        return {
          oldFixtureId: row.fixtureId,
          oldLabel: `${oldName}${oldAbbr ? ` (${oldAbbr})` : ""}` || "(không rõ tên)",
          qty: row.qty,
          selectedFixtureId: suggestedFixtureId,
        };
      });
      setPendingStandardChange({
        fromStandard: prevStandardRef.current,
        fromSystemType: prevSystemTypeRef.current,
        toStandard: standard,
        toSystemType: systemType,
        candidateOptions,
        rows,
      });
      // CHƯA setDbFixtures, CHƯA cập nhật prevStandardRef/prevSystemTypeRef, CHƯA setCalculated(false) —
      // đợi người dùng xác nhận trong modal. customFixtures vẫn KHÔNG bị đụng tới ở bất kỳ nhánh nào.
    }
  }, [standard, systemType]); // eslint-disable-line react-hooks/exhaustive-deps

  const confirmStandardMapping = (rows) => {
    if (!pendingStandardChange) return;
    setDbFixtures(prevDb =>
      prevDb.map((row, idx) => {
        const chosen = rows[idx] && rows[idx].selectedFixtureId;
        if (chosen) {

        }
        return row; // để trống -> giữ nguyên fixtureId cũ, không bịa, không xoá (giống hành vi cũ khi không có match)
      })
    );
    prevStandardRef.current = pendingStandardChange.toStandard;
    prevSystemTypeRef.current = pendingStandardChange.toSystemType;
    setCalculated(false);
    setPendingStandardChange(null);
