// Tự động chuyển localStorage khi chạy ngoài sandbox
(function installBrowserStorageShim() {
  if (typeof window === "undefined") return;
  if (window.storage && typeof window.storage.get === "function") return;

  const PREFIX = "pda_storage__";
  const keyFor = (key, shared) => PREFIX + (shared ? "shared__" : "personal__") + key;

  window.storage = {
    async get(key, shared) {
      const raw = window.localStorage.getItem(keyFor(key, shared));
      if (raw === null || raw === undefined) throw new Error("Key not found: " + key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      try {
        window.localStorage.setItem(keyFor(key, shared), String(value));
        return { key, value, shared: !!shared };
      } catch (e) { return null; }
    },
    async delete(key, shared) {
      try {
        window.localStorage.removeItem(keyFor(key, shared));
        return { key, deleted: true, shared: !!shared };
      } catch (e) { return null; }
    },
    async list(prefix, shared) {
      try {
        const scope = PREFIX + (shared ? "shared__" : "personal__");
        const keys = [];
        for (let i = 0; i < window.localStorage.length; i++) {
          const k = window.localStorage.key(i);
          if (k && k.startsWith(scope + (prefix || ""))) keys.push(k.slice(scope.length));
        }
        return { keys, prefix, shared: !!shared };
      } catch (e) { return { keys: [] }; }
    },
  };
})();

/* ============================ Auth Form Component ============================ */

function AuthForm({ onLoginSuccess }) {
  const [isSignUp, setIsSignUp] = useState(false);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [infoMsg, setInfoMsg] = useState("");

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setErrorMsg("");
    setInfoMsg("");

    try {
      if (!supabase) throw new Error("Chưa kết nối được với cơ sở dữ liệu Supabase!");
      if (isSignUp) {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        
        // Tự động thu thập email người dùng đăng ký vào bảng 'profiles'
        if (data?.user) {
          try {
             await supabase.from('profiles').insert([{ id: data.user.id, email: email, created_at: new Date().toISOString() }]);
          } catch(errProfile) {
             console.log("Lỗi tạo profile:", errProfile);
          }
        }
        
        setInfoMsg("Đăng ký thành công! Bạn có thể Đăng nhập ngay bây giờ.");
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onLoginSuccess(data.user);
      }
    } catch (err) {
      setErrorMsg(err.message || "Đã xảy ra lỗi, vui lòng thử lại!");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-[#EDE6D6] p-8 max-w-md w-full">
        <div className="flex flex-col items-center mb-6 text-center">
          <div className="w-12 h-12 rounded-full bg-gradient-to-br from-[#4FB3A6] to-[#1F7A70] flex items-center justify-center mb-3 text-white">
            <Droplet size={24} />
          </div>
          <h2 className="text-xl font-bold text-[#1F3B36]">Pipe Design Assistant</h2>
          <p className="text-xs text-[#7D8B87] mt-1">Đăng nhập tài khoản để sử dụng công cụ (Dùng thử miễn phí {TRIAL_DAYS} ngày)</p>
        </div>

        {errorMsg && (
          <div className="mb-4 text-xs text-[#C13A3A] bg-[#FBE7E7] rounded-xl p-3 border border-[#C13A3A]/20">
            {errorMsg}
          </div>
        )}
        {infoMsg && (
          <div className="mb-4 text-xs text-[#1E8A50] bg-[#E4F6EC] rounded-xl p-3 border border-[#1E8A50]/20">
            {infoMsg}
          </div>
        )}

        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block text-xs font-medium text-[#7D8B87] mb-1">Email của bạn</label>
            <input
              type="email"
              required
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="name@company.com"
              className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-xl px-3.5 py-2.5 text-sm text-[#243B36] focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/40"
            />
          </div>
          <div>
            <label className="block text-xs font-medium text-[#7D8B87] mb-1">Mật khẩu</label>
            <input
              type="password"
              required
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="••••••••"
              className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-xl px-3.5 py-2.5 text-sm text-[#243B36] focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/40"
            />
          </div>

          <button
            type="submit"
            disabled={loading}
            className="w-full mt-2 flex items-center justify-center gap-2 rounded-2xl py-3 font-semibold text-white text-sm bg-gradient-to-r from-[#4FB3A6] to-[#1F7A70] hover:brightness-105 transition shadow-md disabled:opacity-50"
          >
            {loading ? "Đang xử lý..." : isSignUp ? "Tạo tài khoản dùng thử" : "Đăng nhập"}
          </button>
        </form>

        <div className="mt-6 text-center text-xs text-[#7D8B87]">
          {isSignUp ? "Đã có tài khoản?" : "Chưa có tài khoản?"}{" "}
          <button
            onClick={() => { setIsSignUp(!isSignUp); setErrorMsg(""); setInfoMsg(""); }}
            className="font-semibold text-[#1F7A70] hover:underline"
          >
            {isSignUp ? "Đăng nhập ngay" : "Đăng ký dùng thử miễn phí"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================ Expired Trial Screen ============================ */

function ExpiredTrialScreen({ user, onLogout }) {

function interpolate(table, standard, type, totalFU) {
  const rows = table
    .filter(r => r.standard === standard && r.type === type && r.ls != null)
    .sort((a, b) => a.fu - b.fu);
  if (rows.length === 0) return null;
  const min = rows[0].fu, max = rows[rows.length - 1].fu;
  if (totalFU < min || totalFU > max) return null;
  for (let i = 0; i < rows.length - 1; i++) {
    const a = rows[i], b = rows[i + 1];
    if (totalFU >= a.fu && totalFU <= b.fu) {
      if (b.fu === a.fu) return a.ls;
      const t = (totalFU - a.fu) / (b.fu - a.fu);
      return a.ls + t * (b.ls - a.ls);
    }
  }
  return rows[rows.length - 1].ls;
}

function getFuRange(table, standard, type) {
  const rows = table.filter(r => r.standard === standard && r.type === type && r.ls != null);
  if (rows.length === 0) return null;
  const fus = rows.map(r => r.fu);
  return { min: Math.min(...fus), max: Math.max(...fus) };
}

function crossSectionArea(idMm) { return Math.PI * Math.pow(idMm / 2 / 1000, 2); }
function velocityMs(flowLs, idMm) { return (flowLs / 1000) / crossSectionArea(idMm); }
function headLossHW(flowLs, idMm, C, lengthM = 100) {
  return (10.67 * lengthM * Math.pow(flowLs / 1000, 1.852)) / (Math.pow(C, 1.852) * Math.pow(idMm / 1000, 4.8704));
}
function pressureLossKPa(headLossM) { return headLossM * 9.81; }
function fmt(n, d = 2) { return (n === null || n === undefined || isNaN(n)) ? "-" : Number(n).toFixed(d); }

function computeTotalFUForWaterSystem(fixtures, fixtureByKey, waterSystemChoice) {
  const isIneligible = f => {
    const a = (f.abbr || "").toString().toUpperCase();
    return a.startsWith("WC") || a.startsWith("UR");
  };
  let sum = 0;
  const missing = [];
  for (const row of fixtures) {
    const fu = fixtureByKey[row.fixtureId];
    if (!fu) continue;
    let raw;
    if (waterSystemChoice === "Cold Water") raw = fu.fuCold;
    else if (isIneligible(fu)) raw = 0;
    else raw = fu.fuHot;
    if (raw === null || raw === undefined) { missing.push(row.fixtureId); continue; }
    sum += raw * (row.qty || 0);
  }
  return { total: missing.length > 0 ? null : sum, missing };
}

function computePipeResultForWaterSystem(db, standard, building, waterSystemChoice, material, velocityMode, manualVelocity, designFlow) {
  if (designFlow == null) return { na: true };
  const vs = waterSystemChoice === "Cold Water" ? "CW" : waterSystemChoice === "Hot Water" ? "HW" : null;
  if (!vs) return { na: true };
  const velCriteria = db.velocity.find(v => v.standard === standard && v.building === building && v.system === vs);
  if (velocityMode === "Auto" && !velCriteria) return { noCriteria: true };
  if (velocityMode === "Manual") {
    const mv = Number(manualVelocity);
    if (manualVelocity === "" || manualVelocity === null || !Number.isFinite(mv) || mv <= 0) return { invalidManualVelocity: true };
  }
  const materialInfo = db.materials.find(m => m.material === material);
  if (!materialInfo) return { na: true };
  const sizes = db.pipeSizes.filter(p => p.material === material).sort((a, b) => a.od - b.od);
  const limit = velocityMode === "Auto" ? velCriteria.recommended : Number(manualVelocity);
  let chosen = sizes.find(p => velocityMs(designFlow, p.id) <= limit) || sizes[sizes.length - 1];
  if (!chosen) return { notFound: true };
  const hf = headLossHW(designFlow, chosen.id, materialInfo.c, 100);
  const pLoss = pressureLossKPa(hf);
  let status = velCriteria ? (chosen.velocity > velCriteria.maximum ? "FAIL" : chosen.velocity > velCriteria.recommended ? "WARNING" : "PASS") : null;
  return { dn: chosen.dn, od: chosen.od, id: chosen.id, velocity: velocityMs(designFlow, chosen.id), headLoss: hf, pressureLoss: pLoss, status };
}

function exportDesignToExcel(data) {
  const { db, standard, buildingType, waterSystem, flushingType, fixtures, fixtureByKey, material, building, velocityMode, manualVelocity } = data;
  if (typeof XLSX === "undefined") {
    alert("Thư viện xuất Excel chưa sẵn sàng!");
    return;
  }
  const NA = "N/A";
  const fmtNum = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v)) ? NA : Number(v).toFixed(d);
  const dnNumber = dn => dn ? (String(dn).match(/\d+(\.\d+)?/) ? Number(String(dn).match(/\d+(\.\d+)?/)[0]) : null) : null;

  const totalFUCold = computeTotalFUForWaterSystem(fixtures, fixtureByKey, "Cold Water").total;
  const totalFUHot = computeTotalFUForWaterSystem(fixtures, fixtureByKey, "Hot Water").total;
  const designFlowCold = totalFUCold == null ? null : interpolate(db.fu2flow, standard, flushingType, totalFUCold);
  const designFlowHot = totalFUHot == null ? null : interpolate(db.fu2flow, standard, flushingType, totalFUHot);

  const pipeCold = computePipeResultForWaterSystem(db, standard, building, "Cold Water", material, velocityMode, manualVelocity, designFlowCold);
  const pipeHot = computePipeResultForWaterSystem(db, standard, building, "Hot Water", material, velocityMode, manualVelocity, designFlowHot);

  const pipeCells = p => (!p || p.na || p.noCriteria || p.notFound) ? [NA, NA, NA, NA, NA, NA] : [dnNumber(p.dn) ?? NA, p.od ?? NA, p.id ?? NA, fmtNum(p.velocity, 2), fmtNum(p.headLoss, 2), fmtNum(p.pressureLoss, 1)];

  const aoa = [
    ["PIPE DESIGN ASSISTANT REPORT", ""],
    ["Issued Date", new Date().toLocaleString()],
    [],
    ["Design Basis"],
    ["Design Standard", standard ?? NA],
    ["Building Type", buildingType ?? NA],
    ["Flushing Type", flushingType || NA],
    ["Water System", waterSystem ?? NA],
    ["Material", material ?? NA],
    [],
    ["Fixture", "Abbreviation", "Quantity", "FU Cold water", "FU Hot water", "Total FU Cold", "Total FU Hot", "DN", "OD", "ID", "Velocity (m/s)", "Head Loss / 100m (m)", "Pressure Loss / 100m (kPa)"]
  ];

  fixtures.forEach(row => {
    const fu = fixtureByKey[row.fixtureId];
    const qty = row.qty || 0;
    if (!fu) { aoa.push([row.fixtureId, NA, qty, NA, NA, NA, NA, "", "", "", "", "", ""]); return; }
    aoa.push([fu.name, fu.abbr, qty, fu.fuCold ?? NA, fu.fuHot ?? NA, fu.fuCold ? fu.fuCold * qty : NA, fu.fuHot ? fu.fuHot * qty : NA, "", "", "", "", "", ""]);
  });

  aoa.push([]);
  aoa.push(["Total FU", "", "", "", "", totalFUCold ?? NA, totalFUHot ?? NA, ...pipeCells(pipeCold)]);
  aoa.push(["Design Flow (l/s)", "", "", "", "", fmtNum(designFlowCold, 3), fmtNum(designFlowHot, 3), ...pipeCells(pipeHot)]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  XLSX.utils.book_append_sheet(wb, ws, "Design Summary");

  const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `PipeDesignAssistant_${Date.now()}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ============================ App Component ============================ */

function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [trialDaysLeft, setTrialDaysLeft] = useState(0);
  const [isTrialExpired, setIsTrialExpired] = useState(false);

  const [screen, setScreen] = useState("m1");
  const [db, setDb] = useState(DEFAULT_DB);
  const [standard, setStandard] = useState("IPC");
  const [buildingType, setBuildingType] = useState("Hotel");
  const [systemType, setSystemType] = useState("");
  const [waterSystem, setWaterSystem] = useState("Cold Water");
  const [flushingType, setFlushingType] = useState("");
  const [fixtures, setFixtures] = useState(() => buildInitialFixtureRows(DEFAULT_DB, "IPC", ""));
  const [calculated, setCalculated] = useState(false);

  // Module 2 State
  const [material, setMaterial] = useState("HDPE");
  const [velocityMode, setVelocityMode] = useState("Auto");
  const [manualVelocity, setManualVelocity] = useState(2.0);
  const [building, setBuilding] = useState("Hotel");
  const [result, setResult] = useState(null);
  const [flowOverride, setFlowOverride] = useState(null);

  // Hàm thu thập dữ liệu người dùng lưu vào Supabase
  const logActivityToSupabase = async (action, details) => {
    if (!supabase || !user) return;
    try {
      await supabase.from('user_activity').insert([
        { 
          email: user.email, 
          action: action, 
          details: JSON.stringify(details), 
          created_at: new Date().toISOString() 
        }
      ]);
    } catch (err) {
      console.error("Supabase log error:", err);
    }
  };

  // Khôi phục phiên Supabase
  useEffect(() => {
    if (!supabase) {
      setLoading(false);
      return;
    }

    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        checkUserTrial(session.user);
      } else {
        setLoading(false);
      }
    });

    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        checkUserTrial(session.user);
      } else {
        setUser(null);
        setLoading(false);
      }
    });

    return () => subscription.unsubscribe();
  }, []);

  // Tính số ngày dùng thử còn lại
  const checkUserTrial = (userData) => {
    setUser(userData);
    const createdAt = new Date(userData.created_at);
    const now = new Date();
    const diffDays = Math.floor(Math.abs(now - createdAt) / (1000 * 60 * 60 * 24));
    
    const daysLeft = TRIAL_DAYS - diffDays;
    setTrialDaysLeft(daysLeft > 0 ? daysLeft : 0);
    setIsTrialExpired(diffDays > TRIAL_DAYS);
    setLoading(false);
  };

  const handleLogout = async () => {
    if (supabase) await supabase.auth.signOut();
    setUser(null);
  };

  const standardOptions = useMemo(() => Array.from(new Set(db.fixtures.map(f => f.standard).filter(Boolean))), [db]);
  const systemTypeOptions = useMemo(() => Array.from(new Set(db.fixtures.filter(f => f.standard === standard && f.systemType).map(f => f.systemType))), [db, standard]);
  const flushingTypeOptions = useMemo(() => Array.from(new Set(db.fu2flow.filter(r => r.standard === standard && r.type).map(r => r.type))), [db, standard]);
  const availableFixtures = useMemo(() => db.fixtures.filter(f => f.standard === standard && (systemTypeOptions.length === 0 || f.systemType === systemType)).map(f => ({ ...f, _key: `${f.standard}||${f.systemType ?? ""}||${f.name ?? ""}||${f.abbr ?? ""}` })), [db, standard, systemType, systemTypeOptions]);
  const fixtureByKey = useMemo(() => { const map = {}; availableFixtures.forEach(f => { map[f._key] = f; }); return map; }, [availableFixtures]);

  const { totalFU, missingFuKeys } = useMemo(() => {
    let sum = 0; const missing = [];
    for (const row of fixtures) {
      const fu = fixtureByKey[row.fixtureId]; if (!fu) continue;
      let raw = waterSystem === "Cold Water" ? fu.fuCold : ((fu.abbr || "").toString().toUpperCase().startsWith("WC") || (fu.abbr || "").toString().toUpperCase().startsWith("UR")) ? 0 : fu.fuHot;
      if (raw == null) { missing.push(row.fixtureId); continue; }
      sum += raw * (row.qty || 0);
    }
    return { totalFU: missing.length > 0 ? null : sum, missingFuKeys: missing };
  }, [fixtures, fixtureByKey, waterSystem]);

  const designFlow = useMemo(() => totalFU == null ? null : interpolate(db.fu2flow, standard, flushingType, totalFU), [db, standard, flushingType, totalFU]);
  
  const flow = flowOverride ?? designFlow ?? 4.82;
  const materialInfo = useMemo(() => db.materials.find(m => m.material === material), [db, material]);
  const velocitySystem = waterSystem === "Cold Water" ? "CW" : "HW";
  const velCriteria = db.velocity.find(v => v.standard === standard && v.building === building && v.system === velocitySystem);

  const calculatePipeDesign = () => {
    if (velocityMode === "Auto" && !velCriteria) { setResult({ noCriteria: true }); return; }
    if (!materialInfo) { setResult({ notFound: true }); return; }

    const sizes = db.pipeSizes.filter(p => p.material === material).sort((a, b) => a.od - b.od);
    const limit = velocityMode === "Auto" ? velCriteria.recommended : Number(manualVelocity);

    let chosen = sizes.find(p => velocityMs(flow, p.id) <= limit) || sizes[sizes.length - 1];
    if (!chosen) { setResult({ notFound: true }); return; }

    const hf = headLossHW(flow, chosen.id, materialInfo.c, 100);
    const v = velocityMs(flow, chosen.id);
    let status = velCriteria ? (v > velCriteria.maximum ? "FAIL" : v > velCriteria.recommended ? "WARNING" : "PASS") : null;
    setResult({ dn: chosen.dn, velocity: v, headLoss: hf, pressureLoss: pressureLossKPa(hf), status });
  };

  const handleExportExcel = () => {
    exportDesignToExcel({ db, standard, buildingType, waterSystem, flushingType, fixtures, fixtureByKey, material, building, velocityMode, manualVelocity });
  };

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center text-sm font-medium text-[#7D8B87]">Đang kết nối cơ sở dữ liệu...</div>;
  }

  if (!user) {
    return <AuthForm onLoginSuccess={checkUserTrial} />;
  }

  if (isTrialExpired) {
    return <ExpiredTrialScreen user={user} onLogout={handleLogout} />;
  }

  return (
    <div className="min-h-screen w-full" style={{ background: "radial-gradient(circle at 15% 0%, #FBF3E4 0%, #F6EFDF 45%, #F2ECDC 100%)" }}>
      <div className="max-w-5xl mx-auto px-5 pt-4 flex items-center justify-between">
        <div className="flex items-center gap-2 bg-white/70 backdrop-blur border border-[#EDE6D6] px-3.5 py-1.5 rounded-full text-xs text-[#243B36]">
          <User size={14} className="text-[#1F7A70]" />
          <span>{user.email}</span>
          <span className="bg-[#FEF3DE] text-[#B8791A] font-semibold px-2 py-0.5 rounded-md ml-1">
            Còn {trialDaysLeft} ngày dùng thử
          </span>
        </div>
        <button
          onClick={handleLogout}
          className="flex items-center gap-1.5 text-xs font-medium text-[#C13A3A] bg-[#FBE7E7] hover:bg-[#F8D7D7] px-3 py-1.5 rounded-full transition"
        >
          <LogOut size={13} /> Đăng xuất
        </button>
      </div>

      {screen === "m1"
        ? <Module1
            DB={db} onGoto={setScreen} onExportExcel={handleExportExcel}
            standard={standard} setStandard={setStandard}
            buildingType={buildingType} setBuildingType={setBuildingType}
            systemType={systemType} setSystemType={setSystemType}
            waterSystem={waterSystem} setWaterSystem={setWaterSystem}
            flushingType={flushingType} setFlushingType={setFlushingType}
            fixtures={fixtures} setFixtures={setFixtures}
            calculated={calculated} setCalculated={setCalculated}
            standardOptions={standardOptions} systemTypeOptions={systemTypeOptions} flushingTypeOptions={flushingTypeOptions}
            availableFixtures={availableFixtures} totalFU={totalFU} missingFuKeys={missingFuKeys}
            designFlow={designFlow}
            logActivity={logActivityToSupabase}
          />
        : <Module2
            DB={db} standard={standard} waterSystem={waterSystem} onGoto={setScreen} onExportExcel={handleExportExcel}
            material={material} setMaterial={setMaterial}
            velocityMode={velocityMode} setVelocityMode={setVelocityMode}
            manualVelocity={manualVelocity} setManualVelocity={setManualVelocity}
            building={building} setBuilding={setBuilding}
            result={result} flow={flow} setFlowOverride={setFlowOverride}
            velocitySystem={velocitySystem} velCriteria={velCriteria} onCalculate={calculatePipeDesign}
            logActivity={logActivityToSupabase}
          />
      }
    </div>
  );
}

// Mount React App
const rootElement = document.getElementById("root");
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);
</script>
</body>
</html>
