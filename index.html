function AuthForm({ onLoginSuccess }) {
  const [isSignUp, setIsSignUp] = useState(false);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [infoMsg, setInfoMsg] = useState("");

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setErrorMsg("");
    setInfoMsg("");

    try {
      if (!supabase) throw new Error("Chưa kết nối được với cơ sở dữ liệu Supabase!");
      if (isSignUp) {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        setInfoMsg("Đăng ký thành công! Bạn có thể Đăng nhập ngay bây giờ.");
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onLoginSuccess(data.user);
      }
    } catch (err) {
      setErrorMsg(err.message || "Đã xảy ra lỗi, vui lòng thử lại!");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-[#EDE6D6] p-8 max-w-md w-full">
        <div className="flex flex-col items-center mb-6 text-center">
          <div className="w-12 h-12 rounded-full bg-gradient-to-br from-[#4FB3A6] to-[#1F7A70] flex items-center justify-center mb-3">
            <Droplet size={24} className="text-white" />
          </div>
          <h2 className="text-xl font-bold text-[#1F3B36]">Pipe Design Assistant</h2>
          <p className="text-xs text-[#7D8B87] mt-1">Đăng nhập tài khoản để sử dụng công cụ (Dùng thử miễn phí {TRIAL_DAYS} ngày)</p>
        </div>

        {errorMsg && (
          <div className="mb-4 text-xs text-[#C13A3A] bg-[#FBE7E7] rounded-xl p-3 border border-[#C13A3A]/20">
            {errorMsg}
          </div>
        )}
        {infoMsg && (
          <div className="mb-4 text-xs text-[#1E8A50] bg-[#E4F6EC] rounded-xl p-3 border border-[#1E8A50]/20">
            {infoMsg}
          </div>
        )}

        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block text-xs font-medium text-[#7D8B87] mb-1">Email của bạn</label>
            <input
              type="email"
              required
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="name@company.com"
              className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-xl px-3.5 py-2.5 text-sm text-[#243B36] focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/40"
            />
          </div>
          <div>
            <label className="block text-xs font-medium text-[#7D8B87] mb-1">Mật khẩu</label>
            <input
              type="password"
              required
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="••••••••"
              className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-xl px-3.5 py-2.5 text-sm text-[#243B36] focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/40"
            />
          </div>

          <button
            type="submit"
            disabled={loading}
            className="w-full mt-2 flex items-center justify-center gap-2 rounded-2xl py-3 font-semibold text-white text-sm bg-gradient-to-r from-[#4FB3A6] to-[#1F7A70] hover:brightness-105 transition shadow-md disabled:opacity-50"
          >
            {loading ? "Đang xử lý..." : isSignUp ? "Tạo tài khoản dùng thử" : "Đăng nhập"}
          </button>
        </form>

        <div className="mt-6 text-center text-xs text-[#7D8B87]">
          {isSignUp ? "Đã có tài khoản?" : "Chưa có tài khoản?"}{" "}
          <button
            onClick={() => { setIsSignUp(!isSignUp); setErrorMsg(""); setInfoMsg(""); }}
            className="font-semibold text-[#1F7A70] hover:underline"
          >
            {isSignUp ? "Đăng nhập ngay" : "Đăng ký dùng thử miễn phí"}
          </button>
        </div>
      </div>
    </div>
  );
}

function interpolate(table, standard, type, totalFU) {
  const rows = table
    .filter(r => r.standard === standard && r.type === type && r.ls != null)
    .sort((a, b) => a.fu - b.fu);
  if (rows.length === 0) return null;
  const min = rows[0].fu, max = rows[rows.length - 1].fu;
  if (totalFU < min || totalFU > max) return null;
  for (let i = 0; i < rows.length - 1; i++) {
    const a = rows[i], b = rows[i + 1];
    if (totalFU >= a.fu && totalFU <= b.fu) {
      if (b.fu === a.fu) return a.ls;
      const t = (totalFU - a.fu) / (b.fu - a.fu);
      return a.ls + t * (b.ls - a.ls);
    }
  }
  return rows[rows.length - 1].ls;
}

function getFuRange(table, standard, type) {
  const rows = table.filter(r => r.standard === standard && r.type === type && r.ls != null);
  if (rows.length === 0) return null;
  const fus = rows.map(r => r.fu);
  return { min: Math.min(...fus), max: Math.max(...fus) };
}

function crossSectionArea(idMm) { return Math.PI * Math.pow(idMm / 2 / 1000, 2); }
function velocityMs(flowLs, idMm) { return (flowLs / 1000) / crossSectionArea(idMm); }
function headLossHW(flowLs, idMm, C, lengthM = 100) {
  return (10.67 * lengthM * Math.pow(flowLs / 1000, 1.852)) / (Math.pow(C, 1.852) * Math.pow(idMm / 1000, 4.8704));
}
function pressureLossKPa(headLossM) { return headLossM * 9.81; }
function fmt(n, d = 2) { return (n === null || n === undefined || isNaN(n)) ? "-" : Number(n).toFixed(d); }

}
function StatusPill({ status }) {
  const map = { PASS: { bg: "bg-[#E4F6EC]", text: "text-[#1E8A50]", IconComponent: CheckCircle2, label: "PASS" }, WARNING: { bg: "bg-[#FEF3DE]", text: "text-[#B8791A]", IconComponent: AlertTriangle, label: "WARNING" }, FAIL: { bg: "bg-[#FBE7E7]", text: "text-[#C13A3A]", IconComponent: XCircle, label: "FAIL" } };
  const s = map[status] || map.PASS; const { IconComponent } = s;
  return <div className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-semibold ${s.bg} ${s.text}`}><IconComponent size={15} /> {s.label}</div>;
}
function Logo({ title }) {
  return (
    <div className="flex items-center gap-2 mb-6">
      <div className="w-9 h-9 rounded-full bg-gradient-to-br from-[#4FB3A6] to-[#1F7A70] flex items-center justify-center"><Droplet size={18} className="text-white" /></div>
      <span className="font-bold tracking-tight text-[#1F3B36] text-[15px]">{title}</span>
    </div>
  );
}

function FixtureSearchSelect({ options, value, onChange, isMissing }) {
  const [open, setOpen] = useState(false); const [query, setQuery] = useState("");
  const selected = options.find(o => o._key === value);
  const filtered = query.trim() === "" ? options : options.filter(o => `${o.name || ""} ${o.abbr || ""}`.toLowerCase().includes(query.trim().toLowerCase()));
  return (
    <div className="relative">
      <button type="button" onClick={() => setOpen(!open)} className="w-full flex items-center justify-between gap-2 bg-[#FAF7EF] border border-[#E7E0CE] rounded-lg px-2.5 py-2 text-sm text-[#243B36]">
        <span className="truncate text-left">{selected ? `${selected.name}${selected.abbr ? ` (${selected.abbr})` : ""}` : "Chọn fixture"}</span>
        {selected && isMissing(selected) && <AlertTriangle size={13} className="text-[#C13A3A] shrink-0" />}
      </button>
      {open && (
        <>
          <div className="fixed inset-0 z-10" onClick={() => { setOpen(false); setQuery(""); }} />
          <div className="absolute z-20 mt-1 w-full bg-white border border-[#E7E0CE] rounded-xl shadow-lg overflow-hidden">
            <div className="p-2 border-b border-[#EDE6D6]"><div className="flex items-center gap-1.5 bg-[#FAF7EF] rounded-lg px-2 py-1.5"><Search size={13} className="text-[#9AA6A1]" /><input autoFocus value={query} onChange={e => setQuery(e.target.value)} placeholder="Tìm fixture..." className="w-full bg-transparent text-sm outline-none" /></div></div>
            <div className="max-h-52 overflow-y-auto">
              {filtered.map(f => (
                <button type="button" key={f._key} onClick={() => { onChange(f._key); setOpen(false); setQuery(""); }} className="w-full flex items-center justify-between text-left px-3 py-2 text-sm hover:bg-[#F2FAF8]">
                  <span className="truncate">{f.name}{f.abbr ? ` (${f.abbr})` : ""}</span>
                  {isMissing(f) && <span className="text-[10px] text-[#C13A3A]">thiếu FU</span>}
                </button>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function buildInitialFixtureRows(db, seedStandard, seedSystemType) {
  const pool = db.fixtures.filter(f => f.standard === seedStandard && (f.systemType ?? "") === (seedSystemType ?? ""));
  const findFirst = pred => { const f = pool.find(pred); return f ? { fixtureId: `${f.standard}||${f.systemType ?? ""}||${f.name ?? ""}||${f.abbr ?? ""}`, qty: 1 } : null; };
  return [findFirst(f => (f.abbr || "").toString().toUpperCase().startsWith("WC")), findFirst(f => (f.name || "").toLowerCase().includes("basin")), findFirst(f => (f.name || "").toLowerCase().includes("shower")), findFirst(f => (f.abbr || "").toString().toUpperCase().startsWith("UR"))].filter(Boolean);
}

function Module1({ DB, onGoto, standard, setStandard, buildingType, setBuildingType, systemType, setSystemType, waterSystem, setWaterSystem, flushingType, setFlushingType, fixtures, setFixtures, calculated, setCalculated, standardOptions, systemTypeOptions, flushingTypeOptions, availableFixtures, totalFU, missingFuKeys, designFlow, fuRange, outOfRange }) {
  const updateQty = (idx, qty) => { const copy = [...fixtures]; copy[idx] = { ...copy[idx], qty: Math.max(0, parseInt(qty) || 0) }; setFixtures(copy); setCalculated(false); };
  const removeRow = idx => { setFixtures(fixtures.filter((_, i) => i !== idx)); setCalculated(false); };
  const addRow = () => { const used = new Set(fixtures.map(f => f.fixtureId)); const next = availableFixtures.find(f => !used.has(f._key)) || availableFixtures[0]; if (next) setFixtures([...fixtures, { fixtureId: next._key, qty: 1 }]); setCalculated(false); };
  const updateFixture = (idx, fixtureId) => { const copy = [...fixtures]; copy[idx] = { ...copy[idx], fixtureId }; setFixtures(copy); setCalculated(false); };

  return (
    <div className="max-w-5xl mx-auto px-5 py-8">
      <Logo title="Water Demand Assistant" />
      <div className="grid md:grid-cols-2 gap-6">
        <div className="space-y-6">
          <Card>
            <SectionTitle icon={Settings}>Project Settings</SectionTitle>
            <Field label="Design Standard"><Select value={standard} onChange={v => { setStandard(v); setCalculated(false); }} options={standardOptions.map(v => ({ value: v, label: v }))} /></Field>
            {systemTypeOptions.length > 0 && <Field label="System Type"><Select value={systemType} onChange={v => { setSystemType(v); setCalculated(false); }} options={systemTypeOptions.map(v => ({ value: v, label: v }))} /></Field>}
            <Field label="Flushing Type"><ToggleGroup value={flushingType} onChange={v => { setFlushingType(v); setCalculated(false); }} options={flushingTypeOptions} /></Field>
            <Field label="Water System"><Toggle2 value={waterSystem} onChange={v => { setWaterSystem(v); setCalculated(false); }} leftLabel="Cold Water" rightLabel="Hot Water" leftIcon={<span>❄️</span>} rightIcon={<span>☀️</span>} /></Field>
            <Field label="Building Type"><Select value={buildingType} onChange={setBuildingType} options={["Residential", "Hotel", "Hospital"].map(v => ({ value: v, label: v }))} /></Field>
          </Card>
        </div>
        <div className="space-y-6">
          <Card>
            <SectionTitle icon={Droplet}>Add &amp; Edit Fixtures</SectionTitle>
            <div className="space-y-2">
              {fixtures.map((row, idx) => (
                <div key={idx} className="grid grid-cols-[1fr_70px_32px] items-center gap-2">
                  <FixtureSearchSelect options={availableFixtures} value={row.fixtureId} onChange={fixtureId => updateFixture(idx, fixtureId)} isMissing={f => (waterSystem === "Cold Water" ? f.fuCold : (f.fuHot ?? f.fuCold)) == null} />
                  <input type="number" min={0} value={row.qty} onChange={e => updateQty(idx, e.target.value)} className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-lg px-2 py-2 text-sm text-center" />
                  <button onClick={() => removeRow(idx)} className="text-[#C13A3A]/70 hover:text-[#C13A3A] flex justify-center"><Trash2 size={16} /></button>
                </div>
              ))}
              <button onClick={addRow} className="w-full mt-2 flex items-center justify-center gap-1.5 text-sm font-medium text-[#1F7A70] border border-dashed border-[#1F7A70]/40 rounded-xl py-2"><Plus size={15} /> Add New Fixture</button>
            </div>
          </Card>
          <PrimaryButton icon={Gauge} disabled={fixtures.length === 0} onClick={() => setCalculated(true)}>Calculate</PrimaryButton>
          <Card>
            <SectionTitle icon={TrendingUp}>Calculation Results</SectionTitle>
            <div className="grid grid-cols-2 gap-4">
              <div className="bg-[#F2FAF8] rounded-2xl p-4"><div className="text-xs text-[#7D8B87]">Total Fixture Units</div><div className="text-2xl font-bold text-[#1F7A70]">{calculated ? fmt(totalFU, 2) : "-"}</div></div>
              <div className="bg-[#FEF3DE] rounded-2xl p-4"><div className="text-xs text-[#7D8B87]">Design Flow (L/s)</div><div className="text-2xl font-bold text-[#B8791A]">{calculated ? fmt(designFlow, 3) : "-"}</div></div>
            </div>
          </Card>
          <div className="grid grid-cols-2 gap-3">
            <SecondaryButton icon={FileSpreadsheet}>Export to Excel</SecondaryButton>
            <button onClick={() => onGoto("m2")} disabled={!calculated || designFlow == null} className={`flex items-center justify-center gap-2 rounded-2xl py-2.5 text-sm font-semibold text-white transition ${(!calculated || designFlow == null) ? "bg-[#DCD5C2]" : "bg-gradient-to-r from-[#4FB3A6] to-[#1F7A70]"}`}>Send to Pipe Design <ArrowRight size={15} /></button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Module2({ DB, standard, waterSystem, designFlow, onGoto }) {
  const [flow, setFlow] = useState(() => designFlow ?? 4.82);
  const [material, setMaterial] = useState("HDPE");
  const [velocityMode, setVelocityMode] = useState("Auto");
  const [manualVelocity, setManualVelocity] = useState(2.0);
  const [building, setBuilding] = useState("Hotel");
  const [result, setResult] = useState(null);

  const materialInfo = DB.materials.find(m => m.material === material);
  const velocitySystem = waterSystem === "Cold Water" ? "CW" : "HW";
  const velCriteria = DB.velocity.find(v => v.standard === standard && v.building === building && v.system === velocitySystem);

  const calculate = () => {
    if (!velCriteria) { setResult({ noCriteria: true }); return; }
    const sizes = DB.pipeSizes.filter(p => p.material === material).sort((a, b) => a.od - b.od);
    const limit = velocityMode === "Auto" ? velCriteria.recommended : manualVelocity;
    let chosen = sizes.find(p => velocityMs(flow, p.id) <= limit) || sizes[sizes.length - 1];
    if (!chosen) { setResult({ notFound: true }); return; }
    const hf = headLossHW(flow, chosen.id, materialInfo ? materialInfo.c : 150, 100);
    const v = velocityMs(flow, chosen.id);
    let status = v > velCriteria.maximum ? "FAIL" : v > velCriteria.recommended ? "WARNING" : "PASS";
    setResult({ dn: chosen.dn, velocity: v, headLoss: hf, pressureLoss: pressureLossKPa(hf), status });
  };

  useEffect(() => { calculate(); }, [standard, waterSystem, building, material, velocityMode]);

  return (
    <div className="max-w-5xl mx-auto px-5 py-8">
      <div className="flex items-center justify-between mb-2">
        <Logo title="Pipe Design Assistant" />
        <button onClick={() => onGoto("m1")} className="flex items-center gap-1 text-sm text-[#7D8B87] hover:text-[#1F7A70] mb-6"><ArrowLeft size={14} /> Water Demand</button>
      </div>
      <div className="grid md:grid-cols-3 gap-6">
        <Card className="md:col-span-1">
          <SectionTitle icon={Settings}>Pipe Configuration</SectionTitle>
          <div className="mb-4 text-xs text-[#1F7A70] bg-[#EAF5F2] rounded-lg px-3 py-2">Standard: <strong>{standard}</strong> · Water System: <strong>{waterSystem}</strong></div>
          <Field label="Flow (L/s)"><input type="number" step="0.01" value={flow} onChange={e => setFlow(parseFloat(e.target.value) || 0)} className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-xl px-3 py-2.5 text-sm" /></Field>
          <Field label="Material"><Select value={material} onChange={setMaterial} options={DB.materials.map(m => ({ value: m.material, label: m.material }))} /></Field>
          <Field label="Building"><Select value={building} onChange={setBuilding} options={["Residential", "Hotel", "Hospital"].map(v => ({ value: v, label: v }))} /></Field>
          <Field label="Velocity Limit"><Toggle2 value={velocityMode} onChange={setVelocityMode} leftLabel="Auto" rightLabel="Manual" /></Field>
        </Card>
        <div className="md:col-span-2 space-y-6">
          <PrimaryButton icon={Gauge} onClick={calculate}>Calculate Now</PrimaryButton>
          <Card>
            <SectionTitle icon={Ruler}>Design Results</SectionTitle>
            {result?.notFound ? <div className="text-sm text-[#C13A3A]">No suitable pipe size found.</div> : (
              <div className="grid grid-cols-2 gap-4">
                <div className="bg-[#F2FAF8] rounded-2xl p-4"><div className="text-xs text-[#7D8B87]">Recommended Pipe</div><div className="text-2xl font-bold text-[#1F7A70]">{result?.dn ?? "-"}</div></div>
                <div className="bg-[#EAF1FB] rounded-2xl p-4"><div className="text-xs text-[#7D8B87]">Velocity</div><div className="text-2xl font-bold text-[#2D5FA6]">{fmt(result?.velocity, 2)} m/s</div></div>
                <div className="bg-[#FEF3DE] rounded-2xl p-4"><div className="text-xs text-[#7D8B87]">Head Loss / 100m</div><div className="text-2xl font-bold text-[#B8791A]">{fmt(result?.headLoss, 2)} m</div></div>
                <div className="bg-[#F5EFFB] rounded-2xl p-4"><div className="text-xs text-[#7D8B87]">Pressure Loss / 100m</div><div className="text-2xl font-bold text-[#7A4FB8]">{fmt(result?.pressureLoss, 1)} kPa</div></div>
              </div>
            )}
            {result && !result.notFound && <div className="mt-4 flex items-center justify-between bg-[#FAF7EF] rounded-2xl px-4 py-3"><span className="text-sm text-[#7D8B87]">Status</span><StatusPill status={result.status} /></div>}
          </Card>
        </div>
      </div>
    </div>
  );
}

/* ============================ App Component ============================ */

function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [trialDaysLeft, setTrialDaysLeft] = useState(0);
  const [isTrialExpired, setIsTrialExpired] = useState(false);

  const [screen, setScreen] = useState("m1");
  const [db, setDb] = useState(DEFAULT_DB);
  const [standard, setStandard] = useState("IPC");
  const [buildingType, setBuildingType] = useState("Hotel");
  const [systemType, setSystemType] = useState("");
  const [waterSystem, setWaterSystem] = useState("Cold Water");
  const [flushingType, setFlushingType] = useState("");
  const [fixtures, setFixtures] = useState(() => buildInitialFixtureRows(DEFAULT_DB, "IPC", ""));
  const [calculated, setCalculated] = useState(false);

  // Khôi phục phiên Supabase
  useEffect(() => {
    if (!supabase) {
      setLoading(false);
      return;
    }

    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        checkUserTrial(session.user);
      } else {
        setLoading(false);
      }
    });

    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        checkUserTrial(session.user);
      } else {
        setUser(null);
        setLoading(false);
      }
    });

    return () => subscription.unsubscribe();
  }, []);

  // Tính số ngày dùng thử còn lại
  const checkUserTrial = (userData) => {
    setUser(userData);
    const createdAt = new Date(userData.created_at);
    const now = new Date();
    const diffDays = Math.floor(Math.abs(now - createdAt) / (1000 * 60 * 60 * 24));
    
    const daysLeft = TRIAL_DAYS - diffDays;
    setTrialDaysLeft(daysLeft > 0 ? daysLeft : 0);
    setIsTrialExpired(diffDays > TRIAL_DAYS);
    setLoading(false);
  };

  const handleLogout = async () => {
    if (supabase) await supabase.auth.signOut();
    setUser(null);
  };

  const standardOptions = useMemo(() => Array.from(new Set(db.fixtures.map(f => f.standard).filter(Boolean))), [db]);
  const systemTypeOptions = useMemo(() => Array.from(new Set(db.fixtures.filter(f => f.standard === standard && f.systemType).map(f => f.systemType))), [db, standard]);
  const flushingTypeOptions = useMemo(() => Array.from(new Set(db.fu2flow.filter(r => r.standard === standard && r.type).map(r => r.type))), [db, standard]);
  const availableFixtures = useMemo(() => db.fixtures.filter(f => f.standard === standard && (systemTypeOptions.length === 0 || f.systemType === systemType)).map(f => ({ ...f, _key: `${f.standard}||${f.systemType ?? ""}||${f.name ?? ""}||${f.abbr ?? ""}` })), [db, standard, systemType, systemTypeOptions]);
  const fixtureByKey = useMemo(() => { const map = {}; availableFixtures.forEach(f => { map[f._key] = f; }); return map; }, [availableFixtures]);

  const { totalFU, missingFuKeys } = useMemo(() => {
    let sum = 0; const missing = [];
    for (const row of fixtures) {
      const fu = fixtureByKey[row.fixtureId]; if (!fu) continue;
      let raw = waterSystem === "Cold Water" ? fu.fuCold : ((fu.abbr || "").toString().toUpperCase().startsWith("WC") || (fu.abbr || "").toString().toUpperCase().startsWith("UR")) ? 0 : fu.fuHot;
      if (raw == null) { missing.push(row.fixtureId); continue; }
      sum += raw * (row.qty || 0);
    }
    return { totalFU: missing.length > 0 ? null : sum, missingFuKeys: missing };
  }, [fixtures, fixtureByKey, waterSystem]);

  const designFlow = useMemo(() => totalFU == null ? null : interpolate(db.fu2flow, standard, flushingType, totalFU), [db, standard, flushingType, totalFU]);

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center text-sm font-medium text-[#7D8B87]">Đang kết nối cơ sở dữ liệu...</div>;
  }

  if (!user) {
    return <AuthForm onLoginSuccess={checkUserTrial} />;
  }

  if (isTrialExpired) {
    return <ExpiredTrialScreen user={user} onLogout={handleLogout} />;
  }

  return (
    <div className="min-h-screen w-full" style={{ background: "radial-gradient(circle at 15% 0%, #FBF3E4 0%, #F6EFDF 45%, #F2ECDC 100%)" }}>
      <div className="max-w-5xl mx-auto px-5 pt-4 flex items-center justify-between">
        <div className="flex items-center gap-2 bg-white/70 backdrop-blur border border-[#EDE6D6] px-3.5 py-1.5 rounded-full text-xs text-[#243B36]">
          <User size={14} className="text-[#1F7A70]" />
          <span>{user.email}</span>
          <span className="bg-[#FEF3DE] text-[#B8791A] font-semibold px-2 py-0.5 rounded-md ml-1">
            Còn {trialDaysLeft} ngày dùng thử
          </span>
        </div>
        <button
          onClick={handleLogout}
          className="flex items-center gap-1.5 text-xs font-medium text-[#C13A3A] bg-[#FBE7E7] hover:bg-[#F8D7D7] px-3 py-1.5 rounded-full transition"
        >
          <LogOut size={13} /> Đăng xuất
        </button>
      </div>

      {screen === "m1"
        ? <Module1
            DB={db} onGoto={setScreen}
            standard={standard} setStandard={setStandard}
            buildingType={buildingType} setBuildingType={setBuildingType}
            systemType={systemType} setSystemType={setSystemType}
            waterSystem={waterSystem} setWaterSystem={setWaterSystem}
            flushingType={flushingType} setFlushingType={setFlushingType}
            fixtures={fixtures} setFixtures={setFixtures}
            calculated={calculated} setCalculated={setCalculated}
            standardOptions={standardOptions} systemTypeOptions={systemTypeOptions} flushingTypeOptions={flushingTypeOptions}
            availableFixtures={availableFixtures} totalFU={totalFU} missingFuKeys={missingFuKeys}
            designFlow={designFlow}
          />
        : <Module2 DB={db} standard={standard} waterSystem={waterSystem} designFlow={designFlow} onGoto={setScreen} />
      }
    </div>
  );
}

// Mount React App
const rootElement = document.getElementById("root");
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);
</script>
</body>
