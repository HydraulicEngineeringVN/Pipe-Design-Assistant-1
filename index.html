/* ============================ helpers ============================ */
function interpolate(table, standard, type, totalFU) {
  const rows = table
    .filter(r => r.standard === standard && r.type === type && r.ls != null)
    .sort((a, b) => a.fu - b.fu);
  if (rows.length === 0) return null;
  const min = rows[0].fu, max = rows[rows.length - 1].fu;
  if (totalFU < min || totalFU > max) return null;
  for (let i = 0; i < rows.length - 1; i++) {
    const a = rows[i], b = rows[i + 1];
    if (totalFU >= a.fu && totalFU <= b.fu) {
      if (b.fu === a.fu) return a.ls;
      const t = (totalFU - a.fu) / (b.fu - a.fu);
      return a.ls + t * (b.ls - a.ls);
    }
  }
  return rows[rows.length - 1].ls;
}
function getFuRange(table, standard, type) {
  const rows = table.filter(r => r.standard === standard && r.type === type && r.ls != null);
  if (rows.length === 0) return null;
  const fus = rows.map(r => r.fu);
  return { min: Math.min(...fus), max: Math.max(...fus) };
}
function crossSectionArea(idMm) {
  const r = idMm / 2 / 1000;
  return Math.PI * r * r;
}
function velocityMs(flowLs, idMm) {
  const flowM3s = flowLs / 1000;
  const area = crossSectionArea(idMm);
  return flowM3s / area;
}
function headLossHW(flowLs, idMm, C, lengthM = 100) {
  const Q = flowLs / 1000;
  const D = idMm / 1000;
  const hf = (10.67 * lengthM * Math.pow(Q, 1.852)) / (Math.pow(C, 1.852) * Math.pow(D, 4.8704));
  return hf;
}
function pressureLossKPa(headLossM) {
  return headLossM * 9.81;
}
function fmt(n, d = 2) {
  if (n === null || n === undefined || isNaN(n)) return "-";
  return Number(n).toFixed(d);
}

function buildInitialFixtureRows(db, seedStandard, seedSystemType) {
  const pool = db.fixtures.filter(f => f.standard === seedStandard && (f.systemType ?? "") === (seedSystemType ?? ""));
  const findFirst = pred => {
    const f = pool.find(pred);
    if (!f) return null;
    const key = `${f.standard}||${f.systemType ?? ""}||${f.name ?? ""}||${f.abbr ?? ""}`;
    return { fixtureId: key, qty: 1 };
  };
  const rows = [
    findFirst(f => (f.abbr || "").toString().toUpperCase().startsWith("WC")),
    findFirst(f => (f.name || "").toLowerCase().includes("basin")),
    findFirst(f => (f.name || "").toLowerCase().includes("shower")),
    findFirst(f => (f.abbr || "").toString().toUpperCase().startsWith("UR")),
  ];
  return rows.filter(Boolean);
}

function sheetRows(wb, name) {
  const ws = wb.Sheets[name];

}
function parseWorkbook(wb) {
  const pipeSizes = sheetRows(wb, "Pipe_Sizes")
    .filter(r => r[0] != null && r[0] !== "ID")
    .map(r => ({ material: r[1], dn: r[4], od: r[5], id: r[6] }));
  const materials = sheetRows(wb, "Material")
    .filter(r => r[0] != null && r[0] !== "Material")
    .map(r => ({ material: r[0], c: r[1], roughness: r[3] }));
  const fixtures = sheetRows(wb, "Fixture Unit")
    .filter(r => r[0] != null && r[0] !== "Standard")
    .map(r => ({
      standard: r[0], systemType: r[1],
      name: typeof r[2] === "string" ? r[2].trim() : r[2],
      abbr: r[3], fuCold: r[4], fuHot: r[5], fuTotal: r[6],
    }));
  const fu2flow = sheetRows(wb, "FU to flowrate")
    .filter(r => r[0] != null && r[0] !== "Standard")
    .map(r => ({ standard: r[0], type: r[1], fu: r[2], ls: r[4] }))
    .filter(r => typeof r.fu === "number");
  const velocity = sheetRows(wb, "Velocity Criteria")
    .filter(r => r[0] != null && r[0] !== "Standard")
    .map(r => ({ standard: r[0], building: r[1], system: r[2], recommended: r[3], maximum: r[4] }));

}
const IMPORTED_DB_STORAGE_KEY = "imported-database-v1";
function computeTotalFUForWaterSystem(fixtures, fixtureByKey, waterSystemChoice) {
  const isIneligible = f => {
    const a = (f.abbr || "").toString().toUpperCase();
    return a.startsWith("WC") || a.startsWith("UR");
  };
  let sum = 0;
  const missing = [];
  for (const row of fixtures) {
    if (row.type === "custom") {
      if (row.inputMode !== "FU") { continue; } 
      const raw = waterSystemChoice === "Cold Water" ? row.fuCold : row.fuHot;
      if (raw === null || raw === undefined || !Number.isFinite(raw)) { missing.push(row.id); continue; }
      sum += raw * (row.qty || 0);
      continue;
    }
    const fu = fixtureByKey[row.fixtureId];
    if (!fu) continue;
    let raw;
    if (waterSystemChoice === "Cold Water") raw = fu.fuCold;
    else if (isIneligible(fu)) raw = 0;
    else raw = fu.fuHot;
    if (raw === null || raw === undefined) { missing.push(row.fixtureId); continue; }
    sum += raw * (row.qty || 0);
  }
  return { total: missing.length > 0 ? null : sum, missing };
}

  let sum = 0;

    const raw = waterSystemChoice === "Cold Water" ? row.flowCold : row.flowHot;
    if (raw === null || raw === undefined || !Number.isFinite(raw)) continue;
    sum += raw * (row.qty || 0);
  }
  return sum;
}

function migrateStandardTypo(db) {
  if (!db) return db;
  const FIX = { "AS NSZ": "AS NZS" };
  const fixStd = s => (s in FIX ? FIX[s] : s);
  return {
    ...db,
    fixtures: Array.isArray(db.fixtures)
      ? db.fixtures.map(f => (f.standard in FIX ? { ...f, standard: fixStd(f.standard) } : f))
      : db.fixtures,
    fu2flow: Array.isArray(db.fu2flow)
      ? db.fu2flow.map(r => (r.standard in FIX ? { ...r, standard: fixStd(r.standard) } : r))
      : db.fu2flow,
    velocity: Array.isArray(db.velocity)
      ? db.velocity.map(v => (v.standard in FIX ? { ...v, standard: fixStd(v.standard) } : v))
      : db.velocity,
  };
}

  constructor(props) {

  static getDerivedStateFromError(error) {

  const handleExportExcel = () => {

      window.alert("Vui lòng chọn Design Standard và Water System trước khi xuất Excel.");
      return;
    }
    if (allFixtures.length === 0) {
      window.alert("Chưa có fixture nào trong Water Demand. Vui lòng thêm fixture trước khi xuất Excel.");
      return;
    }
    try {
      exportDesignToExcel({
        db, standard, buildingType, systemType, waterSystem, flushingType,
        fixtures: allFixtures, fixtureByKey,
        material, building, velocityMode, manualVelocity,
      });
    } catch (err) {
      console.error("Export Excel lỗi runtime:", err);
      window.alert("Không thể xuất Excel. Vui lòng thử lại.");
    }
  };
  return (
    <ErrorBoundary>
    <div className="min-h-screen w-full" style={{
      background: "radial-gradient(circle at 15% 0%, #FBF3E4 0%, #F6EFDF 45%, #F2ECDC 100%)"
    }}>
      {/* Thêm thanh hiển thị thông tin User & Đăng xuất */}
      <div className="max-w-5xl mx-auto px-5 pt-4 flex items-center justify-between">
        <div className="flex items-center gap-2 bg-white/70 backdrop-blur border border-[#EDE6D6] px-3.5 py-1.5 rounded-full text-xs text-[#243B36]">
          <User size={14} className="text-[#1F7A70]" />
          <span>{user.email}</span>
          <span className="bg-[#FEF3DE] text-[#B8791A] font-semibold px-2 py-0.5 rounded-md ml-1">
            Còn {trialDaysLeft} ngày dùng thử
          </span>
        </div>
        <button
          onClick={onLogout}
          className="flex items-center gap-1.5 text-xs font-medium text-[#C13A3A] bg-[#FBE7E7] hover:bg-[#F8D7D7] px-3 py-1.5 rounded-full transition"
        >
          <LogOut size={13} /> Đăng xuất
        </button>
      </div>
      <ImportBar
        usingCustom={usingCustom}
        onImport={handleImport}
        onReset={handleReset}
      />
      
      {screen === "m1"
        ? <Module1
            DB={db} onGoto={setScreen} onExportExcel={handleExportExcel}
            standard={standard} setStandard={setStandard}
            buildingType={buildingType} setBuildingType={setBuildingType}
            systemType={systemType} setSystemType={setSystemType}
            waterSystem={waterSystem} setWaterSystem={setWaterSystem}
            flushingType={flushingType} setFlushingType={setFlushingType}
            dbFixtures={dbFixtures} setDbFixtures={setDbFixtures}
            customFixtures={customFixtures} setCustomFixtures={setCustomFixtures}
            allFixtures={allFixtures}
            calculated={calculated} setCalculated={setCalculated}
            standardOptions={standardOptions} systemTypeOptions={systemTypeOptions} flushingTypeOptions={flushingTypeOptions}
            availableFixtures={availableFixtures} totalFU={totalFU} missingFuKeys={missingFuKeys}
            designFlow={designFlow} fuRange={fuRange} outOfRange={outOfRange}
            customFUContribution={customFUContribution}
            logActivity={logActivityToSupabase}
          />
        : <Module2
            DB={db} standard={standard} waterSystem={waterSystem} onGoto={setScreen} onExportExcel={handleExportExcel}
            material={material} setMaterial={setMaterial}
            velocityMode={velocityMode} setVelocityMode={setVelocityMode}
            manualVelocity={manualVelocity} setManualVelocity={setManualVelocity}
            building={building} setBuilding={setBuilding}
            result={result} flow={flow} setFlowOverride={setFlowOverride}
            velocitySystem={velocitySystem} velCriteria={velCriteria} onCalculate={calculatePipeDesign}
            logActivity={logActivityToSupabase}
          />
      }
    </div>
    </ErrorBoundary>
  );
}
// ==== THAY ĐỔI: APP GỐC LÀ NGƯỜI QUẢN LÝ PHIÊN AUTH ====
export default function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [trialDaysLeft, setTrialDaysLeft] = useState(0);
  const [isTrialExpired, setIsTrialExpired] = useState(false);
  React.useEffect(() => {
    if (!supabase) {
      setLoading(false);
      return;
    }
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        checkUserTrial(session.user);
      } else {
        setLoading(false);
      }
    });
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        checkUserTrial(session.user);
      } else {
        setUser(null);
        setLoading(false);
      }
    });
    return () => subscription.unsubscribe();
  }, []);
  // FIX (theo yêu cầu): thêm khả năng ADMIN GIA HẠN qua Supabase, KHÔNG đổi hành vi mặc định.
  // Mặc định vẫn tính hạn = created_at + TRIAL_DAYS (giống hệt code cũ, không ảnh hưởng user cũ).
  // Nếu admin set cột profiles.trial_expires_at (Table Editor) cho 1 user cụ thể, giá trị đó
  // ĐƯỢC ƯU TIÊN dùng thay cho công thức mặc định — đây là cách admin "kéo dài ngày" qua Supabase.
  const checkUserTrial = async (userData) => {
    setUser(userData);
    const createdAt = new Date(userData.created_at);
    let expiresAt = new Date(createdAt.getTime() + TRIAL_DAYS * 24 * 60 * 60 * 1000); // mặc định như cũ

    try {
      const { data: profileRow } = await supabase
        .from('profiles')
        .select('trial_expires_at')
        .eq('id', userData.id)
        .maybeSingle();
      if (profileRow && profileRow.trial_expires_at) {
        expiresAt = new Date(profileRow.trial_expires_at); // admin đã gia hạn -> dùng mốc này
      }
    } catch (errProfile) {
      console.log("Không đọc được trial_expires_at, dùng mặc định created_at+TRIAL_DAYS:", errProfile);
    }

    const now = new Date();
    const daysLeft = Math.ceil((expiresAt.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
    setTrialDaysLeft(daysLeft > 0 ? daysLeft : 0);
    setIsTrialExpired(now.getTime() > expiresAt.getTime());
    setLoading(false);
  };
  const handleLogout = async () => {
    if (supabase) await supabase.auth.signOut();
    setUser(null);
  };
  if (loading) {
    return <div className="min-h-screen flex items-center justify-center text-sm font-medium text-[#7D8B87]">Đang kết nối cơ sở dữ liệu...</div>;
  }
  if (!user) {
    return <AuthForm onLoginSuccess={checkUserTrial} />;
  }
  if (isTrialExpired) {
    return <ExpiredTrialScreen user={user} onLogout={handleLogout} />;
  }
  // Khởi chạy App chính sau khi đã vượt qua vòng kiểm tra Auth
  return <MainApp user={user} trialDaysLeft={trialDaysLeft} onLogout={handleLogout} />;
}
// ==== Mount ====
import ReactDOM from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
