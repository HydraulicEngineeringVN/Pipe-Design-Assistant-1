// STEP 4 APPROVED FIX: KHÔNG còn clamp âm thầm khi Total FU nằm ngoài khoảng dữ liệu.
// - Trong khoảng [min, max] (bao gồm 2 đầu mút): giữ nguyên nội suy tuyến tính như trước,
//   khớp chính xác giá trị Demand tại các điểm có sẵn trong DB.
// - Ngoài khoảng: trả về null (out-of-range) thay vì mượn giá trị min/max — không suy diễn,
//   không tạo ra một điểm toán học mới ngoài database.
function interpolate(table, standard, type, totalFU) {
  const rows = table
    .filter(r => r.standard === standard && r.type === type && r.ls != null)
    .sort((a, b) => a.fu - b.fu);
  if (rows.length === 0) return null;
  const min = rows[0].fu, max = rows[rows.length - 1].fu;
  if (totalFU < min || totalFU > max) return null; // out-of-range — không còn clamp
  for (let i = 0; i < rows.length - 1; i++) {
    const a = rows[i], b = rows[i + 1];
    if (totalFU >= a.fu && totalFU <= b.fu) {
      if (b.fu === a.fu) return a.ls;
      const t = (totalFU - a.fu) / (b.fu - a.fu);
      return a.ls + t * (b.ls - a.ls);
    }
  }
  return rows[rows.length - 1].ls; // an toàn dự phòng, thực tế không đạt tới do đã lọc range ở trên
}

// Lấy khoảng FU khả dụng của 1 nhóm (Standard+Type) để hiển thị cảnh báo out-of-range.
// Không đụng vào interpolate() — hàm phụ trợ riêng, chỉ phục vụ hiển thị.
function getFuRange(table, standard, type) {
  const rows = table.filter(r => r.standard === standard && r.type === type && r.ls != null);
  if (rows.length === 0) return null;
  const fus = rows.map(r => r.fu);
  return { min: Math.min(...fus), max: Math.max(...fus) };
}

function crossSectionArea(idMm) {
  const r = idMm / 2 / 1000; // m
  return Math.PI * r * r; // m^2
}

function velocityMs(flowLs, idMm) {
  const flowM3s = flowLs / 1000;
  const area = crossSectionArea(idMm);
  return flowM3s / area;
}

// Hazen-Williams head loss, SI form: hf = 10.67 * L * Q^1.852 / (C^1.852 * D^4.8704), Q in m3/s, D in m
function headLossHW(flowLs, idMm, C, lengthM = 100) {
  const Q = flowLs / 1000;
  const D = idMm / 1000;
  const hf = (10.67 * lengthM * Math.pow(Q, 1.852)) / (Math.pow(C, 1.852) * Math.pow(D, 4.8704));
  return hf; // m per `lengthM` meters
}

function pressureLossKPa(headLossM) {
  return headLossM * 9.81; // kPa, since 1 m water column ~= 9.81 kPa
}

function fmt(n, d = 2) {
  if (n === null || n === undefined || isNaN(n)) return "-";
  return Number(n).toFixed(d);
}

/* ============================ Fixture searchable selector ============================ */
// Thay thế <select> gốc bằng ô tìm kiếm + danh sách cuộn được, phù hợp với database dài.
// KHÔNG tạo nguồn dữ liệu fixture riêng: nhận nguyên `options` (đã lọc theo Standard/System Type
// từ db.fixtures ở component cha) và trả về đúng composite key (_key) khi chọn — giữ nguyên cơ chế
// định danh ổn định đã cài ở bước trước.
function FixtureSearchSelect({ options, value, onChange, isMissing }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");

  const selected = options.find(o => o._key === value);
  const q = query.trim().toLowerCase();
  const filtered = q === ""
    ? options
    : options.filter(o => `${o.name || ""} ${o.abbr || ""}`.toLowerCase().includes(q));

  return (
    <div className="relative">
      <button
        type="button"
        onClick={() => setOpen(o => !o)}
        className="w-full flex items-center justify-between gap-2 bg-[#FAF7EF] border border-[#E7E0CE] rounded-lg px-2.5 py-2 text-sm text-[#243B36] focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/30"
      >
        <span className="truncate text-left">
          {selected ? `${selected.name}${selected.abbr ? ` (${selected.abbr})` : ""}` : "Chọn fixture"}
        </span>
        {selected && isMissing(selected) && <AlertTriangle size={13} className="text-[#C13A3A] shrink-0" />}
      </button>

      {open && (
        <>
          {/* Lớp phủ trong suốt để đóng danh sách khi chạm ra ngoài — không đổi layout tổng thể */}
          <div className="fixed inset-0 z-10" onClick={() => { setOpen(false); setQuery(""); }} />
          <div className="absolute z-20 mt-1 w-full bg-white border border-[#E7E0CE] rounded-xl shadow-lg overflow-hidden">
            <div className="p-2 border-b border-[#EDE6D6]">
              <div className="flex items-center gap-1.5 bg-[#FAF7EF] rounded-lg px-2 py-1.5">
                <Search size={13} className="text-[#9AA6A1] shrink-0" />
                <input
                  autoFocus
                  value={query}
                  onChange={e => setQuery(e.target.value)}
                  placeholder="Tìm theo tên hoặc mã fixture..."
                  className="w-full bg-transparent text-sm outline-none text-[#243B36]"
                />
              </div>
            </div>
            <div className="max-h-52 overflow-y-auto">
              {filtered.length === 0 && (
                <div className="px-3 py-3 text-xs text-[#9AA6A1]">Không tìm thấy fixture phù hợp.</div>
              )}
              {filtered.map(f => {
                const miss = isMissing(f);
                const isSelected = f._key === value;
                return (
                  <button
                    type="button"
                    key={f._key}
                    onClick={() => { onChange(f._key); setOpen(false); setQuery(""); }}
                    className={`w-full flex items-center justify-between gap-2 text-left px-3 py-2 text-sm transition ${
                      isSelected ? "bg-[#EAF5F2] text-[#1F7A70] font-medium" : "text-[#243B36] hover:bg-[#F2FAF8]"
                    }`}
                  >
                    <span className="truncate">{f.name}{f.abbr ? ` (${f.abbr})` : ""}</span>
                    {miss && <span className="text-[10px] font-medium text-[#C13A3A] shrink-0">thiếu FU</span>}
                  </button>
                );
              })}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function Module1({ DB, onSendFlow, onGoto }) {
  // STEP 5: "IPC" ở đây chỉ là giá trị khởi tạo tạm (seed) cho lần render đầu tiên,
  // KHÔNG phải danh sách lựa chọn hard-code. Ngay sau khi standardOptions tính được từ DB,
  // effect bên dưới sẽ tự sửa nếu "IPC" không tồn tại trong DB hiện tại.
  const [standard, setStandard] = useState("IPC");
  const [buildingType, setBuildingType] = useState("Hotel");
  const [systemType, setSystemType] = useState("");
  const [waterSystem, setWaterSystem] = useState("Cold Water");
  const [flushingType, setFlushingType] = useState("");
  const [fixtures, setFixtures] = useState([]);
  const [calculated, setCalculated] = useState(false);

  // STEP 5 — DANH SÁCH ĐỘNG: Design Standard lấy DISTINCT giá trị từ DB.fixtures[].standard.
  // Không hard-code ["IPC","BS EN"] nữa. Loại bỏ null/undefined/rỗng.
  const standardOptions = useMemo(() => {
    const set = new Set();
    DB.fixtures.forEach(f => { if (f.standard) set.add(f.standard); });
    return Array.from(set);
  }, [DB]);

  // Nếu Standard đang chọn không còn tồn tại trong DB hiện tại (VD sau khi import DB khác,
  // hoặc lần đầu mở app với DB không có "IPC") -> tự chuyển về lựa chọn đầu tiên có sẵn.
  React.useEffect(() => {
    if (standardOptions.length > 0 && !standardOptions.includes(standard)) {
      setStandard(standardOptions[0]);
    }
  }, [standardOptions]); // eslint-disable-line react-hooks/exhaustive-deps

  // STEP 5 — DANH SÁCH ĐỘNG: System Type lấy DISTINCT giá trị từ DB.fixtures[].systemType,
  // CHỈ trong phạm vi Standard đang chọn. Không hard-code ["Small","Medium","Large"],
  // không hard-code tên "BS EN" — Standard nào có systemType thì tự động có selector này.
  const systemTypeOptions = useMemo(() => {
    const set = new Set();
    DB.fixtures.forEach(f => {
      if (f.standard === standard && f.systemType != null && f.systemType !== "") set.add(f.systemType);
    });
    return Array.from(set);
  }, [DB, standard]);

  React.useEffect(() => {
    if (systemTypeOptions.length > 0 && !systemTypeOptions.includes(systemType)) {
      setSystemType(systemTypeOptions[0]);
    } else if (systemTypeOptions.length === 0 && systemType !== "") {
      setSystemType("");
    }
  }, [systemTypeOptions]); // eslint-disable-line react-hooks/exhaustive-deps

  // STEP 5 — DANH SÁCH ĐỘNG: Flushing Type lấy DISTINCT giá trị từ DB.fu2flow[].type,
  // CHỈ trong phạm vi Standard đang chọn. Không hard-code ["Flush tank","Flush valve"].
  const flushingTypeOptions = useMemo(() => {
    const set = new Set();
    DB.fu2flow.forEach(r => { if (r.standard === standard && r.type) set.add(r.type); });
    return Array.from(set);
  }, [DB, standard]);

  React.useEffect(() => {
    if (flushingTypeOptions.length > 0 && !flushingTypeOptions.includes(flushingType)) {
      setFlushingType(flushingTypeOptions[0]);
    }
  }, [flushingTypeOptions]); // eslint-disable-line react-hooks/exhaustive-deps

  // STEP 1-2-3-4 (bước trước) + FIX ISSUE 1: Danh sách fixture khả dụng lấy động từ DB.fixtures
  // (nguồn duy nhất), lọc theo Standard đang chọn (+ System Type nếu Standard đó CÓ System Type).
  //
  // STEP 5 FIX: bỏ hard-code so sánh tên `standard !== "BS EN"` — thay bằng kiểm tra
  // `systemTypeOptions.length === 0` (tức Standard hiện tại không có khái niệm System Type nào
  // trong DB), áp dụng đúng cho bất kỳ Standard nào, không riêng gì "BS EN".
  //
  // ISSUE 1 FIX: thay _id = vị trí mảng (không ổn định khi import lại DB với thứ tự dòng khác)
  // bằng composite key xác định từ chính dữ liệu: Standard + System Type + Fixture type (name) + Abbreviation.
  // Đã kiểm tra trên database hiện tại: 50/50 dòng có composite key này là DUY NHẤT (không trùng),
  // nên đủ điều kiện làm khóa định danh ổn định. Nếu sau này import DB khác mà xuất hiện 2 dòng
  // trùng đúng cả 4 trường này, ứng dụng sẽ không tự suy đoán thêm — cần báo lại để xử lý riêng
  // (xem "Vấn đề còn tồn đọng" cuối báo cáo).
  const fixtureKey = f => `${f.standard}||${f.systemType ?? ""}||${f.name ?? ""}||${f.abbr ?? ""}`;

  const availableFixtures = useMemo(() => {
    return DB.fixtures
      .filter(f => f.standard === standard && (systemTypeOptions.length === 0 || f.systemType === systemType))
      .map(f => ({ ...f, _key: fixtureKey(f) }));
  }, [DB, standard, systemType, systemTypeOptions]);

  // Tra cứu nhanh theo _key (khóa ổn định) thay vì theo abbr hoặc index mảng
  const fixtureByKey = useMemo(() => {
    const map = {};
    availableFixtures.forEach(f => { map[f._key] = f; });
    return map;
  }, [availableFixtures]);

  // Khi đổi Standard hoặc System Type, danh sách fixture khả dụng thay đổi hoàn toàn
  // -> các dòng fixture đang chọn (tham chiếu theo _key cũ) không còn hợp lệ, cần reset.
  const prevKeyRef = React.useRef(`${standard}|${systemType}`);
  React.useEffect(() => {
    const key = `${standard}|${systemType}`;
    if (prevKeyRef.current !== key) {
      prevKeyRef.current = key;
      setFixtures([]);
      setCalculated(false);
    }
  }, [standard, systemType]);

  // FIX ISSUE 2 (bước trước): Không được coi FU null (dữ liệu thiếu) là 0 một cách âm thầm.
  //
  // STEP 4 FIX — Quy tắc kỹ thuật Hot Water đã được bạn xác nhận trực tiếp (không suy diễn từ DB,
  // vì database không có field "Hot Water Applicable" tường minh — đã kiểm tra sheet Fixture Unit,
  // chỉ có 7 cột: Standard, System Type, Fixture type, Abbreviations, FU Cold, FU Hot, Total FU):
  //   - WC (mọi biến thể) KHÔNG đóng góp nhu cầu Hot Water.
  //   - UR / Urinal (mọi biến thể) KHÔNG đóng góp nhu cầu Hot Water.
  // Nhận diện 2 loại này qua field `abbr` đã có sẵn trong DB (không tạo bảng phân loại mới,
  // không suy đoán cho bất kỳ loại fixture nào khác ngoài 2 loại đã được xác nhận):
  //   IPC:   WCprc, WCprv, WCpuc, WCpuv (bắt đầu bằng "WC") | URv25, URv20, URc (bắt đầu bằng "UR")
  //   BS EN: "WC" | "Ur" (không phân biệt hoa/thường khi so khớp)
  // Với 2 loại này ở Hot Water: ép cứng đóng góp = 0 — KHÔNG dùng FU Cold, KHÔNG dùng FU Hot lưu
  // trong DB (dù IPC có sẵn FU Hot=0, BS EN có FU Hot=null) — luôn là 0 theo đúng quy tắc kỹ thuật,
  // không phải "thiếu dữ liệu".
  // Với mọi fixture khác ở Hot Water: dùng đúng FU Hot trong DB, KHÔNG fallback sang FU Cold nữa
  // (fallback cũ là một giả định không được xác nhận — đã bỏ). Nếu FU Hot null ở đây, đó là
  // dữ liệu thiếu thật sự và vẫn bị chặn như FIX ISSUE 2.
  // Cold Water: không đổi gì — WC/UR vẫn dùng FU Cold bình thường như trước.
  const isHotWaterIneligible = f => {
    const a = (f.abbr || "").toString().toUpperCase();
    return a.startsWith("WC") || a.startsWith("UR");
  };

  const { totalFU, missingFuKeys } = useMemo(() => {
    let sum = 0;
    const missing = [];
    for (const row of fixtures) {
      const fu = fixtureByKey[row.fixtureId];
      if (!fu) continue; // chưa chọn fixture hợp lệ, không phải lỗi dữ liệu

      let raw;
      if (waterSystem === "Cold Water") {
        raw = fu.fuCold;
      } else if (isHotWaterIneligible(fu)) {
        raw = 0; // WC/UR: quy tắc kỹ thuật đã xác nhận, không phải giá trị suy đoán
      } else {
        raw = fu.fuHot; // không còn fallback sang fuCold
      }

      if (raw === null || raw === undefined) {
        missing.push(row.fixtureId);
        continue; // KHÔNG cộng như 0 — bỏ qua khỏi tổng, đánh dấu thiếu dữ liệu
      }
      sum += raw * (row.qty || 0);
    }
    return { totalFU: missing.length > 0 ? null : sum, missingFuKeys: missing };
  }, [fixtures, fixtureByKey, waterSystem]);

  const designFlow = useMemo(() => {
    if (totalFU == null) return null;
    return interpolate(DB.fu2flow, standard, flushingType, totalFU);
  }, [DB, standard, flushingType, totalFU]);

  // Khoảng FU khả dụng của nhóm đang chọn (chỉ để hiển thị cảnh báo, không ảnh hưởng phép tính)
  const fuRange = useMemo(() => getFuRange(DB.fu2flow, standard, flushingType), [DB, standard, flushingType]);

  // Xác định trạng thái out-of-range để hiển thị cảnh báo — dựa trên kết quả interpolate() đã trả null
  // + so sánh với fuRange, không tự suy diễn logic mới ngoài những gì interpolate() đã quyết định.
  const outOfRange = useMemo(() => {
    if (totalFU == null || !fuRange) return null;
    if (totalFU < fuRange.min) return "below";
    if (totalFU > fuRange.max) return "above";
    return null;
  }, [totalFU, fuRange]);

  const updateQty = (idx, qty) => {
    const copy = [...fixtures];
    copy[idx] = { ...copy[idx], qty: Math.max(0, parseInt(qty) || 0) };
    setFixtures(copy);
    setCalculated(false);
  };
  const removeRow = idx => { setFixtures(fixtures.filter((_, i) => i !== idx)); setCalculated(false); };
  const addRow = () => {
    const used = new Set(fixtures.map(f => f.fixtureId));
    const next = availableFixtures.find(f => !used.has(f._key)) || availableFixtures[0];
    if (!next) return; // Không còn fixture nào trong DB để thêm
    setFixtures([...fixtures, { fixtureId: next._key, qty: 1 }]);
    setCalculated(false);
  };
  const updateFixture = (idx, fixtureId) => {
    const copy = [...fixtures];
    copy[idx] = { ...copy[idx], fixtureId };
    setFixtures(copy);
    setCalculated(false);
  };

  const canCalc = fixtures.length > 0;

  return (
    <div className="max-w-5xl mx-auto px-5 py-8">
      <Logo title="Water Demand Assistant" />

      <div className="grid md:grid-cols-2 gap-6">
        {/* Left column */}
        <div className="space-y-6">
          <Card>
            <SectionTitle icon={Settings}>Project Settings</SectionTitle>
            {/* Thứ tự chọn theo đúng phân cấp: Standard -> System Type (nếu Standard đó có) -> Flushing Type -> Water System.
                Building Type giữ lại làm thông tin dự án (không ảnh hưởng phép tính Module 1),
                đặt sau cùng để không phá vỡ phân cấp lựa chọn kỹ thuật chính. */}
            <Field label="Design Standard">
              <Select
                value={standard}
                onChange={v => { setStandard(v); setCalculated(false); }}
                options={standardOptions.map(v => ({ value: v, label: v }))}
              />
            </Field>
            {systemTypeOptions.length > 0 && (
              <Field label="System Type">
                <Select
                  value={systemType}
                  onChange={v => { setSystemType(v); setCalculated(false); }}
                  options={systemTypeOptions.map(v => ({ value: v, label: v }))}
                />
              </Field>
            )}
            <Field label="Flushing Type (toàn dự án)">
              <ToggleGroup
                value={flushingType}
                onChange={v => { setFlushingType(v); setCalculated(false); }}
                options={flushingTypeOptions}
              />
            </Field>
            <Field label="Water System">
              <Toggle2
                value={waterSystem}
                onChange={v => { setWaterSystem(v); setCalculated(false); }}
                leftLabel="Cold Water" rightLabel="Hot Water"
                leftIcon={<span>❄️</span>} rightIcon={<span>☀️</span>}
              />
            </Field>
            <Field label="Building Type (thông tin dự án)">
              <Select
                value={buildingType}
                onChange={setBuildingType}
                options={["Residential", "Hotel", "Hospital"].map(v => ({ value: v, label: v }))}
              />
            </Field>
          </Card>
        </div>

        {/* Right column */}
        <div className="space-y-6">
          <Card>
            <SectionTitle icon={Droplet}>Add &amp; Edit Fixtures</SectionTitle>
            <div className="space-y-2">
              <div className="grid grid-cols-[1fr_70px_32px] text-xs font-medium text-[#7D8B87] px-1">
                <span>Fixture</span><span className="text-center">Qty</span><span />
              </div>
              {fixtures.map((row, idx) => (
                <div key={idx} className="grid grid-cols-[1fr_70px_32px] items-center gap-2">
                  <FixtureSearchSelect
                    options={availableFixtures}
                    value={row.fixtureId}
                    onChange={fixtureId => updateFixture(idx, fixtureId)}
                    isMissing={f => {
                      const raw = waterSystem === "Cold Water" ? f.fuCold : (f.fuHot ?? f.fuCold);
                      return raw === null || raw === undefined;
                    }}
                  />
                  <input
                    type="number" min={0} value={row.qty}
                    onChange={e => updateQty(idx, e.target.value)}
                    className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-lg px-2 py-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/30"
                  />
                  <button onClick={() => removeRow(idx)} className="text-[#C13A3A]/70 hover:text-[#C13A3A] flex justify-center">
                    <Trash2 size={16} />
                  </button>
                </div>
              ))}
              <button onClick={addRow} className="w-full mt-2 flex items-center justify-center gap-1.5 text-sm font-medium text-[#1F7A70] border border-dashed border-[#1F7A70]/40 rounded-xl py-2 hover:bg-[#F2FAF8]">
                <Plus size={15} /> Add New Fixture
              </button>
            </div>
          </Card>

          <PrimaryButton icon={Gauge} disabled={!canCalc} onClick={() => setCalculated(true)}>
            Calculate
          </PrimaryButton>

          <Card>
            <SectionTitle icon={TrendingUp}>Calculation Results</SectionTitle>
            <div className="grid grid-cols-2 gap-4">
              <div className="bg-[#F2FAF8] rounded-2xl p-4">
                <div className="text-xs text-[#7D8B87] mb-1">Total Fixture Units</div>
                <div className="text-2xl font-bold text-[#1F7A70]">{calculated ? fmt(totalFU, 2) : "-"}</div>
              </div>
              <div className="bg-[#FEF3DE] rounded-2xl p-4">
                <div className="text-xs text-[#7D8B87] mb-1">Design Flow (L/s)</div>
                <div className="text-2xl font-bold text-[#B8791A]">{calculated ? fmt(designFlow, 3) : "-"}</div>
              </div>
            </div>
            {calculated && missingFuKeys.length > 0 && (
              <div className="mt-3 text-xs text-[#C13A3A] bg-[#FBE7E7] rounded-xl p-3">
                Không thể tính: có {missingFuKeys.length} fixture đang chọn thiếu dữ liệu FU trong database (xem ghi chú "— thiếu dữ liệu FU" trong danh sách fixture ở trên).
              </div>
            )}
            {calculated && outOfRange && (
              <div className="mt-3 text-xs text-[#C13A3A] bg-[#FBE7E7] rounded-xl p-3">
                ⚠ Total FU nằm {outOfRange === "below" ? "dưới" : "trên"} phạm vi database FU-to-flowrate ({standard} + {flushingType}).
                <br />
                Total FU: {fmt(totalFU, 2)} — Phạm vi khả dụng: {fuRange?.min} – {fuRange?.max} FU.
                <br />
                Design Flow: chưa xác định.
              </div>
            )}
          </Card>

          <div className="grid grid-cols-2 gap-3">
            <SecondaryButton icon={FileSpreadsheet}>Export to Excel</SecondaryButton>
            <button
              onClick={() => { onSendFlow({ flow: designFlow, standard, waterSystem }); onGoto("m2"); }}
              disabled={!calculated || designFlow == null}
              className={`flex items-center justify-center gap-2 rounded-2xl py-2.5 text-sm font-semibold text-white transition
                ${(!calculated || designFlow == null) ? "bg-[#DCD5C2] cursor-not-allowed" : "bg-gradient-to-r from-[#4FB3A6] to-[#1F7A70] hover:brightness-105"}`}
            >
              Send to Pipe Design <ArrowRight size={15} />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================ Module 2 ============================ */

function Module2({ DB, incomingContext, onGoto }) {
  // STEP 8: nhận flow + Standard + Water System từ Module 1 qua incomingContext,
  // KHÔNG còn tự chọn/áp đặt Standard hay Water System nào trong Module 2.
  const [flow, setFlow] = useState(incomingContext?.flow ?? 4.82);
  const [context, setContext] = useState(incomingContext); // { flow, standard, waterSystem } | null
  const [material, setMaterial] = useState("HDPE");
  const [velocityMode, setVelocityMode] = useState("Auto");
  const [manualVelocity, setManualVelocity] = useState(2.0);
  const [building, setBuilding] = useState("Hotel");
  const [result, setResult] = useState(null);

  React.useEffect(() => {
    if (incomingContext != null) {
      setFlow(incomingContext.flow);
      setContext(incomingContext);
    }
  }, [incomingContext]);

  const materialInfo = DB.materials.find(m => m.material === material);

  // STEP 8 FIX: bỏ hard-code "IPC"/"CW", bỏ fallback DB.velocity[0].
  // Dùng đúng Standard + Water System nhận từ Module 1 (qua context).
  // waterSystem "Cold Water"/"Hot Water" là 2 giá trị cố định đã có sẵn trong logic hiện tại
  // (không phải danh sách lựa chọn cần lấy động) -> mapping sang "CW"/"HW" là hợp lệ, không phải hard-code dữ liệu.
  const velocitySystem = context?.waterSystem === "Cold Water" ? "CW"
    : context?.waterSystem === "Hot Water" ? "HW"
    : null;

  const velCriteria = (context && velocitySystem)
    ? DB.velocity.find(v => v.standard === context.standard && v.building === building && v.system === velocitySystem)
    : undefined;

  const calculate = () => {
    // Không có context (chưa từng nhận từ Module 1) hoặc không tìm thấy đúng dòng Velocity Criteria
    // trong DB cho Standard + Building + Water System hiện tại -> KHÔNG fallback, KHÔNG tự PASS/WARNING/FAIL.
    if (!velCriteria) { setResult({ noCriteria: true }); return; }

    const sizes = DB.pipeSizes.filter(p => p.material === material).sort((a, b) => a.od - b.od);
    const limit = velocityMode === "Auto" ? velCriteria.recommended : manualVelocity;

    let chosen = null;
    for (const p of sizes) {
      const v = velocityMs(flow, p.id);
      if (v <= limit) { chosen = { ...p, velocity: v }; break; }
    }
    if (!chosen && sizes.length > 0) {
      const last = sizes[sizes.length - 1];
      chosen = { ...last, velocity: velocityMs(flow, last.id) };
    }
    if (!chosen) { setResult({ notFound: true }); return; }

    const hf = headLossHW(flow, chosen.id, materialInfo.c, 100);
    const pLoss = pressureLossKPa(hf);

    let status = "PASS";
    if (chosen.velocity > velCriteria.maximum) status = "FAIL";
    else if (chosen.velocity > velCriteria.recommended) status = "WARNING";

    setResult({ dn: chosen.dn, velocity: chosen.velocity, headLoss: hf, pressureLoss: pLoss, status });
  };

  React.useEffect(() => { calculate(); /* eslint-disable-next-line */ }, [context, building, material, velocityMode]);

  return (
    <div className="max-w-5xl mx-auto px-5 py-8">
      <div className="flex items-center justify-between mb-2">
        <Logo title="Pipe Design Assistant" />
        <button onClick={() => onGoto("m1")} className="flex items-center gap-1 text-sm text-[#7D8B87] hover:text-[#1F7A70] mb-6">
          <ArrowLeft size={14} /> Water Demand
        </button>
      </div>

      <div className="grid md:grid-cols-3 gap-6">
        <Card className="md:col-span-1">
          <SectionTitle icon={Settings}>Pipe Configuration</SectionTitle>
          {/* STEP 8: hiển thị tối thiểu context nhận từ Module 1 — không phải selector mới,
              chỉ để kỹ sư biết Velocity Criteria đang tra theo Standard/Water System nào. */}
          {context ? (
            <div className="mb-4 text-xs text-[#1F7A70] bg-[#EAF5F2] rounded-lg px-3 py-2">
              Standard: <strong>{context.standard}</strong> · Water System: <strong>{context.waterSystem}</strong> (từ Module 1)
            </div>
          ) : (
            <div className="mb-4 text-xs text-[#B8791A] bg-[#FEF3DE] rounded-lg px-3 py-2">
              Chưa nhận Standard/Water System từ Module 1 — hãy quay lại Module 1 và bấm "Send to Pipe Design".
            </div>
          )}
          <Field label="Flow (L/s)">
            <input
              type="number" step="0.01" value={flow}
              onChange={e => setFlow(parseFloat(e.target.value) || 0)}
              className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/30"
            />
          </Field>
          <Field label="Material">
            <Select value={material} onChange={setMaterial} options={DB.materials.map(m => ({ value: m.material, label: m.material }))} />
          </Field>
          <Field label="Building (Velocity Criteria)">
            <Select value={building} onChange={setBuilding} options={["Residential", "Hotel", "Hospital"].map(v => ({ value: v, label: v }))} />
          </Field>
          <Field label="Velocity Limit">
            <Toggle2 value={velocityMode} onChange={setVelocityMode} leftLabel="Auto" rightLabel="Manual" />
          </Field>
          {velocityMode === "Manual" && (
            <Field label="Manual Velocity (m/s)">
              <input
                type="number" step="0.1" value={manualVelocity}
                onChange={e => setManualVelocity(parseFloat(e.target.value) || 0)}
                className="w-full bg-[#FAF7EF] border border-[#E7E0CE] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#1F7A70]/30"
              />
            </Field>
          )}
          {velocityMode === "Auto" && velCriteria && (
            <p className="text-xs text-[#7D8B87] mt-2 leading-relaxed">
              Auto dùng ngưỡng Recommended = {velCriteria.recommended} m/s (Max {velCriteria.maximum} m/s) từ Database ({context.standard} + {building} + {velocitySystem}).
            </p>
          )}
          {velocityMode === "Auto" && context && !velCriteria && (
            <p className="text-xs text-[#C13A3A] mt-2 leading-relaxed">
              ⚠ Không có Velocity Criteria trong database cho {context.standard} + {building} + {velocitySystem}.
            </p>
          )}
        </Card>

        <div className="md:col-span-2 space-y-6">
          <PrimaryButton icon={Gauge} onClick={calculate}>Calculate Now</PrimaryButton>

          <Card>
            <SectionTitle icon={Ruler}>Design Results</SectionTitle>
            {result?.noCriteria ? (
              <div className="text-sm text-[#C13A3A] bg-[#FBE7E7] rounded-xl p-4">
                Velocity Criteria không có trong database cho Standard + Building + Water System đang chọn
                {context ? ` (${context.standard} + ${building} + ${velocitySystem}).` : " (chưa có Standard/Water System từ Module 1)."}
              </div>
            ) : result?.notFound ? (
              <div className="text-sm text-[#C13A3A] bg-[#FBE7E7] rounded-xl p-4">
                No suitable pipe size found.
              </div>
            ) : (
              <div className="grid grid-cols-2 gap-4">
                <div className="bg-[#F2FAF8] rounded-2xl p-4">
                  <div className="text-xs text-[#7D8B87] mb-1">Recommended Pipe</div>
                  <div className="text-2xl font-bold text-[#1F7A70]">{result?.dn ?? "-"}</div>
                </div>
                <div className="bg-[#EAF1FB] rounded-2xl p-4">
                  <div className="text-xs text-[#7D8B87] mb-1">Velocity</div>
                  <div className="text-2xl font-bold text-[#2D5FA6]">{fmt(result?.velocity, 2)} m/s</div>
                </div>
                <div className="bg-[#FEF3DE] rounded-2xl p-4">

// Đọc 1 sheet ra mảng-mảng (header:1), bỏ dòng trống đầu/cuối
function sheetRows(wb, name) {
  const ws = wb.Sheets[name];
  if (!ws) return [];
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
}

function parseWorkbook(wb) {
  const pipeSizes = sheetRows(wb, "Pipe_Sizes")
    .filter(r => r[0] != null && r[0] !== "ID")
    .map(r => ({ material: r[1], dn: r[4], od: r[5], id: r[6] }));

  const materials = sheetRows(wb, "Material")
    .filter(r => r[0] != null && r[0] !== "Material")
    .map(r => ({ material: r[0], c: r[1], roughness: r[3] }));

  const fixtures = sheetRows(wb, "Fixture Unit")
    .filter(r => r[0] != null && r[0] !== "Standard")
    .map(r => ({
      standard: r[0], systemType: r[1],
      name: typeof r[2] === "string" ? r[2].trim() : r[2],
      abbr: r[3], fuCold: r[4], fuHot: r[5], fuTotal: r[6],
    }));

  const fu2flow = sheetRows(wb, "FU to flowrate")
    .filter(r => r[0] != null && r[0] !== "Standard")
    .map(r => ({ standard: r[0], type: r[1], fu: r[2], ls: r[4] }))
    .filter(r => typeof r.fu === "number");

  const velocity = sheetRows(wb, "Velocity Criteria")
    .filter(r => r[0] != null && r[0] !== "Standard")
    .map(r => ({ standard: r[0], building: r[1], system: r[2], recommended: r[3], maximum: r[4] }));

  return { pipeSizes, materials, fixtures, fu2flow, velocity };
}

// Khóa lưu trữ database cá nhân (shared:false) — chỉ người dùng hiện tại thấy được,
// không phải database "Publish" dùng chung (chưa triển khai ở bước này theo đúng yêu cầu).
const IMPORTED_DB_STORAGE_KEY = "imported-database-v1-export-1786430137800-33xoru";

/* ============================ STEP 11: Update JSX Source / Export JSX / Export HTML ============================ */

// Giải mã base64 an toàn cho UTF-8 (btoa/atob gốc của trình duyệt không xử lý đúng ký tự ngoài Latin1,
// ví dụ dấu tiếng Việt trong comment) — dùng đúng cặp encode/decode đối xứng với script build (Python) đã tạo 2 blob trên.
function b64DecodeUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

// STEP 14 Phần A — diagnostic thuần (không đổi hành vi app), phục vụ debug: tóm tắt nhanh 1 database.
function getDatabaseSummary(db) {
  const standards = Array.from(new Set((db.fixtures || []).map(f => f.standard).filter(Boolean)));
  return {
    standardCount: standards.length,
    standards,
    fixtureCount: (db.fixtures || []).length,
    flowRecordCount: (db.fu2flow || []).length,
    velocityCriteriaCount: (db.velocity || []).length,
  };
}

// STEP 11 / Phần 14: validate database TRƯỚC khi cho phép Update JSX Source Database / Export JSX / Export HTML.
// Chỉ kiểm tra cấu trúc + đúng 1 lỗi chính tả Standard đã biết cụ thể ("AS NSZ") — không suy diễn thêm quy tắc nào khác,
// không phán đoán "đúng/sai" cho các Standard chưa từng được xác nhận.
function validateDbForPublish(db) {
  const errors = [];
  if (!db) { errors.push("Database rỗng."); return { ok: false, errors }; }

  ["pipeSizes", "materials", "fixtures", "fu2flow", "velocity"].forEach(key => {
    if (!Array.isArray(db[key]) || db[key].length === 0) {
      errors.push(`Sheet tương ứng "${key}" rỗng hoặc không hợp lệ (cần là mảng có ít nhất 1 dòng).`);
    }
  });
  if (errors.length > 0) return { ok: false, errors }; // dừng sớm nếu thiếu cấu trúc cơ bản, tránh lỗi dây chuyền bên dưới

  // Không được lọt "AS NSZ" (lỗi chính tả đã xác nhận cụ thể ở Step 9/10) vào bản publish.
  const hasTypo =
    db.fixtures.some(f => f.standard === "AS NSZ") ||
    db.fu2flow.some(r => r.standard === "AS NSZ") ||
    db.velocity.some(v => v.standard === "AS NSZ");
  if (hasTypo) {
    errors.push('Phát hiện "AS NSZ" (lỗi chính tả Standard đã biết) trong database — cần migrate/sửa trước khi publish.');
  }

  // Kiểm tra trùng composite key fixture (Standard+SystemType+FixtureType+Abbr) — dùng đúng công thức khóa
  // đã cài trong Module 1 (fixtureKey), viết lại độc lập ở đây CHỈ cho mục đích validate, không đụng Module 1.
  const seen = new Map();
  const dupKeys = [];
  db.fixtures.forEach(f => {
    const k = `${f.standard}||${f.systemType ?? ""}||${f.name ?? ""}||${f.abbr ?? ""}`;
    if (seen.has(k)) dupKeys.push(k); else seen.set(k, true);
  });
  if (dupKeys.length > 0) {
    errors.push(`Phát hiện ${dupKeys.length} composite key fixture bị trùng (không xác định được duy nhất) — VD: "${dupKeys[0]}".`);
  }

  // Cảnh báo (không chặn publish): Standard có trong Fixture Unit nhưng hoàn toàn không có dòng FU→Flow nào tương ứng
  // -> Design Flow sẽ luôn không tính được cho Standard đó. Chỉ báo cáo qua "warnings", không tự coi là lỗi cứng
  // vì có thể là chủ đích tạm thời của bạn khi đang cập nhật dữ liệu dần.
  const fixtureStandards = new Set(db.fixtures.map(f => f.standard).filter(Boolean));
  const flowStandards = new Set(db.fu2flow.map(r => r.standard).filter(Boolean));
  const warnings = [];
  fixtureStandards.forEach(std => {
    if (!flowStandards.has(std)) warnings.push(`Standard "${std}" có Fixture Unit nhưng KHÔNG có dòng FU→Flow nào tương ứng.`);
  });

  return { ok: errors.length === 0, errors, warnings };
}

// STEP 14 FIX — ROOT CAUSE (lần 1, đã sửa): buildExportedJsxSource()/buildExportedHtmlSource() luôn nhúng
// ĐÚNG database runtime truyền vào (db tham số), không hề dùng DEFAULT_DB cũ — đã kiểm chứng nhiều lần bằng
// dữ liệu v4 thật. Nguyên nhân còn lại đã xử lý: mỗi lần export, sinh 1 storage key DUY NHẤT (gắn timestamp),
// để không thể bị ghi đè bởi bất kỳ dữ liệu cũ nào dưới key "imported-database-v1" gốc.
//
// ROOT CAUSE (lần 2, vừa phát hiện và sửa ở đây): bản mẫu tự nhân bản (APP_SOURCE_TEMPLATE_B64/APP_HTML_TEMPLATE_B64)
// trước đây được build TRƯỚC KHI panel "Database Tools" này được thêm vào file — nên mọi file Export JSX/HTML
// trước đây đều THIẾU HẲN panel này (dù dữ liệu DEFAULT_DB vẫn đúng). Đã sửa bằng cách build lại 2 blob này
// từ đúng bản đầy đủ cuối cùng (bao gồm cả chính panel này) — xem xác nhận ở báo cáo cuối.
function generateUniqueStorageKey() {
  return `imported-database-v1-export-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

// Chèn database hiện tại (đã validate) vào đúng vị trí placeholder trong template — chỉ thay khối DEFAULT_DB,
// giữ nguyên 100% phần còn lại của mã nguồn (không rewrite/format lại toàn bộ file).
function buildExportedJsxSource(db) {
  const template = b64DecodeUtf8(APP_SOURCE_TEMPLATE_B64);
  const dbLiteral = `const DEFAULT_DB = ${JSON.stringify(db)};`;
  const keyLiteral = `const IMPORTED_DB_STORAGE_KEY = "${generateUniqueStorageKey()}";`;
  return template
    .replace(/const DEFAULT_DB = __DEFAULT_DB_JSON_PLACEHOLDER__;/, dbLiteral)
    .replace(/const IMPORTED_DB_STORAGE_KEY = "__STORAGE_KEY_PLACEHOLDER__";/, keyLiteral);
}

function buildExportedHtmlSource(db) {
  const template = b64DecodeUtf8(APP_HTML_TEMPLATE_B64);
  const dbLiteral = `const DEFAULT_DB = ${JSON.stringify(db)};`;
  const keyLiteral = `const IMPORTED_DB_STORAGE_KEY = "${generateUniqueStorageKey()}";`;
  return template
    .replace(/const DEFAULT_DB = __DEFAULT_DB_JSON_PLACEHOLDER__;/, dbLiteral)
    .replace(/const IMPORTED_DB_STORAGE_KEY = "__STORAGE_KEY_PLACEHOLDER__";/, keyLiteral);
}

function downloadTextFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function DatabaseToolsPanel({ db, usingCustom }) {
  const [msg, setMsg] = useState(null);

  const handlePublishAction = (kind) => {
    const v = validateDbForPublish(db);
    if (!v.ok) {
      setMsg({ ok: false, text: "Không thể publish — " + v.errors.join(" | ") });
      return;
    }
    try {
      const stamp = new Date().toISOString().slice(0, 10);
      if (kind === "jsx") {
        const src = buildExportedJsxSource(db);
        downloadTextFile(`PipeDesignAssistant_${stamp}.jsx`, src, "text/plain;charset=utf-8");
      } else if (kind === "html") {
        const src = buildExportedHtmlSource(db);
        downloadTextFile(`PipeDesignAssistant_${stamp}.html`, src, "text/html;charset=utf-8");
      }
      const warnText = v.warnings && v.warnings.length > 0 ? ` (⚠ ${v.warnings.length} cảnh báo — xem console)` : "";
      if (v.warnings && v.warnings.length > 0) console.warn("Database publish warnings:", v.warnings);
      const summary = getDatabaseSummary(db);
      setMsg({
        ok: true,
        text: (kind === "jsx" ? "Đã tạo file .jsx mới." : "Đã tạo file .html mới.")
          + ` Đã nhúng ${summary.standardCount} Standard: ${summary.standards.join(", ")}.`
          + warnText,
      });
    } catch (e) {
      setMsg({ ok: false, text: "Lỗi khi tạo file: " + ((e && e.message) || String(e)) });
    }
  };

  return (
    <div className="max-w-5xl mx-auto px-5 pt-3">
      <div className="flex flex-wrap items-center gap-2 bg-white/50 backdrop-blur border border-[#EDE6D6] rounded-2xl px-4 py-2">
        <span className="text-[11px] font-semibold text-[#7D8B87] uppercase tracking-wide mr-1">Database Tools:</span>
        <button
          onClick={() => handlePublishAction("jsx")}
          className="text-xs font-medium text-[#1F7A70] bg-[#EAF5F2] hover:bg-[#DFF0EC] px-3 py-1.5 rounded-full transition"
        >
          Update JSX Source Database
        </button>
        <button
          onClick={() => handlePublishAction("jsx")}
          className="text-xs font-medium text-[#1F7A70] bg-[#EAF5F2] hover:bg-[#DFF0EC] px-3 py-1.5 rounded-full transition"
        >
          Export JSX
        </button>
        <button
          onClick={() => handlePublishAction("html")}
          className="text-xs font-medium text-[#1F7A70] bg-[#EAF5F2] hover:bg-[#DFF0EC] px-3 py-1.5 rounded-full transition"
        >
          Export HTML
        </button>
        {msg && (
          <span className={`text-xs ${msg.ok ? "text-[#1E8A50]" : "text-[#C13A3A]"}`}>{msg.text}</span>
        )}

function ImportBar({ onImport, usingCustom, onReset }) {
  const inputRef = useRef(null);
  const [msg, setMsg] = useState(null);

  const handleFile = async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const db = parseWorkbook(wb);
      if (db.pipeSizes.length === 0 || db.fixtures.length === 0) {
        throw new Error("Không tìm thấy đủ sheet (Pipe_Sizes, Fixture Unit...) trong file.");
      }
      // Chỉ sau khi validate thành công mới cập nhật runtime DB + thử lưu vào personal storage.
      const persistResult = await onImport(db);
      const baseText = `Đã nạp: ${db.pipeSizes.length} pipe sizes, ${db.fixtures.length} fixtures, ${db.fu2flow.length} FU→Flow, ${db.velocity.length} velocity criteria.`;
      if (persistResult && persistResult.persisted) {
        setMsg({ ok: true, text: `${baseText} Đã lưu — vẫn dùng được sau khi tải lại trang.` });
      } else {
        setMsg({ ok: true, text: `${baseText} ⚠ Lưu trữ thất bại — vẫn dùng được trong phiên này, nhưng sẽ mất khi tải lại trang.` });
      }
    } catch (err) {
      // Import không hợp lệ -> KHÔNG đổi runtime DB (onImport chưa được gọi), báo lỗi rõ ràng.
      setMsg({ ok: false, text: "Lỗi đọc file: " + err.message });
    } finally {
      e.target.value = "";
    }
  };

  return (
    <div className="max-w-5xl mx-auto px-5 pt-5">
      <div className="flex flex-wrap items-center gap-3 bg-white/70 backdrop-blur border border-[#EDE6D6] rounded-2xl px-4 py-2.5">

          >
            <RotateCcw size={13} /> Dùng lại dữ liệu mặc định

        )}
        {/* Chỉ báo nguồn database — vị trí có sẵn, tái sử dụng nguyên trạng, không thêm UI mới */}
        <span className={`text-xs ${usingCustom ? "text-[#1F7A70]" : "text-[#B7BEB9]"}`}>
          {usingCustom ? "● Database: Imported" : "○ Database: Default"}
        </span>
        {msg && (
          <span className={`text-xs ${msg.ok ? "text-[#1E8A50]" : "text-[#C13A3A]"}`}>{msg.text}</span>
        )}
      </div>
    </div>
  );
}

// STEP 10 — Migration tối thiểu cho ĐÚNG 1 lỗi chính tả Standard đã xác nhận cụ thể trong lịch sử dự án:
// "AS NSZ" (bản Excel v3 cũ, có thể còn sót trong personal storage) -> "AS NZS" (đúng, từ v4 trở đi).
// CHỈ thay giá trị chuỗi ở field `standard` của 3 mảng liên quan — KHÔNG đụng bất kỳ field kỹ thuật nào khác
// (FU Cold/Hot, Demand L/s, Recommended/Maximum...). Không phải cơ chế chuẩn hoá Standard tổng quát,
// không áp dụng cho bất kỳ chuỗi nào khác ngoài đúng cặp lỗi đã xác nhận này.
function migrateStandardTypo(db) {
  if (!db) return db;
  const FIX = { "AS NSZ": "AS NZS" };
  const fixStd = s => (s in FIX ? FIX[s] : s);
  return {
    ...db,
    fixtures: Array.isArray(db.fixtures)
      ? db.fixtures.map(f => (f.standard in FIX ? { ...f, standard: fixStd(f.standard) } : f))
      : db.fixtures,
    fu2flow: Array.isArray(db.fu2flow)
      ? db.fu2flow.map(r => (r.standard in FIX ? { ...r, standard: fixStd(r.standard) } : r))
      : db.fu2flow,
    velocity: Array.isArray(db.velocity)
      ? db.velocity.map(v => (v.standard in FIX ? { ...v, standard: fixStd(v.standard) } : v))
      : db.velocity,
  };
}

function App() {
  const [screen, setScreen] = useState("m1");
  // STEP 8: đổi từ chỉ lưu 1 số flow sang lưu cả context { flow, standard, waterSystem }
  // do Module 1 gửi sang, để Module 2 tra đúng Velocity Criteria theo Standard + Water System thực tế.
  const [sentContext, setSentContext] = useState(null);
  const [db, setDb] = useState(DEFAULT_DB);
  const [usingCustom, setUsingCustom] = useState(false);

  // STEP 9 FIX (Phần A2): chặn race condition giữa useEffect khởi động (đọc storage) và
  // handleImport/handleReset. `useRef` cập nhật ĐỒNG BỘ ngay lập tức (không như setState),
  // nên nếu người dùng import/reset TRONG LÚC useEffect khởi động vẫn đang chờ storage.get,
  // khi promise đó resolve xong nó sẽ kiểm tra cờ này và tự huỷ, không ghi đè DB vừa import/reset.
  const sessionOverrideRef = React.useRef(false);

  // STEP B1/B2: khi mở app, ưu tiên nạp database cá nhân đã lưu (Priority 1),
  // nếu không có / lỗi đọc thì im lặng giữ nguyên DEFAULT_DB đã là state khởi tạo (Priority 2 — fallback cuối).
  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const result = await window.storage.get(IMPORTED_DB_STORAGE_KEY, false);
        // STEP 9: nếu người dùng đã import hoặc reset thủ công trong lúc chờ đọc storage
        // (sessionOverrideRef.current === true) -> bỏ qua kết quả storage cũ, KHÔNG ghi đè.
        if (cancelled || sessionOverrideRef.current || !result || !result.value) return;
        const parsed = JSON.parse(result.value);
        // Kiểm tra tối thiểu để không nạp dữ liệu hỏng làm crash app — không phải validate lại toàn bộ,
        // chỉ đảm bảo đúng hình dạng cơ bản trước khi setDb.
        if (parsed && Array.isArray(parsed.pipeSizes) && Array.isArray(parsed.fixtures)) {
          // STEP 10: personal storage có thể còn giữ bản v3 cũ với lỗi "AS NSZ" (từ lần import trước
          // khi Excel chưa được bạn sửa) -> migrate tối thiểu trước khi đưa vào runtime DB.
          const migrated = migrateStandardTypo(parsed);
          setDb(migrated);
          setUsingCustom(true);
          // Nếu migration thực sự đổi gì đó (nghĩa là storage đang giữ bản có lỗi cũ) -> ghi lại bản
          // đã migrate vào storage luôn, để các lần mở app sau không cần migrate lại từ đầu.
          // Không chặn UI nếu ghi thất bại — đây chỉ là tối ưu, không phải yêu cầu bắt buộc.
          if (JSON.stringify(migrated) !== JSON.stringify(parsed)) {
            window.storage.set(IMPORTED_DB_STORAGE_KEY, JSON.stringify(migrated), false).catch(() => {});
          }
        }
      } catch (e) {
        // Không có DB cá nhân nào được lưu trước đó, hoặc lỗi đọc storage
        // -> KHÔNG crash, im lặng dùng DEFAULT_DB (đã là giá trị khởi tạo của state db).
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Chỉ được gọi sau khi ImportBar đã validate Excel thành công.
  const handleImport = async newDb => {
    // STEP 9: đánh dấu NGAY LẬP TỨC (đồng bộ, trước cả setDb) để nếu useEffect khởi động
    // vẫn đang chờ đọc storage, nó sẽ tự huỷ khi resolve xong, không ghi đè DB vừa import này.
    sessionOverrideRef.current = true;
    // STEP 10: migrate ngay cả với DB vừa import — phòng trường hợp bạn (hoặc ai khác) import lại
    // đúng file v3 cũ có lỗi chính tả; đảm bảo runtime DB và storage từ nay luôn nhất quán "AS NZS".
    // Với file v4 đã đúng sẵn, migration này là no-op (không đổi gì).
    const migrated = migrateStandardTypo(newDb);
    setDb(migrated);
    setUsingCustom(true);
    try {
      await window.storage.set(IMPORTED_DB_STORAGE_KEY, JSON.stringify(migrated), false);
      return { persisted: true };
    } catch (e) {
      // Lưu thất bại: KHÔNG revert runtime DB, vẫn dùng được trong phiên hiện tại.
      return { persisted: false, error: (e && e.message) || String(e) };
    }
  };

  const handleReset = async () => {
    // STEP 9: tương tự handleImport — chặn useEffect khởi động ghi đè lại DB cũ từ storage
    // nếu nó vẫn đang chờ resolve trong lúc người dùng bấm Reset.
    sessionOverrideRef.current = true;
    setDb(DEFAULT_DB);
    setUsingCustom(false);
    try {
      await window.storage.delete(IMPORTED_DB_STORAGE_KEY, false);
    } catch (e) {
      // Không có gì để xoá hoặc lỗi storage -> bỏ qua, không chặn thao tác reset của người dùng.
    }
  };

  return (
    <div className="min-h-screen w-full" style={{
      background: "radial-gradient(circle at 15% 0%, #FBF3E4 0%, #F6EFDF 45%, #F2ECDC 100%)"
    }}>
      <ImportBar
        usingCustom={usingCustom}
        onImport={handleImport}
        onReset={handleReset}
      />
      <DatabaseToolsPanel db={db} usingCustom={usingCustom} />
      {screen === "m1"
        ? <Module1 DB={db} onSendFlow={setSentContext} onGoto={setScreen} />
        : <Module2 DB={db} incomingContext={sentContext} onGoto={setScreen} />
      }
    </div>
  );
}


const __root = ReactDOM.createRoot(document.getElementById("root"));
__root.render(<App />);

</script>
</body>
</html>
